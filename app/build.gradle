plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.miboxiptv'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file("permanent_key.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.example.miboxiptv"
        minSdk 21
        targetSdk 33
        versionCode 17262
        versionName "2.7.62"
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-datasource:1.2.1'
}

tasks.register("cleanDuplicateMainActivity") {
    doLast {
        def mainFile = file("src/main/java/com/example/miboxiptv/MainActivity.kt")
        if (mainFile.exists()) {
            def text = mainFile.getText("UTF-8")
            int lastPkg = text.lastIndexOf("package com.example.miboxiptv")
            if (lastPkg > 0) {
                text = text.substring(lastPkg)
            }
            def endMarker = "try { player?.stop(); player?.release() } catch (_: Exception) {}"
            int endIdx = text.indexOf(endMarker)
            if (endIdx > 0) {
                int closeMethod = text.indexOf("}", endIdx + endMarker.length())
                if (closeMethod > 0) {
                    int closeClass = text.indexOf("}", closeMethod + 1)
                    if (closeClass > 0) {
                        text = text.substring(0, closeClass + 1) + "\n"
                    }
                }
            }
            mainFile.write(text, "UTF-8")
        }
    }
}

preBuild.dependsOn("cleanDuplicateMainActivity")
