plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.miboxiptv'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file("permanent_key.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.example.miboxiptv"
        minSdk 21
        targetSdk 33
        versionCode 17249
        versionName "2.7.49"
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-datasource:1.2.1'
}

tasks.register("autoFixSideMenuCrash") {
    doLast {
        def pkgDir = file("src/main/java/com/example/miboxiptv")

        // 1. Удаляем временный SettingsModals.kt, если он остался от прошлой сборки и вызывает конфликт
        def oldModals = new File(pkgDir, "SettingsModals.kt")
        if (oldModals.exists()) {
            oldModals.delete()
        }

        // 2. Создаём полноразмерный ТВ-баннер
        def drawableDir = file("src/main/res/drawable")
        drawableDir.mkdirs()
        new File(drawableDir, "tv_banner.xml").write('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="320dp" android:height="180dp"
    android:viewportWidth="320" android:viewportHeight="180">
    <path android:fillColor="#0B1026" android:pathData="M0,0h320v180h-320z" />
    <path android:fillColor="#142850" android:pathData="M0,32 C110,10 210,35 320,8 L320,180 L0,180 Z" />
    <path android:fillColor="#006978" android:pathData="M0,70 C115,48 215,72 320,42 L320,180 L0,180 Z" />
    <path android:fillColor="#00A896" android:pathData="M0,112 C120,88 220,108 320,82 L320,180 L0,180 Z" />
    <path android:fillColor="#4A148C" android:pathData="M0,148 C125,125 225,142 320,118 L320,180 L0,180 Z" />
    <path android:fillColor="#AD1457" android:pathData="M0,172 C130,155 230,166 320,148 L320,180 L0,180 Z" />
    <path android:fillColor="#090C15" android:pathData="M48,90 C95,18 225,18 272,90 C225,162 95,162 48,90 Z" />
    <path android:fillColor="#E8F1F5" android:pathData="M64,90 C105,30 215,30 256,90 C215,150 105,150 64,90 Z" />
    <path android:fillColor="#00E5FF" android:pathData="M160,90m-46,0a46,46 0,1 1,92 0a46,46 0,1 1,-92 0" />
    <path android:fillColor="#00BFA5" android:pathData="M160,90m-38,0a38,38 0,1 1,76 0a38,38 0,1 1,-76 0" />
    <path android:fillColor="#FFD54F" android:pathData="M160,44 A46,46 0 0,1 206,90 L160,90 Z" />
    <path android:fillColor="#7C4DFF" android:pathData="M160,136 A46,46 0 0,1 114,90 L160,90 Z" />
    <path android:fillColor="#05070B" android:pathData="M160,90m-22,0a22,22 0,1 1,44 0a22,22 0,1 1,-44 0" />
    <path android:fillColor="#FFFFFF" android:pathData="M172,78m-6.5,0a6.5,6.5 0,1 1,13 0a6.5,6.5 0,1 1,-13 0" />
</vector>''', "UTF-8")

        def manifestFile = file("src/main/AndroidManifest.xml")
        if (manifestFile.exists()) {
            def mText = manifestFile.getText("UTF-8")
            if (!mText.contains("@drawable/tv_banner")) {
                mText = mText.replace('android:icon="@mipmap/ic_launcher"', 'android:banner="@drawable/tv_banner"\n        android:icon="@drawable/tv_banner"')
                mText = mText.replace('android:roundIcon="@mipmap/ic_launcher"', 'android:roundIcon="@drawable/tv_banner"')
                manifestFile.write(mText, "UTF-8")
            }
        }

        // 3. Чистим CustomViews.kt от перехвата фокуса
        def customViewsFile = new File(pkgDir, "CustomViews.kt")
        if (customViewsFile.exists()) {
            def cvText = customViewsFile.getText("UTF-8")
            cvText = cvText.replace("override fun isFocused(): Boolean = forceMarqueeActive || super.isFocused()", "// removed focus override")
            cvText = cvText.replace("setSingleLine(true)\n            maxLines = 1", "// removed layout trigger")
            customViewsFile.write(cvText, "UTF-8")
        }

        // 4. Патчим MainActivity.kt: убираем молчаливое сворачивание при ошибке и защищаем showSideChannelsMode / showSideGroupsMode
        def mainFile = new File(pkgDir, "MainActivity.kt")
        if (mainFile.exists()) {
            def kText = mainFile.getText("UTF-8")

            // Убираем глушилку, которая сворачивала приложение при любом исключении в UI
            kText = kText.replace("Thread.setDefaultUncaughtExceptionHandler { _, _ -> }", "// UncaughtExceptionHandler removed so UI does not silently close")
            kText = kText.replace("fitSideListsToWholeRows()", "// fitSideListsToWholeRows() disabled")

            // Заменяем showSideChannelsMode на полностью безопасный вариант с try-catch
            def startMarker = "private fun showSideChannelsMode("
            def startMarkerInternal = "internal fun showSideChannelsMode("
            def endMarker = "private fun playSplashEyeAnimation()"
            def endMarkerInternal = "internal fun playSplashEyeAnimation()"

            int sIdx = kText.indexOf(startMarker)
            if (sIdx < 0) sIdx = kText.indexOf(startMarkerInternal)
            int eIdx = kText.indexOf(endMarker)
            if (eIdx < 0) eIdx = kText.indexOf(endMarkerInternal)

            if (sIdx > 0 && eIdx > sIdx) {
                def safeSideMethods = '''private fun showSideChannelsMode(focusCurrentChannelIfSameGroup: Boolean = true) {
        try {
            isSideShowingChannels = true
            isLeftRailVisible = false
            leftIconRail.visibility = View.GONE
            categoryListView.visibility = View.GONE
            channelRecyclerView.visibility = View.VISIBLE

            val snapshot = displayedChannels.toList()
            if (snapshot.isNotEmpty()) {
                val activeIdxInGroup = if (focusCurrentChannelIfSameGroup) {
                    snapshot.indexOfFirst { it.url == currentChannel?.url }
                } else -1
                val targetPos = if (activeIdxInGroup >= 0) activeIdxInGroup else 0
                focusedChannelPos = targetPos
                channelRvAdapter.submitChannels(snapshot, targetPos)
                channelRecyclerView.post {
                    try {
                        channelLayoutManager.scrollToPositionWithOffset(targetPos, 120)
                        val vh = channelRecyclerView.findViewHolderForAdapterPosition(targetPos)
                        if (vh != null) vh.itemView.requestFocus() else channelRecyclerView.requestFocus()
                    } catch (_: Throwable) {}
                }
            } else {
                focusedChannelPos = 0
                channelRvAdapter.submitChannels(emptyList(), 0)
            }
        } catch (t: Throwable) {
            Toast.makeText(this, "Ошибка списка: ${t.message}", Toast.LENGTH_LONG).show()
        }
    }

    private fun showSideGroupsMode() {
        try {
            isSideShowingChannels = false
            isLeftRailVisible = false
            leftIconRail.visibility = View.GONE
            focusedCategoryPos = currentCategoryIndex.coerceIn(0, (categoryAdapter.count - 1).coerceAtLeast(0))
            updateCategoriesList()
            channelRecyclerView.visibility = View.GONE
            categoryListView.visibility = View.VISIBLE
            categoryListView.post {
                try {
                    categoryListView.setSelection(focusedCategoryPos)
                    categoryListView.requestFocus()
                    refreshSimpleListHighlightInPlace(categoryListView, focusedCategoryPos)
                } catch (_: Throwable) {}
            }
        } catch (t: Throwable) {
            Toast.makeText(this, "Ошибка групп: ${t.message}", Toast.LENGTH_LONG).show()
        }
    }

    '''
                kText = kText.substring(0, sIdx) + safeSideMethods + kText.substring(eIdx)
            }

            mainFile.write(kText, "UTF-8")
        }
    }
}

preBuild.dependsOn("autoFixSideMenuCrash")
