        new File(drawableDir, "ic_launcher_foreground.xml").write('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path android:fillColor="#090C15" android:pathData="M20,54 C35,28 73,28 88,54 C73,80 35,80 20,54 Z" />
    <path android:fillColor="#E8F1F5" android:pathData="M25,54 C38,33 70,33 83,54 C70,75 38,75 25,54 Z" />
    <path android:fillColor="#00E5FF" android:pathData="M54,54m-16,0a16,16 0,1 1,32 0a16,16 0,1 1,-32 0" />
