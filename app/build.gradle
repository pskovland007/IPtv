import java.awt.Color as AwtColor
import java.awt.Font
import java.awt.GradientPaint
import java.awt.RenderingHints
import java.awt.geom.Ellipse2D
import java.awt.geom.Path2D
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.miboxiptv'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file("permanent_key.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.example.miboxiptv"
        minSdk 21
        targetSdk 33
        versionCode 17250
        versionName "2.7.50"
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-datasource:1.2.1'
}

// === НОВАЯ АРХИТЕКТУРА: ЗАМЕНА RECYCLERVIEW НА LISTVIEW + PNG БАННЕР + РАДАР ОШИБОК ===
tasks.register("rebuildSideMenuArchitecture") {
    doLast {
        def pkgDir = file("src/main/java/com/example/miboxiptv")

        // 1. Генерируем НАСТОЯЩИЙ растровый PNG-баннер 320x180 и крупную PNG-иконку 512x512 (ТВ-лаунчеры требуют растровый PNG!)
        try {
            def drawBanner = { int w, int h ->
                BufferedImage img = new BufferedImage(w, h, BufferedImage.TYPE_INT_ARGB)
                def g = img.createGraphics()
                g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)

                // Фон с яркими волнами
                g.setPaint(new GradientPaint(0f, 0f, new AwtColor(11, 16, 38), w as float, h as float, new AwtColor(173, 20, 87)))
                g.fillRect(0, 0, w, h)

                g.setPaint(new GradientPaint(0f, (h * 0.2f) as float, new AwtColor(0, 105, 120, 210), w as float, (h * 0.8f) as float, new AwtColor(74, 20, 140, 210)))
                g.fillOval((-w * 0.2) as int, (h * 0.15) as int, (w * 1.4) as int, (h * 1.1) as int)

                double cx = w / 2.0
                double cy = h / 2.0
                double rx = Math.min(w, h) * 0.44
                double ry = Math.min(w, h) * 0.28

                // Контур глаза
                Path2D outer = new Path2D.Double()
                outer.moveTo(cx - rx * 1.15, cy)
                outer.curveTo(cx - rx * 0.55, cy - ry * 1.85, cx + rx * 0.55, cy - ry * 1.85, cx + rx * 1.15, cy)
                outer.curveTo(cx + rx * 0.55, cy + ry * 1.85, cx - rx * 0.55, cy + ry * 1.85, cx - rx * 1.15, cy)
                outer.closePath()
                g.setColor(new AwtColor(9, 12, 21))
                g.fill(outer)

                // Белок
                Path2D inner = new Path2D.Double()
                inner.moveTo(cx - rx, cy)
                inner.curveTo(cx - rx * 0.48, cy - ry * 1.52, cx + rx * 0.48, cy - ry * 1.52, cx + rx, cy)
                inner.curveTo(cx + rx * 0.48, cy + ry * 1.52, cx - rx * 0.48, cy + ry * 1.52, cx - rx, cy)
                inner.closePath()
                g.setColor(new AwtColor(232, 241, 245))
                g.fill(inner)

                // Радужка
                double ir = ry * 1.02
                g.setPaint(new GradientPaint((cx - ir) as float, (cy - ir) as float, new AwtColor(0, 229, 255), (cx + ir) as float, (cy + ir) as float, new AwtColor(255, 213, 79)))
                g.fill(new Ellipse2D.Double(cx - ir, cy - ir, ir * 2, ir * 2))

                // Зрачок и блик
                double pr = ir * 0.50
                g.setColor(AwtColor.BLACK)
                g.fill(new Ellipse2D.Double(cx - pr, cy - pr, pr * 2, pr * 2))
                g.setColor(AwtColor.WHITE)
                g.fill(new Ellipse2D.Double(cx + pr * 0.22, cy - pr * 0.65, pr * 0.52, pr * 0.52))
                g.dispose()
                return img
            }

            def drawableDir = file("src/main/res/drawable")
            drawableDir.mkdirs()
            // Удаляем старый векторный tv_banner.xml, чтобы не конфликтовал с PNG
            new File(drawableDir, "tv_banner.xml").delete()
            ImageIO.write(drawBanner(320, 180), "PNG", new File(drawableDir, "tv_banner.png"))

            // Перезаписываем все ic_launcher.png во всех папках mipmap крупной иконкой без полей!
            def resDir = file("src/main/res")
            resDir.eachDirMatch(~/mipmap-.*/) { dir ->
                new File(dir, "ic_launcher.xml").delete()
                new File(dir, "ic_launcher_round.xml").delete()
                ImageIO.write(drawBanner(512, 512), "PNG", new File(dir, "ic_launcher.png"))
                ImageIO.write(drawBanner(512, 512), "PNG", new File(dir, "ic_launcher_round.png"))
            }
        } catch (Throwable ignored) {}

        // 2. Обновляем AndroidManifest.xml под PNG-баннер и стандартную иконку
        def manifestFile = file("src/main/AndroidManifest.xml")
        if (manifestFile.exists()) {
            def mText = manifestFile.getText("UTF-8")
            mText = mText.replace('android:icon="@drawable/tv_banner"', 'android:icon="@mipmap/ic_launcher"')
            mText = mText.replace('android:roundIcon="@drawable/tv_banner"', 'android:roundIcon="@mipmap/ic_launcher"')
            if (!mText.contains('android:banner="@drawable/tv_banner"')) {
                mText = mText.replace('android:icon="@mipmap/ic_launcher"', 'android:banner="@drawable/tv_banner"\n        android:icon="@mipmap/ic_launcher"')
            }
            manifestFile.write(mText, "UTF-8")
        }

        // 3. Полностью переводим боковое меню в MainActivity.kt на единый неубиваемый ListView (categoryListView) + встраиваем экранный перехватчик ошибок!
        def mainFile = new File(pkgDir, "MainActivity.kt")
        if (mainFile.exists()) {
            def kText = mainFile.getText("UTF-8")

            // Вместо тихого закрытия при ошибке выводим окно с точным текстом сбоя на экран
            def crashCatcherCode = '''Thread.setDefaultUncaughtExceptionHandler { _, e ->
            Looper.prepare()
            Toast.makeText(applicationContext, "СБОЙ: ${e.javaClass.simpleName}: ${e.message}", Toast.LENGTH_LONG).show()
            Looper.loop()
        }'''
            kText = kText.replace("Thread.setDefaultUncaughtExceptionHandler { _, _ -> }", crashCatcherCode)
            kText = kText.replace("// UncaughtExceptionHandler removed so UI does not silently close", crashCatcherCode)

            // Заменяем обработчики categoryListView и методы showSideChannelsMode / showSideGroupsMode
            // Теперь И группы, И каналы отображаются в одном и том же 100% стабильном categoryListView (ListView)!
            def oldBlockStart = "categoryAdapter = createRoundedSelectorAdapter("
            def oldBlockEnd = "applyCurrentThemeToAllPanels()"

            int bs = kText.indexOf(oldBlockStart)
            int be = kText.indexOf(oldBlockEnd)
            if (bs > 0 && be > bs) {
                def unifiedListViewLogic = '''categoryAdapter = createRoundedSelectorAdapter(mutableListOf(), 15.5f, true, fixedRowHeight = true) { pos ->
            !isLeftRailVisible && pos == (if (isSideShowingChannels) focusedChannelPos else focusedCategoryPos)
        }
        categoryListView.adapter = categoryAdapter

        categoryListView.setOnItemClickListener { _, _, position, _ ->
            resetMenuInactivityTimer()
            if (isSideShowingChannels) {
                val list = displayedChannels.toList()
                if (position in list.indices) {
                    focusedChannelPos = position
                    playChannelObj(list[position], immediate = true)
                    if (controlMode != 1) closeAllMenus()
                }
            } else {
                focusedCategoryPos = position
                selectCategory(position)
                showSideChannelsMode(focusCurrentChannelIfSameGroup = true)
            }
        }
        categoryListView.setOnItemLongClickListener { _, _, position, _ ->
            resetMenuInactivityTimer()
            if (isSideShowingChannels) {
                val list = displayedChannels.toList()
                if (position in list.indices) {
                    focusedChannelPos = position
                    toggleFavorite(list[position])
                    showSideChannelsMode(focusCurrentChannelIfSameGroup = false)
                }
                true
            } else false
        }
        categoryListView.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
            override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                resetMenuInactivityTimer()
                if (isSideShowingChannels) {
                    focusedChannelPos = position
                } else {
                    focusedCategoryPos = position
                    selectCategory(position)
                }
                refreshSimpleListHighlightInPlace(categoryListView, position)
            }
            override fun onNothingSelected(parent: AdapterView<*>?) {}
        }
        categoryListView.setOnKeyListener { _, keyCode, event ->
            if (event.action == KeyEvent.ACTION_DOWN) {
                resetMenuInactivityTimer()
                val count = categoryAdapter.count
                val curPos = if (isSideShowingChannels) focusedChannelPos else focusedCategoryPos
                when (keyCode) {
                    KeyEvent.KEYCODE_DPAD_LEFT -> {
                        if (isSideShowingChannels) {
                            showSideGroupsMode()
                        } else {
                            showLeftIconRailFromGroups()
                        }
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_RIGHT -> {
                        if (isLeftRailVisible) {
                            hideLeftIconRailToGroups()
                        } else if (!isSideShowingChannels) {
                            selectCategory(focusedCategoryPos.coerceAtLeast(0))
                            showSideChannelsMode(focusCurrentChannelIfSameGroup = true)
                        } else {
                            closeAllMenus()
                        }
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_UP -> if (count > 0 && curPos <= 0) {
                        val lastIdx = count - 1
                        if (isSideShowingChannels) focusedChannelPos = lastIdx else { focusedCategoryPos = lastIdx; selectCategory(lastIdx) }
                        categoryListView.setSelection(lastIdx)
                        refreshSimpleListHighlightInPlace(categoryListView, lastIdx)
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_DOWN -> if (count > 0 && curPos >= count - 1) {
                        if (isSideShowingChannels) focusedChannelPos = 0 else { focusedCategoryPos = 0; selectCategory(0) }
                        categoryListView.setSelection(0)
                        refreshSimpleListHighlightInPlace(categoryListView, 0)
                        return@setOnKeyListener true
                    }
                }
            }
            false
        }

        '''
                kText = kText.substring(0, bs) + unifiedListViewLogic + kText.substring(be)
            }

            // Теперь заменяем showSideChannelsMode и showSideGroupsMode так, чтобы оба работали через надёжный categoryListView!
            int sIdx = kText.indexOf("private fun showSideChannelsMode(")
            if (sIdx < 0) sIdx = kText.indexOf("internal fun showSideChannelsMode(")
            int eIdx = kText.indexOf("private fun playSplashEyeAnimation()")
            if (eIdx < 0) eIdx = kText.indexOf("internal fun playSplashEyeAnimation()")

            if (sIdx > 0 && eIdx > sIdx) {
                def newSideMethods = '''private fun showSideChannelsMode(focusCurrentChannelIfSameGroup: Boolean = true) {
        isSideShowingChannels = true
        isLeftRailVisible = false
        leftIconRail.visibility = View.GONE
        channelRecyclerView.visibility = View.GONE
        categoryListView.visibility = View.VISIBLE

        val list = displayedChannels.toList()
        val activeIdx = if (focusCurrentChannelIfSameGroup) list.indexOfFirst { it.url == currentChannel?.url } else focusedChannelPos
        val targetPos = if (activeIdx in list.indices) activeIdx else 0
        focusedChannelPos = targetPos

        val formattedChannels = if (list.isEmpty()) {
            listOf("[-]   В этой категории пока нет каналов")
        } else {
            list.mapIndexed { idx, ch ->
                val isPlaying = (ch.url == currentChannel?.url)
                val playPrefix = if (isPlaying) "[+]   " else ""
                val topBadge = if (topUrls.contains(ch.url)) "▲ " else ""
                val favBadge = if (favoriteUrls.contains(ch.url)) "★ " else ""
                "$playPrefix$topBadge$favBadge${idx + 1}. ${ch.name}"
            }
        }
        categoryAdapter.clear()
        categoryAdapter.addAll(formattedChannels)
        categoryAdapter.notifyDataSetChanged()

        categoryListView.post {
            if (formattedChannels.isNotEmpty()) {
                categoryListView.setSelectionFromTop(targetPos, (categoryListView.height / 3).coerceAtLeast(80))
                categoryListView.requestFocus()
                refreshSimpleListHighlightInPlace(categoryListView, targetPos)
            }
        }
    }

    private fun showSideGroupsMode() {
        isSideShowingChannels = false
        isLeftRailVisible = false
        leftIconRail.visibility = View.GONE
        channelRecyclerView.visibility = View.GONE
        categoryListView.visibility = View.VISIBLE

        updateCategoriesList()
        val targetPos = currentCategoryIndex.coerceIn(0, (categoryAdapter.count - 1).coerceAtLeast(0))
        focusedCategoryPos = targetPos

        categoryListView.post {
            categoryListView.setSelectionFromTop(targetPos, (categoryListView.height / 3).coerceAtLeast(80))
            categoryListView.requestFocus()
            refreshSimpleListHighlightInPlace(categoryListView, targetPos)
        }
    }

    '''
                kText = kText.substring(0, sIdx) + newSideMethods + kText.substring(eIdx)
            }

            // Чтобы updateCategoriesList() не перезатирал список каналов, когда открыты каналы:
            kText = kText.replace("private fun updateCategoriesList() {", "private fun updateCategoriesList() {\n        if (isSideShowingChannels && sidePanel.visibility == View.VISIBLE) return")

            mainFile.write(kText, "UTF-8")
        }
    }
}

preBuild.dependsOn("rebuildSideMenuArchitecture")
