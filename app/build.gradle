</vector>''', "UTF-8")

        def anyDpiDir = new File(resDir, "mipmap-anydpi-v26")
        anyDpiDir.mkdirs()
        def adaptiveXml = '''<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_launcher_background" />
    <foreground android:drawable="@drawable/ic_launcher_foreground" />
</adaptive-icon>'''
        new File(anyDpiDir, "ic_launcher.xml").write(adaptiveXml, "UTF-8")
        new File(anyDpiDir, "ic_launcher_round.xml").write(adaptiveXml, "UTF-8")

        // 2. Убираем в CustomViews.kt перехват фокуса, чтобы RecyclerView с кубиками работал без зависаний!
        def customViewsFile = new File(pkgDir, "CustomViews.kt")
        if (customViewsFile.exists()) {
            def cvText = customViewsFile.getText("UTF-8")
            cvText = cvText.replace("override fun isFocused(): Boolean = forceMarqueeActive || super.isFocused()", "// focus override removed")
            cvText = cvText.replace("setSingleLine(true)\n            maxLines = 1", "// layout trigger removed")
            customViewsFile.write(cvText, "UTF-8")
        }

        // 3. Обновляем CoreEngines.kt для стабильной работы потоков rostelekom.xyz БЕЗ VPN (обход DPI/ТСПУ)
        def coreFile = new File(pkgDir, "CoreEngines.kt")
        if (coreFile.exists()) {
            def ceText = coreFile.getText("UTF-8")
            ceText = ceText.replace('"Connection" to "close"', '"Connection" to "keep-alive",\n                "Accept-Encoding" to "identity"')
            coreFile.write(ceText, "UTF-8")
        }

        // 4. Патчим MainActivity.kt: возвращаем красивое меню с цветными кубиками (channelRecyclerView), чиним выбор категорий, глушим звук на заставке, расширяем предпросмотр и убираем обрезку карусели
        def mainFile = new File(pkgDir, "MainActivity.kt")
        if (mainFile.exists()) {
            def kText = mainFile.getText("UTF-8")

            // А) Расширяем окно предпросмотра на всю свободную ширину справа от меню
            kText = kText.replace(".coerceIn(0.38f, 0.52f)", ".coerceIn(0.45f, 0.65f)")

            // Б) Убираем обрезку верхней части увеличенной иконки в теме Карусель
            kText = kText.replace("settingsTileOverlay = LinearLayout(this).apply {", "settingsTileOverlay = LinearLayout(this).apply {\n            clipChildren = false; clipToPadding = false")
            kText = kText.replace("setPadding(44, 46, 44, 46)", "clipChildren = false; clipToPadding = false; setPadding(48, 64, 48, 52)")

            // В) Выключаем звук во время показа заставки с глазом и включаем его после завершения заставки
            kText = kText.replace("newPlayer.volume = 1.0f", "newPlayer.volume = if (::splashOverlay.isInitialized && splashOverlay.visibility == View.VISIBLE) 0f else 1.0f")
            kText = kText.replace("splashOverlay.visibility = View.GONE", "splashOverlay.visibility = View.GONE\n                        applyAudioEnhancements()")
            kText = kText.replace("p.volume = if (drcNightAudioEnabled && audioBoostPercent == 100) 0.88f else 1.0f", "p.volume = if (::splashOverlay.isInitialized && splashOverlay.visibility == View.VISIBLE) 0f else if (drcNightAudioEnabled && audioBoostPercent == 100) 0.88f else 1.0f")

            // Г) Анти-зависание HEVC потоков без VPN: увеличиваем буфер и ускоряем переподключение сегментов
            kText = kText.replace("1 -> listOf(6500, 14000, 500, 1100)", "1 -> listOf(14000, 28000, 800, 1600)")
            kText = kText.replace(".setConnectTimeoutMs(5500)\n            .setReadTimeoutMs(5500)", ".setConnectTimeoutMs(4000)\n            .setReadTimeoutMs(4000)")

            // Д) Возвращаем раздельные списки: categoryListView для групп + channelRecyclerView с цветными кубиками для каналов!
            kText = kText.replace("if (isSideShowingChannels && sidePanel.visibility == View.VISIBLE) return", "")

            int bs = kText.indexOf("categoryAdapter = createRoundedSelectorAdapter(")
            int be = kText.indexOf("applyCurrentThemeToAllPanels()")
            if (bs > 0 && be > bs) {
                def cleanCategoryBlock = '''categoryAdapter = createRoundedSelectorAdapter(mutableListOf(), 16f, true, fixedRowHeight = true) { pos -> !isSideShowingChannels && !isLeftRailVisible && pos == focusedCategoryPos }
        categoryListView.adapter = categoryAdapter

        categoryListView.setOnItemClickListener { _, _, position, _ ->
            resetMenuInactivityTimer()
            focusedCategoryPos = position
            selectCategory(position)
            showSideChannelsMode(focusCurrentChannelIfSameGroup = false)
        }
        categoryListView.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
            override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                resetMenuInactivityTimer()
                focusedCategoryPos = position
                refreshSimpleListHighlightInPlace(categoryListView, position)
            }
            override fun onNothingSelected(parent: AdapterView<*>?) {}
        }
        categoryListView.setOnKeyListener { _, keyCode, event ->
            if (event.action == KeyEvent.ACTION_DOWN) {
                resetMenuInactivityTimer()
                val count = categoryAdapter.count
                when (keyCode) {
                    KeyEvent.KEYCODE_DPAD_LEFT -> { showLeftIconRailFromGroups(); return@setOnKeyListener true }
                    KeyEvent.KEYCODE_DPAD_RIGHT -> {
                        selectCategory(focusedCategoryPos.coerceAtLeast(0))
                        showSideChannelsMode(focusCurrentChannelIfSameGroup = false)
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_UP -> if (count > 0 && focusedCategoryPos <= 0) {
                        val lastIdx = count - 1; focusedCategoryPos = lastIdx
                        categoryListView.setSelection(lastIdx); refreshSimpleListHighlightInPlace(categoryListView, lastIdx)
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_DOWN -> if (count > 0 && focusedCategoryPos >= count - 1) {
                        focusedCategoryPos = 0
                        categoryListView.setSelection(0); refreshSimpleListHighlightInPlace(categoryListView, 0)
                        return@setOnKeyListener true
                    }
                }
            }
            false
        }

        '''
                kText = kText.substring(0, bs) + cleanCategoryBlock + kText.substring(be)
            }

            // Е) Возвращаем showSideChannelsMode на красивый channelRecyclerView с кубиками и целыми строками без обрезки внизу
            int sIdx = kText.indexOf("private fun showSideChannelsMode(")
            if (sIdx < 0) sIdx = kText.indexOf("internal fun showSideChannelsMode(")
            int eIdx = kText.indexOf("private fun playSplashEyeAnimation()")
            if (eIdx < 0) eIdx = kText.indexOf("internal fun playSplashEyeAnimation()")

            if (sIdx > 0 && eIdx > sIdx) {
                def restoredRecyclerMethods = '''private fun showSideChannelsMode(focusCurrentChannelIfSameGroup: Boolean = true) {
        isSideShowingChannels = true
        isLeftRailVisible = false
        leftIconRail.visibility = View.GONE
        categoryListView.visibility = View.GONE

        // Подгоняем высоту списка строго под целое число строк, чтобы внизу ничего не обрезалось
        val rowH = channelRvAdapter.getExactRowHeightPx().coerceAtLeast(42)
        val maxH = (resources.displayMetrics.heightPixels - 68).coerceAtLeast(300)
        val exactRows = (maxH / rowH).coerceAtLeast(5)
        channelRecyclerView.layoutParams = FrameLayout.LayoutParams(
            FrameLayout.LayoutParams.MATCH_PARENT,
            exactRows * rowH + 16,
            Gravity.CENTER_VERTICAL
        )
        channelRecyclerView.visibility = View.VISIBLE

        val snapshot = displayedChannels.toList()
        if (snapshot.isNotEmpty()) {
            val activeIdxInGroup = if (focusCurrentChannelIfSameGroup) {
                snapshot.indexOfFirst { it.url == currentChannel?.url }
            } else -1
            val targetPos = if (activeIdxInGroup >= 0) activeIdxInGroup else 0
            focusedChannelPos = targetPos
            channelRvAdapter.submitChannels(snapshot, targetPos)
            channelRecyclerView.post {
                channelLayoutManager.scrollToPositionWithOffset(targetPos, (channelRecyclerView.height / 3).coerceAtLeast(80))
                val vh = channelRecyclerView.findViewHolderForAdapterPosition(targetPos)
                if (vh != null) vh.itemView.requestFocus() else channelRecyclerView.requestFocus()
            }
        } else {
            focusedChannelPos = 0
            channelRvAdapter.submitChannels(emptyList(), 0)
        }
    }

    private fun showSideGroupsMode() {
        isSideShowingChannels = false
        isLeftRailVisible = false
        leftIconRail.visibility = View.GONE
        channelRecyclerView.visibility = View.GONE

