        // 2. Встраиваем отрисовку цветных кубиков с буквами ([B:XX]) прямо в CustomViews.kt для ListView!
        def customViewsFile = new File(pkgDir, "CustomViews.kt")
        if (customViewsFile.exists()) {
            def cvText = customViewsFile.getText("UTF-8")
            cvText = cvText.replace("override fun isFocused(): Boolean = forceMarqueeActive || super.isFocused()", "// focus override removed")

            if (!cvText.contains("class MonogramBadgeSpan")) {
                def badgeSpanClass = '''
class MonogramBadgeSpan(private val letters: String, private val bgColor: Int) : ReplacementSpan() {
    private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
    private val rect = RectF()

    override fun getSize(paint: Paint, text: CharSequence?, start: Int, end: Int, fm: Paint.FontMetricsInt?): Int = 66

    override fun draw(canvas: Canvas, text: CharSequence?, start: Int, end: Int, x: Float, top: Int, y: Int, bottom: Int, textPaint: Paint) {
        val cy = (top + bottom) / 2f
        val w = 48f
        val h = 34f
        rect.set(x + 2f, cy - h / 2f, x + 2f + w, cy + h / 2f)

        paint.style = Paint.Style.FILL
        paint.color = bgColor
        canvas.drawRoundRect(rect, 9f, 9f, paint)

        paint.style = Paint.Style.STROKE
        paint.strokeWidth = 1.8f
        paint.color = Color.argb(180, 255, 255, 255)
        canvas.drawRoundRect(rect, 9f, 9f, paint)

        paint.style = Paint.Style.FILL
        paint.color = Color.WHITE
        paint.typeface = Typeface.DEFAULT_BOLD
        paint.textSize = if (letters.length >= 2) 18.5f else 20.5f
        paint.textAlign = Paint.Align.CENTER
        val fontMetrics = paint.fontMetrics
        val textY = cy - (fontMetrics.descent + fontMetrics.ascent) / 2f
        canvas.drawText(letters, rect.centerX(), textY, paint)
    }
}

private val badgeColors = intArrayOf(
    Color.parseColor("#E53935"), Color.parseColor("#8E24AA"), Color.parseColor("#3949AB"),
    Color.parseColor("#039BE5"), Color.parseColor("#00897B"), Color.parseColor("#43A047"),
    Color.parseColor("#FB8C00"), Color.parseColor("#D81B60"), Color.parseColor("#5E35B1"),
    Color.parseColor("#00ACC1")
)
'''
                cvText = cvText.replace("fun colorizeStatusText(raw: String): CharSequence {", badgeSpanClass + "\nfun colorizeStatusText(raw: String): CharSequence {")
                def badgeParseRule = '''            i <= raw.length - 6 && raw.startsWith("[B:", i) && raw[i + 5] == ']' -> {
                val mono = raw.substring(i + 3, i + 5)
                val cIdx = (raw.hashCode() and 0x7FFFFFFF) % badgeColors.size
                ss.setSpan(MonogramBadgeSpan(mono, badgeColors[cIdx]), i, i + 6, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                i += 6
            }
            i <= raw.length - 4 && raw.startsWith("[ON]", i)'''
                cvText = cvText.replace('i <= raw.length - 4 && raw.startsWith("[ON]", i)', badgeParseRule)
            }
            customViewsFile.write(cvText, "UTF-8")
        }

        // 3. Переводим боковое меню в MainActivity.kt на 100% стабильный ListView с цветными кубиками и рабочими категориями!
        def mainFile = new File(pkgDir, "MainActivity.kt")
        if (mainFile.exists()) {
            def kText = mainFile.getText("UTF-8")

            kText = kText.replace(".coerceIn(0.38f, 0.52f)", ".coerceIn(0.45f, 0.65f)")
            kText = kText.replace("if (isSideShowingChannels && sidePanel.visibility == View.VISIBLE) return", "")

            int bs = kText.indexOf("categoryAdapter = createRoundedSelectorAdapter(")
            int be = kText.indexOf("applyCurrentThemeToAllPanels()")
            if (bs > 0 && be > bs) {
                def unifiedCubeListBlock = '''categoryAdapter = createRoundedSelectorAdapter(mutableListOf(), 15.5f, true, fixedRowHeight = true) { pos ->
            !isLeftRailVisible && pos == (if (isSideShowingChannels) focusedChannelPos else focusedCategoryPos)
        }
        categoryListView.adapter = categoryAdapter

        categoryListView.setOnItemClickListener { _, _, position, _ ->
            resetMenuInactivityTimer()
            if (isSideShowingChannels) {
                val list = displayedChannels.toList()
                if (position in list.indices) {
                    focusedChannelPos = position
                    playChannelObj(list[position], immediate = true)
                    if (controlMode != 1) closeAllMenus() else showSideChannelsMode(focusCurrentChannelIfSameGroup = false)
                }
            } else {
                focusedCategoryPos = position
                selectCategory(position)
                showSideChannelsMode(focusCurrentChannelIfSameGroup = false)
            }
        }
        categoryListView.setOnItemLongClickListener { _, _, position, _ ->
            resetMenuInactivityTimer()
            if (isSideShowingChannels) {
                val list = displayedChannels.toList()
                if (position in list.indices) {
                    focusedChannelPos = position
                    toggleFavorite(list[position])
                    showSideChannelsMode(focusCurrentChannelIfSameGroup = false)
                }
                true
            } else false
        }
        categoryListView.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
            override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                resetMenuInactivityTimer()
                if (isSideShowingChannels) {
                    focusedChannelPos = position
                } else {
                    focusedCategoryPos = position
                }
                refreshSimpleListHighlightInPlace(categoryListView, position)
            }
            override fun onNothingSelected(parent: AdapterView<*>?) {}
        }
        categoryListView.setOnKeyListener { _, keyCode, event ->
            if (event.action == KeyEvent.ACTION_DOWN) {
                resetMenuInactivityTimer()
                val count = categoryAdapter.count
                val curPos = if (isSideShowingChannels) focusedChannelPos else focusedCategoryPos
                when (keyCode) {
                    KeyEvent.KEYCODE_DPAD_LEFT -> {
                        if (isSideShowingChannels) {
                            showSideGroupsMode()
                        } else {
                            showLeftIconRailFromGroups()
                        }
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_RIGHT -> {
                        if (isLeftRailVisible) {
                            hideLeftIconRailToGroups()
                        } else if (!isSideShowingChannels) {
                            selectCategory(focusedCategoryPos.coerceAtLeast(0))
                            showSideChannelsMode(focusCurrentChannelIfSameGroup = false)
                        } else {
                            closeAllMenus()
                        }
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_UP -> if (count > 0 && curPos <= 0) {
                        val lastIdx = count - 1
                        if (isSideShowingChannels) focusedChannelPos = lastIdx else focusedCategoryPos = lastIdx
                        categoryListView.setSelection(lastIdx)
                        refreshSimpleListHighlightInPlace(categoryListView, lastIdx)
                        return@setOnKeyListener true
                    }
                    KeyEvent.KEYCODE_DPAD_DOWN -> if (count > 0 && curPos >= count - 1) {
                        if (isSideShowingChannels) focusedChannelPos = 0 else focusedCategoryPos = 0
                        categoryListView.setSelection(0)
                        refreshSimpleListHighlightInPlace(categoryListView, 0)
                        return@setOnKeyListener true
                    }
                }
            }
            false
        }

        '''
                kText = kText.substring(0, bs) + unifiedCubeListBlock + kText.substring(be)
            }

            // Заменяем showSideChannelsMode и showSideGroupsMode на работу строго через categoryListView с цветными кубиками [B:XX] и целыми строками!
            int sIdx = kText.indexOf("private fun showSideChannelsMode(")
            if (sIdx < 0) sIdx = kText.indexOf("internal fun showSideChannelsMode(")
            int eIdx = kText.indexOf("private fun playSplashEyeAnimation()")
            if (eIdx < 0) eIdx = kText.indexOf("internal fun playSplashEyeAnimation()")

            if (sIdx > 0 && eIdx > sIdx) {
                def stableCubeSideMethods = '''private fun extractTwoLetters(name: String): String {
        val clean = name.replace(Regex("[^a-zA-Zа-яА-Я0-9 ]"), " ").trim()
        val parts = clean.split(Regex("\\\\s+")).filter { it.isNotEmpty() }
        val raw = if (parts.size >= 2) "${parts[0].first()}${parts[1].first()}" else (parts.firstOrNull() ?: "TV").take(2)
        return raw.uppercase().padEnd(2, 'T').take(2)
    }

    private fun fitCategoryListViewHeight() {
        val rowH = exactModalRowHeightPx().coerceAtLeast(42)
        val maxH = (resources.displayMetrics.heightPixels - 68).coerceAtLeast(300)
        val exactRows = (maxH / rowH).coerceAtLeast(5)
        categoryListView.layoutParams = FrameLayout.LayoutParams(
            FrameLayout.LayoutParams.MATCH_PARENT,
            exactRows * rowH + 16,
            Gravity.CENTER_VERTICAL
        )
    }

    private fun showSideChannelsMode(focusCurrentChannelIfSameGroup: Boolean = true) {
        isSideShowingChannels = true
        isLeftRailVisible = false
        leftIconRail.visibility = View.GONE
        channelRecyclerView.visibility = View.GONE
        fitCategoryListViewHeight()
        categoryListView.visibility = View.VISIBLE

        val list = displayedChannels.toList()
        val activeIdx = if (focusCurrentChannelIfSameGroup) list.indexOfFirst { it.url == currentChannel?.url } else focusedChannelPos
        val targetPos = if (activeIdx in list.indices) activeIdx else 0
        focusedChannelPos = targetPos

        val formattedChannels = if (list.isEmpty()) {
            listOf("[-]   В этой категории пока нет каналов")
        } else {
            list.map { ch ->
                val mono = extractTwoLetters(ch.name)
                val isPlaying = (ch.url == currentChannel?.url)
                val playOrb = if (isPlaying) "[+] " else ""
                val topBadge = if (topUrls.contains(ch.url)) "▲ " else ""
                val favBadge = if (favoriteUrls.contains(ch.url)) "★ " else ""
                "[B:$mono] $playOrb$topBadge$favBadge${ch.name}"
            }
        }
        categoryAdapter.clear()
        categoryAdapter.addAll(formattedChannels)
        categoryAdapter.notifyDataSetChanged()

        categoryListView.post {
            if (formattedChannels.isNotEmpty()) {
                categoryListView.setSelectionFromTop(targetPos, (categoryListView.height / 3).coerceAtLeast(70))
                categoryListView.requestFocus()
                refreshSimpleListHighlightInPlace(categoryListView, targetPos)
            }
        }
    }

    private fun showSideGroupsMode() {
        isSideShowingChannels = false
        isLeftRailVisible = false
        leftIconRail.visibility = View.GONE
        channelRecyclerView.visibility = View.GONE
        fitCategoryListViewHeight()
        categoryListView.visibility = View.VISIBLE

        val activeAll = allChannels.filter { isChannelActive(it) }
        val cats = activeCategoryList()
        val groupItems = cats.map { cat ->
            val count = when (cat) {
                "★ Избранное" -> activeAll.count { favoriteUrls.contains(it.url) }
                "Все каналы" -> activeAll.size
                else -> activeAll.count { effectiveCategory(it) == cat }
            }
            val mono = extractTwoLetters(cat)
            "[B:$mono] $cat ($count)"
        }
        categoryAdapter.clear()
        categoryAdapter.addAll(groupItems)
        categoryAdapter.notifyDataSetChanged()

        val targetPos = currentCategoryIndex.coerceIn(0, (categoryAdapter.count - 1).coerceAtLeast(0))
        focusedCategoryPos = targetPos
        categoryListView.post {
            categoryListView.setSelectionFromTop(targetPos, (categoryListView.height / 3).coerceAtLeast(60))
            categoryListView.requestFocus()
            refreshSimpleListHighlightInPlace(categoryListView, targetPos)
        }
    }

    '''
                kText = kText.substring(0, sIdx) + stableCubeSideMethods + kText.substring(eIdx)
            }

            // Чтобы фоновая подгрузка плейлистов не сбивала открытый список каналов в categoryListView:
            kText = kText.replace("private fun updateCategoriesList() {", "private fun updateCategoriesList() {\n        if (sidePanel.visibility == View.VISIBLE && isSideShowingChannels) return")

            mainFile.write(kText, "UTF-8")
        }
    }
}

preBuild.dependsOn("autoBuildStableCubeListView")
