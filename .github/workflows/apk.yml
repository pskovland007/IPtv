name: Build MiBox IPTV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack Project
        run: |
          mkdir -p app/src/main/java/com/example/miboxiptv
          echo "" | base64 -d > settings.gradle
          sed -i 's/gadlePlaginPortal/gradlePluginPortal/g' settings.gradle
          echo "cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24nOC4yLjInIGFwcGx5IGZhbHNlCiAgICBpZCAnb3JnLmpldGJyYWlucy5rb3RsaW4uYW5kcm9pZCcqdmVyc2lvbicxLjkuMjInIGFwcGx5IGZhbHNlCn0K" | base64 -d > build.gradle
          sed -i "s/version'8.2.2'/version '8.2.2'/g; s/\*version'1.9.22'/ version '1.9.22'/g" build.gradle
          echo "" | base64 -d > app/build.gradle
          sed -i 's/iXplementation/implementation/g' app/build.gradle
          cp gemini-code-*.xml app/src/main/AndroidManifest.xml
          cp gemini-code-*.kt app/src/main/java/com/example/miboxiptv/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiBox-IPTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
