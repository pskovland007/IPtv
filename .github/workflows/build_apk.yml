name: Build TiViLook Beta APK

on:
  push:
    branches: [ beta ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tivilook-beta-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Bump Beta Version Number
        run: |
          python3 -c '
          import os, re
          with open("app/build.gradle", "r") as f: g = f.read()
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          g = re.sub(r"versionCode\s+\d+", f"versionCode {18000 + run_num}", g)
          g = re.sub(r"versionName\s+\"[^\"]+\"", f"versionName \"2.8.{run_num}-beta\"", g)
          with open("app/build.gradle", "w") as f: f.write(g)
          '

      - name: Restore Beta Signing Keystore from Cache
        uses: actions/cache@v4
        with:
          path: app/permanent_key.jks
          key: mibox-iptv-beta-signing-jks-v1

      - name: Compile TiViLook Beta APK
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$BETA_KEYSTORE_BASE64" ]; then
            echo "$BETA_KEYSTORE_BASE64" | base64 -d > app/permanent_key.jks
          elif [ ! -f app/permanent_key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/permanent_key.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -dname "CN=TiViLook Beta,O=TiViLook,C=RU"
          fi
          cp app/permanent_key.jks ~/.android/debug.keystore || true
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TiViLook-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiViLook-Beta-APK
          path: TiViLook-beta.apk
          retention-days: 30
