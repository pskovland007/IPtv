              // Пункт 5: Если запущен анализатор, через 5 секунд бездействия окно автоматически плавно сворачивается в верхний бар!
              private val autoHideMenuRunnable = Runnable {
                  if (menuHistory.isNotEmpty()) {
                      val currentMenu = menuHistory.last()
                      if ((currentMenu == "ANALYZER_GROUP_VIEW" || currentMenu == "ANALYZER_GROUPS") && isAnalyzerRunning) {
                          collapseAnalyzerToTopBar()
                      } else if (currentMenu != "EPG" && currentMenu != "ADD_URL" && currentMenu != "MANUAL_PATH") {
                          closeAllMenus()
                      }
                  }
              }

              private fun collapseAnalyzerToTopBar() {
                  subModalOverlay.animate()
                      .translationY(-480f)
                      .scaleX(0.35f)
                      .scaleY(0.25f)
                      .alpha(0f)
                      .setDuration(380L)
                      .withEndAction {
                          subModalOverlay.translationY = 0f
                          subModalOverlay.scaleX = 1f
                          subModalOverlay.scaleY = 1f
                          subModalOverlay.alpha = 1f
                          closeAllMenus()
                          analyzerStatusBanner.visibility = View.VISIBLE
                      }
                      .start()
              }

              private fun animateMenuAppear(view: View, fromX: Float = 0f, fromY: Float = 28f) {
                  if (view.visibility == View.VISIBLE && view.alpha == 1f) {
                      return
                  }
                  view.visibility = View.VISIBLE
                  view.alpha = 0f
                  view.translationX = fromX
                  view.translationY = fromY
                  view.scaleX = 0.95f
                  view.scaleY = 0.95f
                  view.animate()
                      .alpha(1f)
                      .translationX(0f)
                      .translationY(0f)
                      .scaleX(1f)
                      .scaleY(1f)
                      .setDuration(200L)
                      .setInterpolator(DecelerateInterpolator())
                      .start()
              }

              private fun resetMenuInactivityTimer() {
                  uiHandler.removeCallbacks(autoHideMenuRunnable)
                  if (menuHistory.isNotEmpty()) {
                      val cur = menuHistory.last()
                      val delay = if ((cur == "ANALYZER_GROUP_VIEW" || cur == "ANALYZER_GROUPS") && isAnalyzerRunning) 5000L else 7500L
                      uiHandler.postDelayed(autoHideMenuRunnable, delay)
                  }
              }

