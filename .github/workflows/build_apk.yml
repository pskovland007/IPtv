              private fun showLocalFileOptions() {
                  val options = arrayOf(
                      "Выбрать из папки Download / внутренней памяти",
                      "Открыть системный файловый менеджер Android",
                      "Ввести путь к файлу вручную (/sdcard/...)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Добавление файла .m3u / .m3u8")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> scanLocalM3uFiles()
                              1 -> {
                                  try {
                                      val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                          type = "*/*"
                                          addCategory(Intent.CATEGORY_OPENABLE)
                                      }
                                      startActivityForResult(Intent.createChooser(intent, "Выберите .m3u / .m3u8"), FILE_PICK_CODE)
                                  } catch (e: Exception) {
                                      scanLocalM3uFiles()
                                  }
                              }
                              2 -> showManualFilePathDialog()
                          }
                      }
                      .show()
              }

              private fun scanLocalM3uFiles() {
                  val foundFiles = mutableListOf<File>()
                  val roots = listOf(
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                      Environment.getExternalStorageDirectory(),
                      File("/storage")
                  )
                  for (r in roots) {
                      try {
                          r.walkTopDown().maxDepth(3).forEach { file ->
                              if (file.isFile && (file.name.endsWith(".m3u", true) || file.name.endsWith(".m3u8", true))) {
                                  if (!foundFiles.any { it.absolutePath == file.absolutePath }) {
                                      foundFiles.add(file)
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }

                  if (foundFiles.isEmpty()) {
                      Toast.makeText(this, "Файлы .m3u/.m3u8 в памяти не найдены", Toast.LENGTH_LONG).show()
                      showManualFilePathDialog()
                      return
                  }

                  val names = foundFiles.map { it.name + " (" + it.parent + ")" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Найденные файлы .m3u / .m3u8")
                      .setItems(names) { _, idx ->
                          val file = foundFiles[idx]
                          playlists.add(PlaylistEntry(file.name, file.absolutePath, true))
                          activePlaylistIndex = playlists.size - 1
                          saveState()
                          loadActivePlaylist()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

