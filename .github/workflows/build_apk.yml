                          resetMenuInactivityTimer()
                          val count = categoryAdapter.count
                          if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                              selectCategory(focusedCategoryPos.coerceAtLeast(0))
                              showSideChannelsMode(focusTop = true, focusCurrentChannel = false)
                              return@setOnKeyListener true
                          } else if (keyCode == KeyEvent.KEYCODE_DPAD_UP && count > 0 && focusedCategoryPos <= 0) {
                              val lastIdx = count - 1
                              focusedCategoryPos = lastIdx
                              selectCategory(lastIdx)
                              categoryListView.setSelectionFromTop(lastIdx, 0)
                              refreshListHighlightInPlace(categoryListView, lastIdx)
                              return@setOnKeyListener true
                          } else if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN && count > 0 && focusedCategoryPos >= count - 1) {
