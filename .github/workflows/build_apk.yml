                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          with open("app/src/main/java/com/example/miboxiptv/MainActivity.kt", "w") as f:
              f.write('''package com.example.miboxiptv

          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.SurfaceView
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import org.json.JSONArray
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import org.xmlpull.v1.XmlPullParserFactory
          import java.io.File
          import java.io.InputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.GZIPInputStream
          import kotlin.concurrent.thread

          data class Channel(val name: String, val url: String, val category: String, val tvgId: String)
          data class PlaylistEntry(val title: String, val source: String, val isLocal: Boolean)
          data class EpgProgram(val title: String, val desc: String, val startMs: Long, val stopMs: Long)

          class MainActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var categoryListView: ListView
              private lateinit var channelListView: ListView
              private lateinit var sidePanel: LinearLayout
              private lateinit var infoPanel: LinearLayout
              private lateinit var infoTextView: TextView
              private lateinit var clockTextView: TextView
              private lateinit var currentChannelBanner: TextView
              private lateinit var activePlaylistLabel: TextView

              private val uiHandler = Handler(Looper.getMainLooper())
              private val allChannels = mutableListOf<Channel>()
              private val displayedChannels = mutableListOf<Channel>()
              private val favoriteUrls = mutableSetOf<String>()
              private val playlists = mutableListOf<PlaylistEntry>()

              // EPG базы: по tvg-id и по нормализованному имени канала
              private val epgById = HashMap<String, MutableList<EpgProgram>>()
              private val epgByName = HashMap<String, MutableList<EpgProgram>>()
              private val channelIdToNames = HashMap<String, MutableList<String>>()
              private var epgLoadedCount = 0

              private lateinit var categoryAdapter: ArrayAdapter<String>
              private lateinit var channelAdapter: ArrayAdapter<String>

              private var currentCategoryIndex = 1
              private var currentChannel: Channel? = null
              private var activePlaylistIndex = 0
              private var bufferLevel = 1   // 0 - Маленький, 1 - Средний, 2 - Большой
              private var decoderMode = 1   // 0 - HW, 1 - HW+FFmpeg (Авто), 2 - SW Priority (FFmpeg)

              private val categories = listOf(
                  "★ Избранное",
                  "Все 1080p",
                  "Кино и сериалы",
                  "Спорт",
                  "Детские",
                  "Познавательные",
                  "Музыка",
                  "Новости и общие",
                  "Развлечения",
                  "Прочее"
              )

              private val defaultRusUrl = "https://iptv-org.github.io/iptv/languages/rus.m3u"
              private var epgUrl = "https://iptvx.one/epg/epg_lite.xml.gz"
              private val FILE_PICK_CODE = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  loadSavedState()

                  val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }

                  playerView = PlayerView(this).apply {
                      useController = false
                      resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  }
                  root.addView(playerView)

                  // Пункт 11: Постоянные часы в левом верхнем углу
                  clockTextView = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      setBackgroundColor(Color.parseColor("#88000000"))
                      setPadding(20, 8, 20, 8)
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.START
                      ).apply { setMargins(28, 24, 0, 0) }
                  }
                  root.addView(clockTextView)

                  // Левая панель со списком категорий и каналов (открывается по кнопке ВЛЕВО)
                  sidePanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#E6101018"))
                      visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams(
                          1140,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          Gravity.START
                      )
                      setPadding(24, 24, 24, 24)
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 14)
                  }

                  val btnSettings = Button(this).apply {
                      text = "⚙ Настройки"
                      setOnClickListener { showSettingsMenu() }
                  }
                  topBar.addView(btnSettings)

                  val btnFavToggle = Button(this).apply {
                      text = "★ Избранное"
                      setOnClickListener { toggleCurrentSelectedFavorite() }
                  }
                  topBar.addView(btnFavToggle)

                  activePlaylistLabel = TextView(this).apply {
                      setTextColor(Color.parseColor("#00E5FF"))
                      textSize = 14f
                      setPadding(20, 0, 0, 0)
                  }
                  topBar.addView(activePlaylistLabel)
                  sidePanel.addView(topBar)

                  val columnsLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  categoryListView = ListView(this).apply {
                      choiceMode = ListView.CHOICE_MODE_SINGLE
                      setBackgroundColor(Color.parseColor("#22FFFFFF"))
                      layoutParams = LinearLayout.LayoutParams(
                          360,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      ).apply { setMargins(0, 0, 16, 0) }
                  }

                  channelListView = ListView(this).apply {
                      choiceMode = ListView.CHOICE_MODE_SINGLE
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  columnsLayout.addView(categoryListView)
                  columnsLayout.addView(channelListView)
                  sidePanel.addView(columnsLayout)
                  root.addView(sidePanel)

                  // Правая панель информации о потоке и телепрограмме (открывается по кнопке ВПРАВО)
                  infoPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#E6141026"))
                      visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams(
                          680,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.END
                      ).apply { setMargins(0, 32, 32, 0) }
                      setPadding(32, 28, 32, 28)
                  }

                  val infoTitle = TextView(this).apply {
                      text = "ℹ Информация о потоке и EPG"
                      setTextColor(Color.parseColor("#00E5FF"))
                      textSize = 19f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 12)
                  }
                  infoPanel.addView(infoTitle)

                  infoTextView = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 16f
                  }
                  infoPanel.addView(infoTextView)
                  root.addView(infoPanel)

                  // Всплывающий баннер при переключении канала
                  currentChannelBanner = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setBackgroundColor(Color.parseColor("#CC141026"))
                      setPadding(32, 18, 32, 18)
                      visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.START
                      ).apply { setMargins(36, 0, 36, 36) }
                  }
                  root.addView(currentChannelBanner)

                  setContentView(root)

                  initPlayer()
                  startClockAndInfoUpdater()

                  categoryAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_activated_1, mutableListOf())
                  categoryListView.adapter = categoryAdapter

                  channelAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, mutableListOf())
                  channelListView.adapter = channelAdapter

                  categoryListView.setOnItemClickListener { _, _, position, _ ->
                      selectCategory(position)
                      channelListView.requestFocus()
                  }

                  categoryListView.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          selectCategory(position)
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  channelListView.setOnItemClickListener { _, _, position, _ ->
                      if (position in displayedChannels.indices) {
                          playChannelObj(displayedChannels[position])
                          hideSidePanel()
                      }
                  }

                  channelListView.setOnItemLongClickListener { _, _, position, _ ->
                      if (position in displayedChannels.indices) {
                          toggleFavorite(displayedChannels[position])
                      }
                      true
                  }

                  loadActivePlaylist()
                  loadEpgInBackground()
              }

              private fun startClockAndInfoUpdater() {
                  val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
                  val ticker = object : Runnable {
                      override fun run() {
                          clockTextView.text = timeFmt.format(Date())
                          if (infoPanel.visibility == View.VISIBLE) {
                              updateStreamInfoText()
                          }
                          uiHandler.postDelayed(this, 2000)
                      }
                  }
                  uiHandler.post(ticker)
              }

              // Пункт 7 и 8: Настройка декодера (HW / FFmpeg SW) + анти-пикселизация (максимальный битрейт)
              private fun initPlayer() {
                  val currentUrl = currentChannel?.url
                  player?.release()

                  val (minBuf, maxBuf, startBuf) = when (bufferLevel) {
                      0 -> Triple(3000, 8000, 1200)
                      2 -> Triple(30000, 65000, 3500)
                      else -> Triple(15000, 32000, 2000)
                  }

                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(minBuf, maxBuf, startBuf, startBuf)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .build()

                  val extensionMode = when (decoderMode) {
                      0 -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_OFF
                      2 -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER
                      else -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON
                  }

                  val renderersFactory = DefaultRenderersFactory(this)
                      .setExtensionRendererMode(extensionMode)
                      .setEnableDecoderFallback(true)

                  val newPlayer = ExoPlayer.Builder(this, renderersFactory)
                      .setLoadControl(loadControl)
                      .build()

                  // Убираем пикселизацию: запрещаем низкие битрейты и требуем максимальное качество потока
                  newPlayer.trackSelectionParameters = newPlayer.trackSelectionParameters
                      .buildUpon()
                      .setMinVideoSize(1280, 720)
                      .setMaxVideoSize(3840, 2160)
                      .setMinVideoBitrate(4_000_000)
                      .setForceHighestSupportedBitrate(true)
                      .build()

                  newPlayer.videoScalingMode = C.VIDEO_SCALING_MODE_SCALE_TO_FIT

                  playerView.player = newPlayer
                  player = newPlayer

                  if (currentUrl != null) {
                      newPlayer.setMediaItem(MediaItem.fromUri(currentUrl))
                      newPlayer.prepare()
                      newPlayer.play()
                  }
              }

              private fun normalizeName(raw: String): String {
                  return raw.lowercase()
                      .replace("1080p", "")
                      .replace("720p", "")
                      .replace("fhd", "")
                      .replace("hd", "")
                      .replace(Regex("\\\\(.*?\\\\)"), "")
                      .replace(Regex("\\\\[.*?\\\\]"), "")
                      .replace(Regex("[^a-zа-я0-9]"), "")
                      .trim()
              }

              private fun getCurrentEpg(ch: Channel?): EpgProgram? {
                  if (ch == null) return null
                  val now = System.currentTimeMillis()
                  if (ch.tvgId.isNotEmpty()) {
                      val byId = epgById[ch.tvgId]?.firstOrNull { now in it.startMs..it.stopMs }
                      if (byId != null) return byId
                  }
                  val norm = normalizeName(ch.name)
                  if (norm.isNotEmpty()) {
                      return epgByName[norm]?.firstOrNull { now in it.startMs..it.stopMs }
                  }
                  return null
              }

              // Пункт 10: Фоновая загрузка телепрограммы XMLTV (.xml / .xml.gz)
              private fun loadEpgInBackground() {
                  thread {
                      try {
                          val conn = URL(epgUrl).openConnection() as HttpURLConnection
                          conn.connectTimeout = 15000
                          conn.readTimeout = 25000
                          val rawStream: InputStream = conn.inputStream
                          val stream: InputStream = if (epgUrl.endsWith(".gz", true)) {
                              GZIPInputStream(rawStream)
                          } else {
                              rawStream
                          }

                          val factory = XmlPullParserFactory.newInstance()
                          val parser = factory.newPullParser()
                          parser.setInput(stream, "UTF-8")

                          val now = System.currentTimeMillis()
                          val minTime = now - 6 * 3600_000L
                          val maxTime = now + 18 * 3600_000L

                          val tempById = HashMap<String, MutableList<EpgProgram>>()
                          val tempIdToNames = HashMap<String, MutableList<String>>()

                          var eventType = parser.eventType
                          var currentChanId = ""
                          var progChanId = ""
                          var progStart = 0L
                          var progStop = 0L
                          var progTitle = ""
                          var progDesc = ""
                          var currentTag = ""
                          var count = 0

                          while (eventType != XmlPullParser.END_DOCUMENT) {
                              when (eventType) {
                                  XmlPullParser.START_TAG -> {
                                      currentTag = parser.name ?: ""
                                      if (currentTag == "channel") {
                                          currentChanId = parser.getAttributeValue(null, "id") ?: ""
                                      } else if (currentTag == "programme") {
                                          progChanId = parser.getAttributeValue(null, "channel") ?: ""
                                          progStart = parseXmltvDate(parser.getAttributeValue(null, "start") ?: "")
                                          progStop = parseXmltvDate(parser.getAttributeValue(null, "stop") ?: "")
                                          progTitle = ""
                                          progDesc = ""
                                      }
                                  }
                                  XmlPullParser.TEXT -> {
                                      val txt = parser.text ?: ""
                                      if (txt.isNotBlank()) {
                                          if (currentTag == "display-name" && currentChanId.isNotEmpty()) {
                                              val list = tempIdToNames.getOrPut(currentChanId) { mutableListOf() }
                                              list.add(normalizeName(txt))
                                          } else if (currentTag == "title" && progStop >= minTime && progStart <= maxTime) {
                                              progTitle += txt
                                          } else if (currentTag == "desc" && progStop >= minTime && progStart <= maxTime) {
                                              progDesc += txt
                                          }
                                      }
                                  }
                                  XmlPullParser.END_TAG -> {
                                      val endName = parser.name ?: ""
                                      if (endName == "channel") {
                                          currentChanId = ""
                                      } else if (endName == "programme") {
                                          if (progChanId.isNotEmpty() && progTitle.isNotEmpty() && progStop >= minTime && progStart <= maxTime) {
                                              val list = tempById.getOrPut(progChanId) { mutableListOf() }
                                              list.add(EpgProgram(progTitle.trim(), progDesc.trim(), progStart, progStop))
                                              count++
                                          }
                                          progChanId = ""
                                      }
                                      currentTag = ""
                                  }
                              }
                              eventType = parser.next()
                          }

                          val tempByName = HashMap<String, MutableList<EpgProgram>>()
                          for ((id, progs) in tempById) {
                              val names = tempIdToNames[id] ?: continue
                              for (n in names) {
                                  if (n.isNotEmpty()) {
                                      tempByName[n] = progs
                                  }
                              }
                          }

                          runOnUiThread {
                              epgById.clear()
                              epgById.putAll(tempById)
                              epgByName.clear()
                              epgByName.putAll(tempByName)
                              epgLoadedCount = count
                              refreshChannelAdapter()
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun parseXmltvDate(raw: String): Long {
                  if (raw.length < 14) return 0L
                  return try {
                      val clean = raw.trim()
                      val sdf = if (clean.length >= 19 && (clean.contains("+") || clean.contains("-"))) {
                          SimpleDateFormat("yyyyMMddHHmmss Z", Locale.US)
                      } else {
                          SimpleDateFormat("yyyyMMddHHmmss", Locale.US).apply {
                              timeZone = TimeZone.getTimeZone("GMT+3")
                          }
                      }
                      sdf.parse(clean)?.time ?: 0L
                  } catch (_: Exception) {
                      0L
                  }
              }

              // Пункт 9: Информация о потоке (битрейт, кодеки, аудиодорожка, телепередача/фильм)
              private fun updateStreamInfoText() {
                  val p = player ?: return
                  val ch = currentChannel
                  val vFormat = p.videoFormat
                  val aFormat = p.audioFormat

                  val width = vFormat?.width ?: p.videoSize.width
                  val height = vFormat?.height ?: p.videoSize.height
                  val fps = if (vFormat != null && vFormat.frameRate > 0) String.format(Locale.US, "%.0f fps", vFormat.frameRate) else ""
                  val vCodec = vFormat?.sampleMimeType?.substringAfter("/")?.uppercase() ?: "Загрузка..."

                  val vBitrate = if (vFormat != null && vFormat.bitrate > 0) {
                      String.format(Locale.US, "%.2f Мбит/с", vFormat.bitrate / 1_000_000f)
                  } else {
                      "Адаптивный HLS (Макс. профиль)"
                  }

                  val aCodec = aFormat?.sampleMimeType?.substringAfter("/")?.uppercase() ?: "Нет данных"
                  val aChannels = if (aFormat != null && aFormat.channelCount > 0) "${aFormat.channelCount} кан." else ""
                  val aSampleRate = if (aFormat != null && aFormat.sampleRate > 0) "${aFormat.sampleRate} Гц" else ""
                  val aLang = aFormat?.language?.uppercase() ?: "RU"

                  val epg = getCurrentEpg(ch)
                  val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
                  val epgLine = if (epg != null) {
                      val range = timeFmt.format(Date(epg.startMs)) + "–" + timeFmt.format(Date(epg.stopMs))
                      "🎬 Сейчас в эфире ($range):\n${epg.title}" + (if (epg.desc.isNotEmpty()) "\nОписание: ${epg.desc.take(140)}" else "")
                  } else {
                      "🎬 Телепрограмма: " + (if (epgLoadedCount > 0) "Передача не указана" else "Загрузка базы EPG...")
                  }

                  infoTextView.text = buildString {
                      append("📺 Канал: ${ch?.name ?: "-"}\n")
                      append("📂 Категория: ${ch?.category ?: "-"}\n\n")
                      append("🖥 Видео: ${width}x${height} $fps ($vCodec)\n")
                      append("📊 Видеопоток: $vBitrate\n")
                      append("🔊 Аудиодорожка: $aCodec $aChannels $aSampleRate [$aLang]\n")
                      append("⚙ Декодер: ${decoderName()} | Буфер: ${bufferName()}\n\n")
                      append(epgLine)
                  }
              }

              private fun mapToTenCategories(rawGroup: String, name: String): String {
                  val text = (rawGroup + " " + name).lowercase()
                  return when {
                      text.contains("кино") || text.contains("фильм") || text.contains("сериал") || text.contains("movie") || text.contains("cinema") || text.contains("film") -> "Кино и сериалы"
                      text.contains("спорт") || text.contains("футбол") || text.contains("матч") || text.contains("sport") || text.contains("khl") || text.contains("ufc") -> "Спорт"
                      text.contains("детск") || text.contains("мульт") || text.contains("kids") || text.contains("ani") || text.contains("карусель") || text.contains("disney") -> "Детские"
                      text.contains("наук") || text.contains("док") || text.contains("познав") || text.contains("science") || text.contains("doc") || text.contains("history") || text.contains("discovery") || text.contains("nat geo") -> "Познавательные"
                      text.contains("муз") || text.contains("music") || text.contains("hit") || text.contains("rock") || text.contains("pop") || text.contains("шансон") -> "Музыка"
                      text.contains("новост") || text.contains("общ") || text.contains("инфо") || text.contains("news") || text.contains("general") || text.contains("россия") || text.contains("первый") -> "Новости и общие"
                      text.contains("развлеч") || text.contains("юмор") || text.contains("шоу") || text.contains("entertain") || text.contains("comedy") || text.contains("тнт") || text.contains("стс") || text.contains("пятница") -> "Развлечения"
                      else -> "Прочее"
                  }
              }

              private fun is1080pChannel(extInfLine: String, name: String): Boolean {
                  val lower = (extInfLine + " " + name).lowercase()
                  val lowRes = listOf("720p", "576p", "540p", "480p", "360p", "240p", "(sd)")
                  for (tag in lowRes) {
                      if (lower.contains(tag)) return false
                  }
                  return lower.contains("1080p") || lower.contains("1080") || lower.contains("fhd")
              }

              private fun loadActivePlaylist() {
                  if (playlists.isEmpty()) {
                      playlists.add(PlaylistEntry("Русские 1080p (Встроенный)", defaultRusUrl, false))
                  }
                  if (activePlaylistIndex !in playlists.indices) activePlaylistIndex = 0
                  val entry = playlists[activePlaylistIndex]
                  updateTopLabel()

                  Toast.makeText(this, "Загрузка: " + entry.title, Toast.LENGTH_SHORT).show()

                  thread {
                      try {
                          val lines: List<String> = if (entry.isLocal) {
                              if (entry.source.startsWith("content://")) {
                                  contentResolver.openInputStream(Uri.parse(entry.source))?.bufferedReader()?.readLines() ?: emptyList()
                              } else {
                                  File(entry.source).readLines()
                              }
                          } else {
                              val conn = URL(entry.source).openConnection() as HttpURLConnection
                              conn.connectTimeout = 10000
                              conn.readTimeout = 10000
                              conn.inputStream.bufferedReader().readLines()
                          }

                          val strict1080 = mutableListOf<Channel>()
                          val allFallback = mutableListOf<Channel>()
                          var currentName = "Канал"
                          var currentExtInf = ""
                          var currentGroup = ""
                          var currentTvgId = ""
                          val quote = 34.toChar().toString()

                          for (line in lines) {
                              val trimmed = line.trim()
                              if (trimmed.startsWith("#EXTINF:")) {
                                  currentExtInf = trimmed
                                  currentName = trimmed.substringAfterLast(",").trim()
                                  val groupPrefix = "group-title=" + quote
                                  currentGroup = if (trimmed.contains(groupPrefix)) {
                                      trimmed.substringAfter(groupPrefix).substringBefore(quote)
                                  } else ""
                                  val idPrefix = "tvg-id=" + quote
                                  currentTvgId = if (trimmed.contains(idPrefix)) {
                                      trimmed.substringAfter(idPrefix).substringBefore(quote)
                                  } else ""
                              } else if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                                  val cat = mapToTenCategories(currentGroup, currentName)
                                  val ch = Channel(currentName, trimmed, cat, currentTvgId)
                                  allFallback.add(ch)
                                  if (is1080pChannel(currentExtInf, currentName)) {
                                      strict1080.add(ch)
                                  }
                              }
                          }

                          val finalChannels = if (strict1080.isNotEmpty()) strict1080 else allFallback

                          runOnUiThread {
                              allChannels.clear()
                              allChannels.addAll(finalChannels)
                              updateCategoriesList()
                              selectCategory(1)
                              if (displayedChannels.isNotEmpty()) {
                                  playChannelObj(displayedChannels[0])
                              } else {
                                  Toast.makeText(this, "Каналы не найдены", Toast.LENGTH_LONG).show()
                              }
