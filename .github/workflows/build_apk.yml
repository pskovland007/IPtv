          // Пункт 10: Исправлены пропорции глаза (1:1 как на иконке, без растягивания по ширине экрана) + живая анимация взгляда и моргания
          class RealisticEyeSplashView(context: Context) : View(context) {
              var eyeOpenFraction: Float = 0.02f
                  set(value) {
                      field = value.coerceIn(0.02f, 1.0f)
                      invalidate()
                  }

              var lookOffsetX: Float = 0f
                  set(value) {
                      field = value.coerceIn(-1f, 1f)
                      invalidate()
                  }

              var pupilScale: Float = 1f
                  set(value) {
                      field = value.coerceIn(0.75f, 1.25f)
                      invalidate()
                  }

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val wavePath = Path()
              private val outerEyePath = Path()
              private val lashPath = Path()
              private val innerEyePath = Path()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val cx = w / 2f
                  val cy = h / 2f

                  // 1. Винтажные диагональные волны на фоне
                  canvas.drawColor(Color.parseColor("#D83A18"))
                  val waveStripes = listOf(
                      Triple(0.14f, -0.05f, "#EA7317"),
                      Triple(0.34f, 0.08f, "#F4B926"),
                      Triple(0.62f, 0.24f, "#48A14D"),
                      Triple(0.84f, 0.44f, "#1692A8"),
                      Triple(1.04f, 0.64f, "#284596"),
                      Triple(1.22f, 0.80f, "#7C1D7A")
                  )
                  paint.style = Paint.Style.FILL
                  for ((leftYRatio, rightYRatio, hex) in waveStripes) {
                      wavePath.reset()
                      wavePath.moveTo(0f, h * leftYRatio)
                      wavePath.cubicTo(
                          w * 0.35f, h * (leftYRatio - 0.12f),
                          w * 0.68f, h * (rightYRatio + 0.08f),
                          w, h * rightYRatio
                      )
                      wavePath.lineTo(w, h)
                      wavePath.lineTo(0f, h)
                      wavePath.close()
                      paint.color = Color.parseColor(hex)
                      canvas.drawPath(wavePath, paint)
                  }

                  // Пункт 10: Привязываем размер глаза к квадрату min(w, h), чтобы пропорции были точными как на иконке (без растяжения!)
                  val unit = min(w, h)
                  val rx = unit * 0.36f
                  val maxRy = unit * 0.21f
                  val ry = maxRy * eyeOpenFraction

                  // Мягкая тень под глазом как на иконке
                  outerEyePath.reset()
                  outerEyePath.moveTo(cx - rx * 1.06f, cy + unit * 0.025f)
                  outerEyePath.cubicTo(cx - rx * 0.55f, cy - ry * 1.75f, cx + rx * 0.55f, cy - ry * 1.75f, cx + rx * 1.06f, cy + unit * 0.025f)
                  outerEyePath.cubicTo(cx + rx * 0.55f, cy + ry * 1.85f, cx - rx * 0.55f, cy + ry * 1.85f, cx - rx * 1.06f, cy + unit * 0.025f)
                  outerEyePath.close()
                  paint.color = Color.parseColor("#50000000")
                  canvas.drawPath(outerEyePath, paint)

                  // 2. Тёмный контур века с естественным миндалевидным изгибом (Cubic Bezier как в SVG иконки)
                  outerEyePath.reset()
                  outerEyePath.moveTo(cx - rx * 1.06f, cy)
                  outerEyePath.cubicTo(cx - rx * 0.55f, cy - ry * 1.82f, cx + rx * 0.55f, cy - ry * 1.82f, cx + rx * 1.06f, cy)
                  outerEyePath.cubicTo(cx + rx * 0.55f, cy + ry * 1.82f, cx - rx * 0.55f, cy + ry * 1.82f, cx - rx * 1.06f, cy)
                  outerEyePath.close()
                  paint.color = Color.parseColor("#19130E")
                  canvas.drawPath(outerEyePath, paint)

                  // Складка верхнего века слева
                  if (eyeOpenFraction > 0.2f) {
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = unit * 0.012f
                      paint.strokeCap = Paint.Cap.ROUND
                      paint.color = Color.parseColor("#2D1E12")
                      outerEyePath.reset()
                      outerEyePath.moveTo(cx - rx * 0.88f, cy - ry * 0.42f)
                      outerEyePath.quadTo(cx - rx * 0.35f, cy - ry * 1.68f, cx + rx * 0.08f, cy - ry * 1.36f)
                      canvas.drawPath(outerEyePath, paint)
                      paint.style = Paint.Style.FILL
                  }

                  // Фигурные ресницы справа сверху (точные пропорции с иконки)
                  if (eyeOpenFraction > 0.15f) {
                      paint.color = Color.parseColor("#19130E")
                      lashPath.reset()
                      val topBaseY = cy - ry * 0.86f
                      lashPath.moveTo(cx + rx * 0.02f, topBaseY)
                      lashPath.lineTo(cx + rx * 0.18f, topBaseY - ry * 0.78f)
                      lashPath.lineTo(cx + rx * 0.28f, topBaseY + ry * 0.04f)
                      lashPath.lineTo(cx + rx * 0.48f, topBaseY - ry * 0.62f)
                      lashPath.lineTo(cx + rx * 0.50f, topBaseY + ry * 0.20f)
                      lashPath.lineTo(cx + rx * 0.74f, topBaseY - ry * 0.38f)
                      lashPath.lineTo(cx + rx * 0.68f, topBaseY + ry * 0.44f)
                      lashPath.lineTo(cx + rx * 0.92f, topBaseY + ry * 0.16f)
                      lashPath.lineTo(cx + rx * 0.82f, topBaseY + ry * 0.66f)
                      lashPath.lineTo(cx + rx * 1.04f, topBaseY + ry * 0.60f)
                      lashPath.lineTo(cx + rx * 0.92f, cy)
                      lashPath.close()
                      canvas.drawPath(lashPath, paint)
                  }

                  // 3. Внутренний разрез склеры
                  innerEyePath.reset()
                  innerEyePath.moveTo(cx - rx * 0.92f, cy)
                  innerEyePath.cubicTo(cx - rx * 0.48f, cy - ry * 1.54f, cx + rx * 0.48f, cy - ry * 1.54f, cx + rx * 0.92f, cy)
                  innerEyePath.cubicTo(cx + rx * 0.48f, cy + ry * 1.54f, cx - rx * 0.48f, cy + ry * 1.54f, cx - rx * 0.92f, cy)
                  innerEyePath.close()

                  canvas.save()
                  canvas.clipPath(innerEyePath)

                  val scleraGrad = RadialGradient(
                      cx, cy, rx,
                      intArrayOf(Color.parseColor("#F7F0DE"), Color.parseColor("#E5D6BA"), Color.parseColor("#B8A486")),
                      floatArrayOf(0.45f, 0.82f, 1.0f),
                      Shader.TileMode.CLAMP
                  )
                  paint.shader = scleraGrad
                  canvas.drawPath(innerEyePath, paint)
                  paint.shader = null

                  // Смещение центра радужки и зрачка при живом движении взгляда
                  val eyeCenterX = cx + lookOffsetX * (rx * 0.18f)
                  val irisRadius = maxRy * 0.96f

                  paint.color = Color.parseColor("#12181B")
                  canvas.drawCircle(eyeCenterX, cy, irisRadius * 1.05f, paint)

                  val irisColors = intArrayOf(
                      Color.parseColor("#D32F2F"),
                      Color.parseColor("#F57C00"),
                      Color.parseColor("#FBC02D"),
                      Color.parseColor("#43A047"),
                      Color.parseColor("#0097A7"),
                      Color.parseColor("#303F9F"),
                      Color.parseColor("#C2185B"),
                      Color.parseColor("#D32F2F")
                  )
                  paint.shader = SweepGradient(eyeCenterX, cy, irisColors, null)
                  canvas.drawCircle(eyeCenterX, cy, irisRadius, paint)
                  paint.shader = null

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 2.0f
                  for (deg in 0 until 360 step 6) {
                      val rad = Math.toRadians(deg.toDouble())
                      val rIn = irisRadius * 0.40f
                      val rOut = irisRadius * (if (deg % 12 == 0) 0.95f else 0.85f)
                      paint.color = if (deg % 12 == 0) Color.parseColor("#38000000") else Color.parseColor("#30FFF8E1")
                      canvas.drawLine(
                          eyeCenterX + (rIn * Math.cos(rad)).toFloat(),
                          cy + (rIn * Math.sin(rad)).toFloat(),
                          eyeCenterX + (rOut * Math.cos(rad)).toFloat(),
                          cy + (rOut * Math.sin(rad)).toFloat(),
                          paint
                      )
                  }

                  paint.style = Paint.Style.FILL
                  paint.color = Color.parseColor("#55FFB300")
                  canvas.drawCircle(eyeCenterX, cy, irisRadius * 0.66f, paint)

                  val pupilR = irisRadius * 0.50f * pupilScale
                  paint.color = Color.parseColor("#1E140F")
                  canvas.drawCircle(eyeCenterX, cy, pupilR * 1.08f, paint)
                  paint.color = Color.parseColor("#070505")
                  canvas.drawCircle(eyeCenterX, cy, pupilR, paint)

                  // Живые блики как на иконке
                  paint.color = Color.parseColor("#FFFFFF")
                  canvas.drawCircle(eyeCenterX + pupilR * 0.52f, cy - pupilR * 0.44f, pupilR * 0.25f, paint)
                  canvas.drawCircle(eyeCenterX + pupilR * 0.86f, cy - pupilR * 0.14f, pupilR * 0.11f, paint)
                  paint.color = Color.parseColor("#99FFFFFF")
                  canvas.drawCircle(eyeCenterX - pupilR * 0.56f, cy + pupilR * 0.50f, pupilR * 0.16f, paint)

                  // Тень от верхнего века на глазном яблоке
                  paint.color = Color.parseColor("#33000000")
                  canvas.drawRect(cx - rx, cy - ry * 1.6f, cx + rx, cy - ry * 0.72f, paint)

                  canvas.restore()
              }
          }

          class ThemedTileView(
              context: Context,
              private val iconType: String,
              private val baseColorHex: String,
              private val accentColorHex: String
          ) : View(context) {
              var isTileFocused: Boolean = false
                  set(value) {
                      field = value
                      invalidate()
                  }

              var themeStyleId: Int = 0
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val path = Path()

              private fun darken(color: Int, factor: Float): Int {
                  val r = ((Color.red(color) * factor).toInt()).coerceIn(0, 255)
                  val g = ((Color.green(color) * factor).toInt()).coerceIn(0, 255)
                  val b = ((Color.blue(color) * factor).toInt()).coerceIn(0, 255)
                  return Color.rgb(r, g, b)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val pad = if (isTileFocused) 4f else 9f
                  val mainColor = Color.parseColor(baseColorHex)
                  val badgeColor = Color.parseColor(accentColorHex)

                  val depth = if (themeStyleId == 4 || themeStyleId == 3) 9f else 0f
                  val cy = (h - depth) / 2f
                  val cx = w / 2f
                  val r = (w - pad * 2) * 0.28f

                  when (themeStyleId) {
                      0 -> {
                          paint.style = Paint.Style.FILL
                          paint.color = if (isTileFocused) Color.parseColor("#A8C7FA") else Color.parseColor("#2B2D30")
                          rect.set(pad, pad, w - pad, h - pad)
                          canvas.drawRoundRect(rect, 30f, 30f, paint)
                          paint.color = if (isTileFocused) Color.parseColor("#062E6F") else mainColor
                          canvas.drawCircle(cx, cy, r * 1.15f, paint)
                      }
                      1 -> {
                          paint.style = Paint.Style.FILL
                          paint.color = if (isTileFocused) Color.parseColor("#3300E5FF") else Color.parseColor("#141024")
                          rect.set(pad, pad, w - pad, h - pad)
                          canvas.drawRoundRect(rect, 18f, 18f, paint)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = if (isTileFocused) 3.5f else 2f
                          paint.color = if (isTileFocused) Color.WHITE else Color.parseColor("#00E5FF")
                          canvas.drawRoundRect(rect, 18f, 18f, paint)
                      }
                      2 -> {
                          paint.style = Paint.Style.FILL
                          paint.color = Color.parseColor("#080808")
                          rect.set(pad, pad, w - pad, h - pad)
                          canvas.drawRoundRect(rect, 16f, 16f, paint)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = if (isTileFocused) 3.5f else 1.5f
                          paint.color = if (isTileFocused) Color.parseColor("#00E676") else badgeColor
                          canvas.drawCircle(cx, cy, r * 1.22f, paint)
                      }
                      else -> {
                          if (isTileFocused) {
                              paint.style = Paint.Style.FILL
                              paint.color = Color.parseColor("#55FFFFFF")
                              rect.set(2f, 2f, w - 2f, h - 2f)
                              canvas.drawRoundRect(rect, 24f, 24f, paint)
                          }
                          paint.style = Paint.Style.FILL
                          paint.color = darken(mainColor, 0.56f)
                          rect.set(pad, pad + depth, w - pad, h - pad)
                          canvas.drawRoundRect(rect, 22f, 22f, paint)

                          paint.color = mainColor
                          rect.set(pad, pad, w - pad, h - pad - depth)
                          canvas.drawRoundRect(rect, 22f, 22f, paint)

                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = if (isTileFocused) 3f else 1.5f
                          paint.color = if (isTileFocused) Color.WHITE else Color.parseColor("#55FFFFFF")
                          canvas.drawRoundRect(rect, 22f, 22f, paint)
                      }
                  }

                  val fgColor = when {
                      themeStyleId == 0 && isTileFocused -> Color.parseColor("#A8C7FA")
                      themeStyleId == 1 -> Color.parseColor("#00E5FF")
                      themeStyleId == 2 -> Color.parseColor("#00E676")
                      else -> Color.WHITE
                  }

                  paint.style = Paint.Style.FILL
                  when (iconType) {
                      "PLAYLISTS" -> {
                          for (i in -1..1) {
                              val ly = cy + i * (r * 0.50f)
                              paint.color = fgColor
                              rect.set(cx - r * 0.75f, ly - 4f, cx + r * 0.75f, ly + 4f)
                              canvas.drawRoundRect(rect, 4f, 4f, paint)
                          }
                      }
                      "EDITOR" -> {
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = 5.5f
                          paint.strokeCap = Paint.Cap.ROUND
                          paint.color = fgColor
                          canvas.drawLine(cx - r * 0.42f, cy + 2f, cx - r * 0.08f, cy + r * 0.36f, paint)
                          canvas.drawLine(cx - r * 0.08f, cy + r * 0.36f, cx + r * 0.46f, cy - r * 0.32f, paint)
                      }
                      "ANALYZER" -> {
                          paint.style = Paint.Style.STROKE
                          paint.strokeCap = Paint.Cap.ROUND
                          for (ring in 1..3) {
                              val rad = r * (0.34f * ring)
                              paint.strokeWidth = 5f
                              paint.color = if (ring == 3) badgeColor else fgColor
                              rect.set(cx - rad, cy - rad + 6f, cx + rad, cy + rad + 6f)
                              canvas.drawArc(rect, 215f, 110f, false, paint)
                          }
                          paint.style = Paint.Style.FILL
                          paint.color = badgeColor
                          canvas.drawCircle(cx, cy + r * 0.35f, 6f, paint)
                      }
                      "THEMES" -> {
                          paint.color = badgeColor
                          canvas.drawCircle(cx, cy, r * 0.78f, paint)
                          paint.color = Color.WHITE
                          canvas.drawCircle(cx - r * 0.26f, cy - r * 0.18f, 4.5f, paint)
                          canvas.drawCircle(cx + r * 0.18f, cy - r * 0.24f, 4.5f, paint)
                          canvas.drawCircle(cx + r * 0.28f, cy + r * 0.16f, 4.5f, paint)
                      }
                      "BUFFER" -> {
                          path.reset()
                          path.moveTo(cx + r * 0.12f, cy - r * 0.62f)
                          path.lineTo(cx - r * 0.38f, cy + r * 0.06f)
                          path.lineTo(cx + r * 0.02f, cy + r * 0.06f)
                          path.lineTo(cx - r * 0.14f, cy + r * 0.62f)
                          path.lineTo(cx + r * 0.40f, cy - r * 0.08f)
                          path.lineTo(cx + r * 0.02f, cy - r * 0.08f)
                          path.close()
                          paint.color = fgColor
                          canvas.drawPath(path, paint)
                      }
                      "DECODER" -> {
                          val rainbow = intArrayOf(Color.RED, Color.YELLOW, Color.GREEN, Color.CYAN, Color.BLUE, Color.MAGENTA, Color.RED)
                          paint.shader = SweepGradient(cx, cy, rainbow, null)
                          canvas.drawCircle(cx, cy, r * 0.80f, paint)
                          paint.shader = null
                          paint.color = Color.parseColor("#181818")
                          canvas.drawCircle(cx, cy, r * 0.46f, paint)
                          paint.color = Color.WHITE
                          canvas.drawCircle(cx + r * 0.14f, cy - r * 0.14f, r * 0.11f, paint)
                      }
                      "EPG_GRID" -> {
                          val dotR = r * 0.20f
                          val colors = listOf("#FF5252", "#FFB300", "#00E676", "#00B0FF", "#E040FB", "#FFFFFF")
                          var idx = 0
                          for (row in -1..0) {
                              for (col in -1..1) {
                                  val dx = cx + col * (r * 0.58f)
                                  val dy = cy + row * (r * 0.58f) + (r * 0.24f)
                                  paint.color = Color.parseColor(colors[idx % colors.size])
                                  canvas.drawCircle(dx, dy, dotR, paint)
                                  idx++
                              }
                          }
                      }
                      "TOP_CHANNELS" -> {
                          path.reset()
                          path.moveTo(cx - r * 0.48f, cy + r * 0.36f)
                          path.lineTo(cx - r * 0.54f, cy - r * 0.30f)
                          path.lineTo(cx - r * 0.18f, cy + r * 0.02f)
                          path.lineTo(cx, cy - r * 0.44f)
                          path.lineTo(cx + r * 0.18f, cy + r * 0.02f)
                          path.lineTo(cx + r * 0.54f, cy - r * 0.30f)
                          path.lineTo(cx + r * 0.48f, cy + r * 0.36f)
                          path.close()
                          paint.color = badgeColor
                          canvas.drawPath(path, paint)
                      }
                      "FAVORITES" -> {
                          path.reset()
                          for (i in 0 until 10) {
                              val a = Math.toRadians(-90.0 + i * 36.0)
                              val rad = if (i % 2 == 0) r * 0.62f else r * 0.26f
                              val sx = cx + (rad * Math.cos(a)).toFloat()
                              val sy = cy + (rad * Math.sin(a)).toFloat()
                              if (i == 0) path.moveTo(sx, sy) else path.lineTo(sx, sy)
                          }
                          path.close()
                          paint.color = badgeColor
                          canvas.drawPath(path, paint)
                      }
                      "AUDIO" -> {
                          val widths = listOf(-0.52f, 0f, 0.52f)
                          val heights = listOf(0.42f, 0.76f, 0.56f)
                          for (i in widths.indices) {
                              val bx = cx + widths[i] * r
                              val bh = heights[i] * r
                              paint.color = if (i == 1) badgeColor else fgColor
                              rect.set(bx - 6f, cy - bh, bx + 6f, cy + bh)
                              canvas.drawRoundRect(rect, 6f, 6f, paint)
                          }
                      }
                      "CONTROL_MODE" -> {
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = 4.5f
                          paint.color = fgColor
                          rect.set(cx - r * 0.48f, cy - r * 0.76f, cx + r * 0.48f, cy + r * 0.76f)
                          canvas.drawRoundRect(rect, 9f, 9f, paint)
                          paint.style = Paint.Style.FILL
                          paint.color = badgeColor
                          canvas.drawCircle(cx, cy + r * 0.44f, 5.5f, paint)
                      }
                      else -> {
                          paint.color = fgColor
                          canvas.drawCircle(cx - r * 0.45f, cy, 6f, paint)
                          canvas.drawCircle(cx, cy, 6f, paint)
                          canvas.drawCircle(cx + r * 0.45f, cy, 6f, paint)
                      }
                  }
              }
          }

