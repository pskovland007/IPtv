              private fun closeAllMenus() {
                  menuHistory.clear()
                  hideAllMenuViews()
              }

              private fun navigateToMenu(menuId: String) {
                  if (menuHistory.lastOrNull() != menuId) {
                      menuHistory.add(menuId)
                  }
                  renderMenuById(menuId)
              }

              private fun navigateBackInMenu(): Boolean {
                  if (menuHistory.isEmpty()) return false
                  menuHistory.removeAt(menuHistory.lastIndex)
                  val prev = menuHistory.lastOrNull()
                  if (prev == null) {
                      hideAllMenuViews()
                  } else {
                      renderMenuById(prev)
                  }
                  return true
              }

