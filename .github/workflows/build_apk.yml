              private fun extractMonogram(name: String): String {
                  val words = name.trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                  if (words.size >= 2) return (words[0].take(1) + words[1].take(1)).uppercase()
                  return name.take(2).uppercase()
              }

              private fun monogramColorFor(name: String): Int {
                  val palette = listOf("#1E88E5", "#00897B", "#8E24AA", "#D81B60", "#F4511E", "#3949AB", "#43A047")
                  return Color.parseColor(palette[abs(name.hashCode()) % palette.size])
              }

              private fun createRichChannelAdapter(items: MutableList<String>): ArrayAdapter<String> {
                  return object : ArrayAdapter<String>(this@MainActivity, 0, items) {
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val row = (convertView as? ChannelRowView) ?: ChannelRowView(this@MainActivity).apply {
                              layoutParams = AbsListView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          }
                          val ch = displayedChannels.getOrNull(position)
                          val t = currentTheme()
                          val highlighted = (isSideShowingChannels && position == focusedChannelPos)

                          row.titleView.text = getItem(position) ?: ""
                          row.titleView.typeface = if (highlighted) t.boldFont else t.normalFont
                          row.titleView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17f)
                          row.titleView.forceMarqueeActive = highlighted

                          if (ch != null) {
                              row.badgeView.text = extractMonogram(ch.name)
                              row.badgeView.background = GradientDrawable().apply { setColor(monogramColorFor(ch.name)); cornerRadius = 12f }
                              if (currentChannel?.url == ch.url) {
                                  row.eqView.barColor = if (highlighted) t.textOnAccent else Color.parseColor("#00E676")
                                  row.eqView.visibility = View.VISIBLE; row.eqView.invalidate()
                              } else row.eqView.visibility = View.GONE
                          }

                          if (highlighted) {
                              row.titleView.setTextColor(t.textOnAccent)
                              row.background = GradientDrawable().apply { setColor(t.accentColor); cornerRadius = 20f; setStroke(2, Color.WHITE) }
                          } else {
                              row.titleView.setTextColor(t.textPrimaryColor)
                              row.background = null
                          }
                          return row
                      }
                  }
              }

              private fun refreshChannelListHighlightInPlace(activeAdapterPos: Int) {
                  val t = currentTheme()
                  val firstVis = channelListView.firstVisiblePosition
                  for (i in 0 until channelListView.childCount) {
                      val row = channelListView.getChildAt(i) as? ChannelRowView ?: continue
                      val itemPos = firstVis + i
                      val isHighlighted = (itemPos == activeAdapterPos)
                      val ch = displayedChannels.getOrNull(itemPos)
                      row.titleView.typeface = if (isHighlighted) t.boldFont else t.normalFont
                      row.titleView.forceMarqueeActive = isHighlighted
                      if (ch != null && currentChannel?.url == ch.url) {
                          row.eqView.barColor = if (isHighlighted) t.textOnAccent else Color.parseColor("#00E676")
                          row.eqView.visibility = View.VISIBLE; row.eqView.invalidate()
                      } else row.eqView.visibility = View.GONE
                      if (isHighlighted) {
                          row.titleView.setTextColor(t.textOnAccent)
                          row.background = GradientDrawable().apply { setColor(t.accentColor); cornerRadius = 20f; setStroke(2, Color.WHITE) }
                      } else {
                          row.titleView.setTextColor(t.textPrimaryColor)
                          row.background = null
                      }
                  }
              }

              private fun refreshSimpleListHighlightInPlace(listView: ListView, activeAdapterPos: Int) {
                  val t = currentTheme()
                  val firstVis = listView.firstVisiblePosition
                  for (i in 0 until listView.childCount) {
                      val child = listView.getChildAt(i) as? MarqueeRowTextView ?: continue
                      val itemPos = firstVis + i
                      val isHighlighted = (itemPos == activeAdapterPos)
                      child.typeface = if (isHighlighted) t.boldFont else t.normalFont
                      child.forceMarqueeActive = isHighlighted
                      if (isHighlighted) {
                          child.setTextColor(t.textOnAccent)
                          child.background = GradientDrawable().apply { setColor(t.accentColor); cornerRadius = 20f; setStroke(2, Color.WHITE) }
                      } else {
                          child.setTextColor(t.textPrimaryColor)
                          child.background = null
                      }
                      child.text = colorizeStatusText(child.text.toString())
                  }
              }

              private fun createRoundedSelectorAdapter(items: MutableList<String>, spSize: Float, singleLineMarquee: Boolean = false, isRowHighlighted: (Int) -> Boolean): ArrayAdapter<String> {
                  return object : ArrayAdapter<String>(this@MainActivity, 0, items) {
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val tv = (convertView as? MarqueeRowTextView) ?: MarqueeRowTextView(this@MainActivity).apply {
                              layoutParams = AbsListView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          }
                          val t = currentTheme()
                          val highlighted = isRowHighlighted(position)
                          val rawTxt = getItem(position) ?: ""
                          tv.typeface = if (highlighted) t.boldFont else t.normalFont
                          tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, spSize)
                          tv.setPadding(22, 13, 22, 13)
                          if (singleLineMarquee) tv.forceMarqueeActive = highlighted else tv.isSingleLine = false
                          if (highlighted) {
                              tv.setTextColor(t.textOnAccent)
                              tv.background = GradientDrawable().apply { setColor(t.accentColor); cornerRadius = 20f; setStroke(2, Color.WHITE) }
                          } else {
                              tv.setTextColor(t.textPrimaryColor)
                              tv.background = null
                          }
                          tv.text = colorizeStatusText(rawTxt)
                          return tv
                      }
                  }
              }

              private fun buildAndShowZappingBar() {
                  val list = displayedChannels.toList()
                  if (list.isEmpty()) return
                  zappingRowContainer.removeAllViews()
                  zappingRowContainer.visibility = View.VISIBLE

                  val curIdx = list.indexOfFirst { it.url == currentChannel?.url }.takeIf { it >= 0 } ?: 0
                  val offsets = listOf(-2, -1, 0, 1, 2)
                  var centerCard: View? = null

                  for (off in offsets) {
                      val idx = (curIdx + off + list.size) % list.size
                      val ch = list[idx]
                      val (epg, _) = getCurrentAndNextEpg(ch)
                      val epgTxt = epg?.title ?: effectiveCategory(ch)
                      val prefix = if (off == 0) "▶ " else ""
                      val cardBtn = makeModernButton("$prefix${ch.name}\n🎬 ${epgTxt.take(20)}") {
                          playChannelObj(ch)
                          buildAndShowZappingBar()
                      }.apply {
                          isSingleLine = false; maxLines = 2
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { setMargins(4, 2, 4, 2) }
                      }
                      if (off == 0) centerCard = cardBtn
                      zappingRowContainer.addView(cardBtn)
                  }
                  centerCard?.requestFocus()
              }

