              // Пункт 4: Полное скрытие верхней чёрной шторки со временем/зарядом батареи и выреза камеры на телефоне
              private fun enableTrueFullScreenImmersion() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          window.attributes = window.attributes.apply {
                              layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                          }
                      }
                      window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                      window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)

                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                      )

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          window.setDecorFitsSystemWindows(false)
                          window.insetsController?.let { controller ->
                              controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                              controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          }
                      }
                  } catch (_: Exception) {}
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      enableTrueFullScreenImmersion()
                  }
              }

              // Пункт 11: Инициализация SSL/TLS и обхода DPI/блокировок для РФ
              private fun setupRussiaNetworkBypass() {
                  try {
                      val trustAllCerts = arrayOf<TrustManager>(object : X509TrustManager {
                          override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
                          override fun checkClientTrusted(certs: Array<X509Certificate>, authType: String) {}
                          override fun checkServerTrusted(certs: Array<X509Certificate>, authType: String) {}
                      })
                      val sc = SSLContext.getInstance("TLS")
                      sc.init(null, trustAllCerts, SecureRandom())
                      HttpsURLConnection.setDefaultSSLSocketFactory(sc.socketFactory)
                      HttpsURLConnection.setDefaultHostnameVerifier(HostnameVerifier { _, _ -> true })
                  } catch (_: Exception) {}
              }

              // Пункт 11: Загрузка текста с автоматическим переключением на резервный прокси при блокировке домена провайдером в РФ
              private fun openStreamWithRussiaBypass(rawUrl: String, timeoutMs: Int = 7000): InputStream {
                  val candidates = mutableListOf(rawUrl)
                  if (antiBlockEnabled) {
                      if (rawUrl.contains("raw.githubusercontent.com")) {
                          candidates.add(rawUrl.replace("https://raw.githubusercontent.com/", "https://mirror.ghproxy.com/https://raw.githubusercontent.com/"))
                      }
                      if (rawUrl.contains("iptv-org.github.io")) {
                          candidates.add("https://corsproxy.io/?" + rawUrl)
                      }
                  }
                  var lastErr: Exception? = null
                  for (u in candidates) {
                      try {
                          val conn = URL(u).openConnection() as HttpURLConnection
                          conn.setRequestProperty("User-Agent", russianSmartTvAgents[userAgentIndex % russianSmartTvAgents.size])
                          conn.setRequestProperty("Accept", "*/*")
                          conn.setRequestProperty("Connection", "keep-alive")
                          conn.instanceFollowRedirects = true
                          conn.connectTimeout = timeoutMs
                          conn.readTimeout = timeoutMs
                          if (conn.responseCode in 200..299) {
                              return conn.inputStream
                          }
                      } catch (e: Exception) {
                          lastErr = e
                      }
                  }
                  throw lastErr ?: Exception("Network unreachable")
              }

