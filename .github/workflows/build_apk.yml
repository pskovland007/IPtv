              private fun showAudioTracksDialog() {
                  val p = player ?: return
                  val groups = p.currentTracks.groups.filter { it.type == C.TRACK_TYPE_AUDIO }
                  if (groups.isEmpty()) {
                      Toast.makeText(this, "Дополнительные аудиодорожки не найдены", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val labels = mutableListOf<String>()
                  val overrides = mutableListOf<TrackSelectionOverride>()
                  for (g in groups) {
                      for (i in 0 until g.length) {
                          val fmt = g.getTrackFormat(i)
                          val codec = fmt.sampleMimeType?.substringAfter("/")?.uppercase() ?: "AUDIO"
                          val lang = fmt.language?.uppercase() ?: ("Дорожка " + (labels.size + 1))
                          val sel = if (g.isTrackSelected(i)) "✔ " else "   "
                          labels.add(sel + lang + " (" + codec + ", " + fmt.channelCount + " кан.)")
                          overrides.add(TrackSelectionOverride(g.mediaTrackGroup, i))
                      }
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Выбор аудиодорожки")
                      .setItems(labels.toTypedArray()) { _, idx ->
                          p.trackSelectionParameters = p.trackSelectionParameters
                              .buildUpon()
                              .setOverrideForType(overrides[idx])
                              .build()
                          Toast.makeText(this, "Выбрана: " + labels[idx].trim(), Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

