              private fun applyBrightnessLevel() {
                  val pct = brightnessPercent.coerceIn(25, 100)
                  if (pct >= 100) {
                      nightDimOverlay.visibility = View.GONE
                      val lp = window.attributes
                      lp.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                      window.attributes = lp
                  } else {
                      val alpha = ((100 - pct) * 2.15f).toInt().coerceIn(0, 210)
                      nightDimOverlay.setBackgroundColor(Color.argb(alpha, 0, 0, 0))
                      nightDimOverlay.visibility = View.VISIBLE
                      val lp = window.attributes
                      lp.screenBrightness = (pct / 100f).coerceIn(0.10f, 1.0f)
                      window.attributes = lp
                  }
                  if (::btnOsdNightMode.isInitialized) {
                      btnOsdNightMode.text = "🌙 Яркость $pct%"
                  }
              }

