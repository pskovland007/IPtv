              // Индикатор приёма канала («антенки» в правом углу)
              private fun updateSignalIndicator() {
                  val p = player
                  if (p == null) {
                      signalTextView.text = "▂___ Нет сигнала"
                      signalTextView.setTextColor(Color.GRAY)
                      return
                  }
                  val state = p.playbackState
                  val bufSec = (p.totalBufferedDuration / 1000L).toInt()
                  val vFmt = p.videoFormat
                  val height = vFmt?.height ?: p.videoSize.height
                  val resTag = when {
                      height >= 2160 -> "4K"
                      height >= 1080 -> "FHD"
                      height >= 720 -> "HD"
                      height > 0 -> "${height}p"
                      else -> ""
                  }

                  when {
                      state == Player.STATE_IDLE -> {
                          signalTextView.text = "▂___ Ожидание"
                          signalTextView.setTextColor(Color.parseColor("#FF5252"))
                      }
                      state == Player.STATE_BUFFERING -> {
                          signalTextView.text = "▂▄__ Буфер..."
                          signalTextView.setTextColor(Color.parseColor("#FFD740"))
                      }
                      state == Player.STATE_READY && bufSec >= 10 -> {
                          signalTextView.text = "▂▄▆█ 5/5 $resTag".trim()
                          signalTextView.setTextColor(Color.parseColor("#00E676"))
                      }
                      state == Player.STATE_READY && bufSec >= 4 -> {
                          signalTextView.text = "▂▄▆_ 4/5 $resTag".trim()
                          signalTextView.setTextColor(Color.parseColor("#69F0AE"))
                      }
                      state == Player.STATE_READY && bufSec >= 1 -> {
                          signalTextView.text = "▂▄__ 3/5 $resTag".trim()
                          signalTextView.setTextColor(Color.parseColor("#FFD740"))
                      }
                      else -> {
                          signalTextView.text = "▂___ 2/5 $resTag".trim()
                          signalTextView.setTextColor(Color.parseColor("#FF5252"))
                      }
                  }
              }

              // Пункт 12: Инициализация плеера с защитой от чёрного экрана и поддержкой редиректов
              private fun initPlayer() {
                  val currentUrl = currentChannel?.url
                  player?.release()

                  val (minBuf, maxBuf, startBuf) = when (bufferLevel) {
                      0 -> Triple(3000, 8000, 1000)
                      2 -> Triple(28000, 60000, 2500)
                      else -> Triple(12000, 28000, 1500)
                  }

                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(minBuf, maxBuf, startBuf, startBuf)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .build()

                  val extensionMode = when (decoderMode) {
                      0 -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_OFF
                      2 -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER
                      else -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON
                  }

                  val renderersFactory = DefaultRenderersFactory(this)
                      .setExtensionRendererMode(extensionMode)
                      .setEnableDecoderFallback(true)
                      .setEnableAudioTrackPlaybackParams(true)

                  // Сетевой источник с поддержкой редиректов http<->https и SmartTV User-Agent (убирает чёрный экран)
                  val httpDataSourceFactory = DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Linux; Android 11; MiBox) AppleWebKit/537.36 Lavf/60.3.100")
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(12000)
                      .setReadTimeoutMs(15000)

                  val mediaSourceFactory = DefaultMediaSourceFactory(this)
                      .setDataSourceFactory(httpDataSourceFactory)

                  val audioAttrs = AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                      .build()

                  val newPlayer = ExoPlayer.Builder(this, renderersFactory)
                      .setMediaSourceFactory(mediaSourceFactory)
                      .setLoadControl(loadControl)
                      .setAudioAttributes(audioAttrs, true)
                      .build()

                  newPlayer.trackSelectionParameters = newPlayer.trackSelectionParameters
                      .buildUpon()
                      .setMaxVideoSize(3840, 2160)
                      .setForceHighestSupportedBitrate(true)
                      .setPreferredAudioLanguages("ru", "rus", "en", "eng", "und")
                      .build()

                  newPlayer.videoScalingMode = C.VIDEO_SCALING_MODE_SCALE_TO_FIT

                  // Автовосстановление при сбое потока
                  newPlayer.addListener(object : Player.Listener {
                      override fun onPlayerError(error: PlaybackException) {
                          Toast.makeText(
                              this@MainActivity,
                              "Поток недоступен (${error.errorCodeName}), переподключение...",
                              Toast.LENGTH_SHORT
                          ).show()
                          uiHandler.postDelayed({
                              val ch = currentChannel
                              if (ch != null) {
                                  newPlayer.setMediaItem(MediaItem.fromUri(ch.url))
                                  newPlayer.prepare()
                                  newPlayer.play()
                              }
                          }, 2000)
                      }
                  })

                  playerView.player = newPlayer
                  player = newPlayer

                  if (currentUrl != null) {
                      newPlayer.setMediaItem(MediaItem.fromUri(currentUrl))
                      newPlayer.prepare()
                      newPlayer.play()
                  }
              }

              private fun normalizeName(raw: String): String {
                  val clean = raw.lowercase()
                      .replace("1080p", "")
                      .replace("720p", "")
                      .replace("fhd", "")
                      .replace("hd", "")
                      .replace("50", "")
                  val sb = StringBuilder()
                  var inBrackets = false
                  for (c in clean) {
                      if (c == '(' || c == '[') inBrackets = true
                      else if (c == ')' || c == ']') inBrackets = false
                      else if (!inBrackets && (c in 'a'..'z' || c in 'а'..'я' || c in '0'..'9')) {
                          sb.append(c)
                      }
                  }
                  return sb.toString()
              }

              private fun getCurrentEpg(ch: Channel?): EpgProgram? {
                  if (ch == null) return null
                  val now = System.currentTimeMillis()
                  if (ch.tvgId.isNotEmpty()) {
                      val byId = epgById[ch.tvgId]?.firstOrNull { now in it.startMs..it.stopMs }
                      if (byId != null) return byId
                  }
                  val norm = normalizeName(ch.name)
                  if (norm.isNotEmpty()) {
                      return epgByName[norm]?.firstOrNull { now in it.startMs..it.stopMs }
                  }
                  return null
              }

              private fun loadEpgInBackground() {
                  thread {
                      try {
                          val conn = URL(epgUrl).openConnection() as HttpURLConnection
                          conn.connectTimeout = 15000
                          conn.readTimeout = 25000
                          val rawStream: InputStream = conn.inputStream
                          val stream: InputStream = if (epgUrl.endsWith(".gz", true)) {
                              GZIPInputStream(rawStream)
                          } else {
                              rawStream
                          }

                          val factory = XmlPullParserFactory.newInstance()
                          val parser = factory.newPullParser()
                          parser.setInput(stream, "UTF-8")

                          val now = System.currentTimeMillis()
                          val minTime = now - 4 * 3600_000L
                          val maxTime = now + 14 * 3600_000L

                          val tempById = HashMap<String, MutableList<EpgProgram>>()
                          val tempIdToNames = HashMap<String, MutableList<String>>()

                          var eventType = parser.eventType
                          var currentChanId = ""
                          var progChanId = ""
                          var progStart = 0L
                          var progStop = 0L
                          var progTitle = ""
                          var progDesc = ""
                          var currentTag = ""
                          var count = 0

                          while (eventType != XmlPullParser.END_DOCUMENT) {
                              when (eventType) {
                                  XmlPullParser.START_TAG -> {
                                      currentTag = parser.name ?: ""
                                      if (currentTag == "channel") {
                                          currentChanId = parser.getAttributeValue(null, "id") ?: ""
                                      } else if (currentTag == "programme") {
                                          progChanId = parser.getAttributeValue(null, "channel") ?: ""
                                          progStart = parseXmltvDate(parser.getAttributeValue(null, "start") ?: "")
                                          progStop = parseXmltvDate(parser.getAttributeValue(null, "stop") ?: "")
                                          progTitle = ""
                                          progDesc = ""
                                      }
                                  }
                                  XmlPullParser.TEXT -> {
                                      val txt = parser.text ?: ""
                                      if (txt.isNotBlank()) {
                                          if (currentTag == "display-name" && currentChanId.isNotEmpty()) {
                                              val list = tempIdToNames.getOrPut(currentChanId) { mutableListOf() }
                                              list.add(normalizeName(txt))
                                          } else if (currentTag == "title" && progStop >= minTime && progStart <= maxTime) {
                                              progTitle += txt
                                          } else if (currentTag == "desc" && progStop >= minTime && progStart <= maxTime) {
                                              progDesc += txt
                                          }
                                      }
                                  }
                                  XmlPullParser.END_TAG -> {
                                      val endName = parser.name ?: ""
                                      if (endName == "channel") {
                                          currentChanId = ""
                                      } else if (endName == "programme") {
                                          if (progChanId.isNotEmpty() && progTitle.isNotEmpty() && progStop >= minTime && progStart <= maxTime) {
                                              val list = tempById.getOrPut(progChanId) { mutableListOf() }
                                              list.add(EpgProgram(progTitle.trim(), progDesc.trim(), progStart, progStop))
                                              count++
                                          }
                                          progChanId = ""
                                      }
                                      currentTag = ""
                                  }
                              }
                              eventType = parser.next()
                          }

                          val tempByName = HashMap<String, MutableList<EpgProgram>>()
                          for ((id, progs) in tempById) {
                              val names = tempIdToNames[id] ?: continue
                              for (n in names) {
                                  if (n.isNotEmpty()) {
                                      tempByName[n] = progs
                                  }
                              }
                          }

                          runOnUiThread {
                              epgById.clear()
                              epgById.putAll(tempById)
                              epgByName.clear()
                              epgByName.putAll(tempByName)
                              epgLoadedCount = count
                              refreshChannelAdapter()
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun parseXmltvDate(raw: String): Long {
                  if (raw.length < 14) return 0L
                  return try {
                      val clean = raw.trim()
                      val sdf = if (clean.length >= 19 && (clean.contains("+") || clean.contains("-"))) {
                          SimpleDateFormat("yyyyMMddHHmmss Z", Locale.US)
                      } else {
                          SimpleDateFormat("yyyyMMddHHmmss", Locale.US).apply {
                              timeZone = TimeZone.getTimeZone("GMT+3")
                          }
                      }
                      sdf.parse(clean)?.time ?: 0L
                  } catch (_: Exception) {
                      0L
                  }
              }

              private fun updateStreamInfoText() {
                  val p = player ?: return
                  val ch = currentChannel
                  val vFormat = p.videoFormat
                  val aFormat = p.audioFormat

                  val width = vFormat?.width ?: p.videoSize.width
                  val height = vFormat?.height ?: p.videoSize.height
                  val fps = if (vFormat != null && vFormat.frameRate > 0) String.format(Locale.US, "%.0f fps", vFormat.frameRate) else ""
                  val vCodec = vFormat?.sampleMimeType?.substringAfter("/")?.uppercase() ?: "Анализ..."

                  val vBitrate = if (vFormat != null && vFormat.bitrate > 0) {
                      String.format(Locale.US, "%.2f Мбит/с", vFormat.bitrate / 1_000_000f)
                  } else {
                      "Макс. поток HLS"
                  }

                  val aCodec = aFormat?.sampleMimeType?.substringAfter("/")?.uppercase() ?: "Авто"
                  val aChannels = if (aFormat != null && aFormat.channelCount > 0) aFormat.channelCount.toString() + " кан." else ""
                  val aSampleRate = if (aFormat != null && aFormat.sampleRate > 0) aFormat.sampleRate.toString() + " Гц" else ""
                  val aLang = aFormat?.language?.uppercase() ?: "RU/EN"
                  val bufSec = p.totalBufferedDuration / 1000L

                  val epg = getCurrentEpg(ch)
                  val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
                  val epgLine = if (epg != null) {
                      val range = timeFmt.format(Date(epg.startMs)) + "–" + timeFmt.format(Date(epg.stopMs))
                      "🎬 Сейчас в эфире (" + range + "):\n" + epg.title + (if (epg.desc.isNotEmpty()) "\nОписание: " + epg.desc.take(140) else "")
                  } else {
                      "🎬 Телепрограмма: " + (if (epgLoadedCount > 0) "Передача не указана" else "Загрузка базы EPG...")
                  }

                  infoTextView.text = "📺 Канал: " + (ch?.name ?: "-") + "\n" +
                      "📂 Категория: " + (ch?.category ?: "-") + "\n\n" +
                      "🖥 Видео: " + width + "x" + height + " " + fps + " (" + vCodec + ")\n" +
                      "📊 Битрейт: " + vBitrate + " (Запас буфера: " + bufSec + " с)\n" +
                      "🔊 Аудиодорожка: " + aCodec + " " + aChannels + " " + aSampleRate + " [" + aLang + "]\n" +
                      "⚙ Декодер: " + decoderName() + " | Буфер: " + bufferName() + "\n\n" +
                      epgLine
              }

              private fun mapToTenCategories(rawGroup: String, name: String): String {
                  val text = (rawGroup + " " + name).lowercase()
                  return when {
                      text.contains("взросл") || text.contains("18+") || text.contains("adult") || text.contains("xxx") || text.contains("erot") -> "Прочее"
                      text.contains("кино") || text.contains("фильм") || text.contains("сериал") || text.contains("movie") || text.contains("cinema") || text.contains("film") || text.contains("bcu") || text.contains("cineman") || text.contains("viju") || text.contains("amedia") -> "Кино и сериалы"
                      text.contains("спорт") || text.contains("футбол") || text.contains("матч") || text.contains("sport") || text.contains("khl") || text.contains("ufc") || text.contains("mma") || text.contains("бокс") -> "Спорт"
                      text.contains("детск") || text.contains("мульт") || text.contains("kids") || text.contains("ani") || text.contains("карусель") || text.contains("disney") || text.contains("nickelodeon") -> "Детские"
                      text.contains("наук") || text.contains("док") || text.contains("познав") || text.contains("science") || text.contains("doc") || text.contains("history") || text.contains("discovery") || text.contains("nat geo") || text.contains("animal") || text.contains("планет") || text.contains("охот") -> "Познавательные"
                      text.contains("муз") || text.contains("music") || text.contains("hit") || text.contains("rock") || text.contains("pop") || text.contains("шансон") || text.contains("mtv") || text.contains("bridge") || text.contains("mezzo") -> "Музыка"
                      text.contains("новост") || text.contains("общ") || text.contains("инфо") || text.contains("news") || text.contains("general") || text.contains("россия") || text.contains("первый") || text.contains("нтв") || text.contains("рбк") || text.contains("псков") -> "Новости и общие"
                      text.contains("развлеч") || text.contains("юмор") || text.contains("шоу") || text.contains("entertain") || text.contains("comedy") || text.contains("тнт") || text.contains("стс") || text.contains("пятница") -> "Развлечения"
                      else -> "Прочее"
                  }
              }

              private fun isHighQualityChannel(extInfLine: String, name: String): Boolean {
                  val lower = (extInfLine + " " + name).lowercase()
                  val lowRes = listOf("576p", "540p", "480p", "360p", "240p", "(sd)")
                  for (tag in lowRes) {
                      if (lower.contains(tag)) return false
                  }
                  return lower.contains("1080") || lower.contains("fhd") || lower.contains("hd") || lower.contains("4k") || lower.contains("uhd") || lower.contains("50")
              }

              private fun parseM3uLines(lines: List<String>, onlyStrict1080: Boolean): List<Channel> {
                  val strictList = mutableListOf<Channel>()
                  val allFallback = mutableListOf<Channel>()
                  val seenUrls = HashSet<String>()
                  var currentName = "Канал"
                  var currentExtInf = ""
                  var currentGroup = ""
                  var currentTvgId = ""
                  val quote = 34.toChar().toString()

                  for (line in lines) {
                      val trimmed = line.trim()
                      if (trimmed.startsWith("#EXTINF:")) {
                          currentExtInf = trimmed
                          currentName = trimmed.substringAfterLast(",").trim()
                          val groupPrefix = "group-title=" + quote
                          currentGroup = if (trimmed.contains(groupPrefix)) {
                              trimmed.substringAfter(groupPrefix).substringBefore(quote)
                          } else ""
                          val idPrefix = "tvg-id=" + quote
                          currentTvgId = if (trimmed.contains(idPrefix)) {
                              trimmed.substringAfter(idPrefix).substringBefore(quote)
                          } else ""
                      } else if (trimmed.startsWith("#EXTGRP:")) {
                          // Поддержка тега #EXTGRP: из файла пользователя
                          currentGroup = trimmed.substringAfter("#EXTGRP:").trim()
                      } else if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                          if (seenUrls.add(trimmed)) {
                              val cat = mapToTenCategories(currentGroup, currentName)
                              val ch = Channel(currentName, trimmed, cat, currentTvgId)
                              allFallback.add(ch)
                              if (isHighQualityChannel(currentExtInf, currentName)) {
                                  strictList.add(ch)
                              }
                          }
                      }
                  }
                  return if (onlyStrict1080 && strictList.isNotEmpty()) strictList else allFallback
              }

              private fun ensureDefaultPlaylists() {
                  if (playlists.isEmpty()) {
                      playlists.add(PlaylistEntry("1. Открытые RU + Sport/Music EN", "BUILTIN_OPEN_RU", false))
                      playlists.add(PlaylistEntry("2. VIP Провайдер (Кинозалы + Спорт + 18+)", "BUILTIN_VIP_PROVIDER", false))
                  } else {
                      if (playlists.none { it.source == "BUILTIN_OPEN_RU" }) {
                          playlists.add(0, PlaylistEntry("1. Открытые RU + Sport/Music EN", "BUILTIN_OPEN_RU", false))
                      }
                      if (playlists.none { it.source == "BUILTIN_VIP_PROVIDER" }) {
                          playlists.add(1, PlaylistEntry("2. VIP Провайдер (Кинозалы + Спорт + 18+)", "BUILTIN_VIP_PROVIDER", false))
                      }
                  }
              }

              private fun loadActivePlaylist() {
                  ensureDefaultPlaylists()
                  if (activePlaylistIndex !in playlists.indices) activePlaylistIndex = 0
                  val entry = playlists[activePlaylistIndex]
                  updateTopLabel()

                  Toast.makeText(this, "Загрузка: " + entry.title, Toast.LENGTH_SHORT).show()

                  thread {
                      try {
                          val finalChannels: List<Channel> = when {
                              entry.source == "BUILTIN_VIP_PROVIDER" -> {
                                  BuiltinCatalog.buildVipChannels(vipToken)
                              }
                              entry.source == "BUILTIN_OPEN_RU" -> {
                                  val combinedLines = mutableListOf<String>()
                                  for (srcUrl in openRusSources) {
                                      try {
                                          val conn = URL(srcUrl).openConnection() as HttpURLConnection
                                          conn.connectTimeout = 8000
                                          conn.readTimeout = 10000
                                          combinedLines.addAll(conn.inputStream.bufferedReader().readLines())
                                      } catch (_: Exception) {}
                                  }
                                  val parsed = parseM3uLines(combinedLines, true).toMutableList()
                                  parsed.addAll(BuiltinCatalog.extraOpenStreams)
                                  parsed
                              }
                              entry.isLocal -> {
                                  val lines = if (entry.source.startsWith("content://")) {
                                      contentResolver.openInputStream(Uri.parse(entry.source))?.bufferedReader()?.readLines() ?: emptyList()
                                  } else {
                                      File(entry.source).readLines()
                                  }
                                  parseM3uLines(lines, false)
                              }
                              else -> {
                                  val conn = URL(entry.source).openConnection() as HttpURLConnection
                                  conn.connectTimeout = 10000
                                  conn.readTimeout = 12000
                                  val lines = conn.inputStream.bufferedReader().readLines()
                                  parseM3uLines(lines, false)
                              }
                          }

                          runOnUiThread {
                              allChannels.clear()
                              allChannels.addAll(finalChannels)
                              updateCategoriesList()
                              selectCategory(1)
                              if (displayedChannels.isNotEmpty()) {
                                  playChannelObj(displayedChannels[0])
                              } else {
                                  Toast.makeText(this, "Каналы не найдены", Toast.LENGTH_LONG).show()
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this, "Ошибка плейлиста: " + e.message, Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              private fun updateTopLabel() {
                  if (playlists.isNotEmpty() && activePlaylistIndex in playlists.indices) {
                      activePlaylistLabel.text = playlists[activePlaylistIndex].title + " | Буфер: " + bufferName()
                  }
              }

              private fun updateCategoriesList() {
                  val counts = categories.map { cat ->
                      val count = when (cat) {
                          "★ Избранное" -> allChannels.count { favoriteUrls.contains(it.url) }
                          "Все каналы" -> allChannels.size
                          else -> allChannels.count { it.category == cat }
                      }
                      cat + " (" + count + ")"
                  }
                  categoryAdapter.clear()
                  categoryAdapter.addAll(counts)
                  categoryAdapter.notifyDataSetChanged()
              }

              private fun selectCategory(index: Int) {
                  if (index !in categories.indices) return
                  currentCategoryIndex = index
                  categoryListView.setItemChecked(index, true)
                  val catName = categories[index]

                  displayedChannels.clear()
                  when (catName) {
                      "★ Избранное" -> displayedChannels.addAll(allChannels.filter { favoriteUrls.contains(it.url) })
                      "Все каналы" -> displayedChannels.addAll(allChannels)
                      else -> displayedChannels.addAll(allChannels.filter { it.category == catName })
                  }

                  refreshChannelAdapter()
              }

              private fun refreshChannelAdapter() {
                  channelAdapter.clear()
                  channelAdapter.addAll(displayedChannels.mapIndexed { i, ch ->
                      val star = if (favoriteUrls.contains(ch.url)) "★ " else ""
                      val epg = getCurrentEpg(ch)
                      val epgSuffix = if (epg != null) " • " + epg.title else ""
                      (i + 1).toString() + ". " + star + ch.name + epgSuffix
                  })
                  channelAdapter.notifyDataSetChanged()
              }

              private fun toggleFavorite(ch: Channel) {
                  if (favoriteUrls.contains(ch.url)) {
                      favoriteUrls.remove(ch.url)
                      Toast.makeText(this, "Удалено из избранного: " + ch.name, Toast.LENGTH_SHORT).show()
                  } else {
                      favoriteUrls.add(ch.url)
                      Toast.makeText(this, "Добавлено в ★ Избранное: " + ch.name, Toast.LENGTH_SHORT).show()
                  }
                  saveState()
                  updateCategoriesList()
                  selectCategory(currentCategoryIndex)
              }

              private fun playChannelObj(channel: Channel) {
                  currentChannel = channel
                  player?.setMediaItem(MediaItem.fromUri(channel.url))
                  player?.prepare()
                  player?.play()
                  val star = if (favoriteUrls.contains(channel.url)) "★ " else ""
                  val epg = getCurrentEpg(channel)
                  val epgLine = if (epg != null) "\nСейчас: " + epg.title else ""
                  showBanner(star + channel.name + " [" + channel.category + "]" + epgLine)
                  updateSignalIndicator()
                  if (infoPanel.visibility == View.VISIBLE) {
                      updateStreamInfoText()
                  }
              }

              private fun showBanner(text: String) {
                  currentChannelBanner.text = text
                  currentChannelBanner.visibility = View.VISIBLE
                  currentChannelBanner.removeCallbacks(hideBannerRunnable)
                  currentChannelBanner.postDelayed(hideBannerRunnable, 4500)
              }

