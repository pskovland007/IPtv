                  btnRow.addView(btnBack)
                  subModalInputContainer.addView(btnRow)

                  animateMenuAppear(subModalOverlay)
                  nameInput.requestFocus()
              }

              private fun buildLanguageTag(ch: Channel): String {
                  val lower = (ch.name + " " + ch.url).lowercase()
                  val hasCyrillic = ch.name.any { it in 'а'..'я' || it in 'А'..'Я' || it == 'ё' || it == 'Ё' }
                  val isCisStream = lower.contains(".ru") || lower.contains(".kz") || lower.contains(".by") || lower.contains("ru_") || lower.contains("(ru)")
                  val isBilingualBrand = lower.contains("setanta") || lower.contains("discovery") || lower.contains("nat geo") || lower.contains("viasat") || lower.contains("tv 1000") || lower.contains("tv1000") || lower.contains("nickelodeon") || lower.contains("cartoon") || lower.contains("hollywood") || lower.contains("paramount") || lower.contains("fox") || lower.contains("tlc") || lower.contains("animal planet") || lower.contains("eurosport")

                  val lang = when {
                      isBilingualBrand -> "RU/EN"
                      hasCyrillic || isCisStream -> "RU"
                      else -> "EN"
                  }
                  return "($lang)"
              }

