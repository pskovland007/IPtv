                  channelListView.adapter = channelAdapter

                  categoryListView.setOnItemClickListener { _, _, position, _ ->
                      resetMenuInactivityTimer(); focusedCategoryPos = position; selectCategory(position)
                      showSideChannelsMode(focusTop = true, focusCurrentChannel = false)
                  }
                  categoryListView.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          resetMenuInactivityTimer(); focusedCategoryPos = position; selectCategory(position)
                          refreshSimpleListHighlightInPlace(categoryListView, position)
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  categoryListView.setOnKeyListener { _, keyCode, event ->
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          resetMenuInactivityTimer()
                          val count = categoryAdapter.count
                          when (keyCode) {
                              KeyEvent.KEYCODE_DPAD_LEFT -> { showLeftIconRailFromGroups(); return@setOnKeyListener true }
                              KeyEvent.KEYCODE_DPAD_RIGHT -> {
                                  selectCategory(focusedCategoryPos.coerceAtLeast(0))
                                  showSideChannelsMode(focusTop = true, focusCurrentChannel = false)
                                  return@setOnKeyListener true
                              }
                              KeyEvent.KEYCODE_DPAD_UP -> if (count > 0 && focusedCategoryPos <= 0) {
                                  val lastIdx = count - 1; focusedCategoryPos = lastIdx; selectCategory(lastIdx)
                                  categoryListView.setSelectionFromTop(lastIdx, 0); refreshSimpleListHighlightInPlace(categoryListView, lastIdx)
                                  return@setOnKeyListener true
                              }
                              KeyEvent.KEYCODE_DPAD_DOWN -> if (count > 0 && focusedCategoryPos >= count - 1) {
                                  focusedCategoryPos = 0; selectCategory(0)
                                  categoryListView.setSelectionFromTop(0, 0); refreshSimpleListHighlightInPlace(categoryListView, 0)
                                  return@setOnKeyListener true
                              }
                          }
                      }
                      false
                  }

                  channelListView.setOnKeyListener { _, keyCode, event ->
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          resetMenuInactivityTimer()
                          val count = displayedChannels.size
                          if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT) {
                              showSideGroupsMode(); return@setOnKeyListener true
                          } else if (keyCode == KeyEvent.KEYCODE_DPAD_UP && count > 0 && focusedChannelPos <= 0) {
                              val lastIdx = count - 1; focusedChannelPos = lastIdx
                              channelListView.setSelectionFromTop(lastIdx, 0); channelListView.setItemChecked(lastIdx, true)
                              refreshChannelListHighlightInPlace(lastIdx)
                              return@setOnKeyListener true
                          } else if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN && count > 0 && focusedChannelPos >= count - 1) {
                              focusedChannelPos = 0
                              channelListView.setSelectionFromTop(0, 0); channelListView.setItemChecked(0, true)
                              refreshChannelListHighlightInPlace(0)
                              return@setOnKeyListener true
                          }
                      }
                      false
                  }
                  channelListView.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          resetMenuInactivityTimer(); focusedChannelPos = position
                          refreshChannelListHighlightInPlace(position)
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  channelListView.setOnItemClickListener { _, _, position, _ ->
                      val list = displayedChannels.toList()
                      if (position in list.indices) { focusedChannelPos = position; playChannelObj(list[position]); closeAllMenus() }
                  }
                  channelListView.setOnItemLongClickListener { _, _, position, _ ->
                      val list = displayedChannels.toList()
                      if (position in list.indices) toggleFavorite(list[position])
                      true
                  }

                  applyCurrentThemeToAllPanels()
                  loadActivePlaylist(autoPlayLast = true)
                  loadEpgOncePerDayInBackground(forceRefresh = false)
              }

