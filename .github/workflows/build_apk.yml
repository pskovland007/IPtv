                  val mainColor = when (themeStyleId) {
                      0 -> Color.parseColor(if (isTileFocused) "#1E3A8A" else "#2B2D30")
                      1 -> Color.parseColor("#141028")
                      2 -> Color.parseColor("#0A0A0A")
                      5 -> Color.parseColor(if (isTileFocused) "#3F3F46" else "#18181B")
                      6 -> Color.parseColor(if (isTileFocused) "#DBEAFE" else "#F1F5F9")
                      7 -> Color.parseColor("#240634")
                      8 -> Color.parseColor("#041604")
                      9 -> Color.parseColor("#1A1308")
                      else -> Color.parseColor(baseColorHex)
                  }
                  val badgeColor = when (themeStyleId) {
                      0 -> Color.parseColor("#A8C7FA")
                      1 -> Color.parseColor("#00E5FF")
                      2 -> Color.parseColor("#00E676")
                      3 -> Color.parseColor("#88C0D0")
                      4 -> Color.parseColor("#FFB300")
                      5 -> Color.parseColor("#E4E4E7")
                      6 -> Color.parseColor("#2563EB")
                      7 -> Color.parseColor("#FF2A85")
                      8 -> Color.parseColor("#00FF66")
                      9 -> Color.parseColor("#FFD700")
                      else -> Color.parseColor(accentColorHex)
                  }

                  val cx = w / 2f; val cy = h / 2f
                  val r = (minDim - pad * 2) * 0.34f
                  val corner = when (themeStyleId) {
                      0 -> minDim * 0.32f // Круглые пилюли Material 3
                      2, 5 -> minDim * 0.14f // Строгие углы
                      8 -> 6f // Терминальные острые рамки Matrix
                      else -> minDim * 0.22f
                  }

                  paint.style = Paint.Style.FILL
                  paint.color = mainColor
                  rect.set(pad, pad, w - pad, h - pad)
                  canvas.drawRoundRect(rect, corner, corner, paint)

                  // Внутренний тематический узор подложки (разный у разных тем!)
                  paint.style = Paint.Style.STROKE
                  when (themeStyleId) {
                      1, 7 -> { // Неоновое двойное кольцо
                          paint.strokeWidth = 1.5f; paint.color = Color.argb(60, Color.red(badgeColor), Color.green(badgeColor), Color.blue(badgeColor))
                          canvas.drawCircle(cx, cy, r * 1.18f, paint)
                      }
                      8 -> { // Прицельная сетка Matrix
                          paint.strokeWidth = 1.2f; paint.color = Color.parseColor("#3300FF66")
                          canvas.drawLine(pad, cy, w - pad, cy, paint)
                          canvas.drawLine(cx, pad, cx, h - pad, paint)
                      }
                      9 -> { // Золотая угловая филигрань Royal Gold
                          paint.strokeWidth = 2f; paint.color = Color.parseColor("#66FFD700")
                          rect.set(pad + 6f, pad + 6f, w - pad - 6f, h - pad - 6f)
                          canvas.drawRoundRect(rect, corner - 4f, corner - 4f, paint)
                      }
                  }

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = if (isTileFocused) 4.5f else 2f
                  paint.color = if (isTileFocused) (if (themeStyleId == 6) Color.parseColor("#1D4ED8") else Color.WHITE) else badgeColor
                  rect.set(pad, pad, w - pad, h - pad)
                  canvas.drawRoundRect(rect, corner, corner, paint)

                  val fgColor = when (themeStyleId) {
                      5 -> Color.parseColor("#F4F4F5")
                      6 -> Color.parseColor("#0F172A")
                      8 -> Color.parseColor("#00FF66")
                      9 -> Color.parseColor("#FFF8DC")
                      else -> Color.WHITE
                  }

                  paint.style = Paint.Style.FILL
                  paint.strokeCap = Paint.Cap.ROUND
                  paint.strokeJoin = Paint.Join.ROUND

                  // Уникальная детальная отрисовка КАЖДОЙ из 12 иконок (больше никаких пустых кругов и трех точек!)
                  when (iconType) {
                      "PLAYLISTS" -> {
                          for (i in -1..1) {
                              val ly = cy + i * (r * 0.52f)
                              paint.color = if (i == 0) badgeColor else fgColor
                              canvas.drawCircle(cx - r * 0.56f, ly, r * 0.13f, paint)
                              rect.set(cx - r * 0.26f, ly - r * 0.11f, cx + r * 0.68f, ly + r * 0.11f)
                              canvas.drawRoundRect(rect, 5f, 5f, paint)
                          }
                      }
                      "EDITOR" -> {
                          // Детальный карандаш + список (вместо галочки)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.18f).coerceAtLeast(3.5f)
                          paint.color = fgColor
                          canvas.drawLine(cx - r * 0.62f, cy - r * 0.42f, cx + r * 0.10f, cy - r * 0.42f, paint)
                          canvas.drawLine(cx - r * 0.62f, cy, cx - r * 0.08f, cy, paint)
                          canvas.drawLine(cx - r * 0.62f, cy + r * 0.42f, cx - r * 0.22f, cy + r * 0.42f, paint)
                          paint.color = badgeColor
                          canvas.drawLine(cx + r * 0.05f, cy + r * 0.45f, cx + r * 0.62f, cy - r * 0.35f, paint)
                      }
                      "ANALYZER" -> {
                          // Радар / Импульс сигнала
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.16f).coerceAtLeast(3.2f)
                          for (ring in 1..3) {
                              val rad = r * (0.32f * ring)
                              paint.color = if (ring == 3) badgeColor else fgColor
                              rect.set(cx - rad, cy - rad + r * 0.2f, cx + rad, cy + rad + r * 0.2f)
                              canvas.drawArc(rect, 210f, 120f, false, paint)
                          }
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          canvas.drawCircle(cx, cy + r * 0.34f, r * 0.16f, paint)
                      }
                      "THEMES" -> {
                          // Художественная палитра с цветными красками (вместо зеленого круга!)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.18f).coerceAtLeast(3.5f)
                          paint.color = fgColor
                          canvas.drawCircle(cx, cy, r * 0.78f, paint)
                          paint.style = Paint.Style.FILL
                          paint.color = badgeColor
                          canvas.drawCircle(cx - r * 0.30f, cy - r * 0.22f, r * 0.17f, paint)
                          paint.color = Color.parseColor("#FF5252")
                          canvas.drawCircle(cx + r * 0.26f, cy - r * 0.26f, r * 0.17f, paint)
                          paint.color = Color.parseColor("#FFD740")
                          canvas.drawCircle(cx + r * 0.30f, cy + r * 0.24f, r * 0.17f, paint)
                          paint.color = fgColor
                          canvas.drawCircle(cx - r * 0.25f, cy + r * 0.28f, r * 0.13f, paint)
                      }
                      "BUFFER" -> {
                          // Молния + спидометр буфера
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.14f).coerceAtLeast(3f)
                          paint.color = fgColor
                          rect.set(cx - r * 0.78f, cy - r * 0.78f, cx + r * 0.78f, cy + r * 0.78f)
                          canvas.drawArc(rect, 150f, 240f, false, paint)
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          path.reset()
                          path.moveTo(cx + r * 0.10f, cy - r * 0.56f)
                          path.lineTo(cx - r * 0.34f, cy + r * 0.04f)
                          path.lineTo(cx + r * 0.02f, cy + r * 0.04f)
                          path.lineTo(cx - r * 0.12f, cy + r * 0.56f)
                          path.lineTo(cx + r * 0.36f, cy - r * 0.06f)
                          path.lineTo(cx + r * 0.02f, cy - r * 0.06f)
                          path.close()
                          canvas.drawPath(path, paint)
                      }
                      "DECODER" -> {
                          // Процессор / Микрочип с ножками
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.15f).coerceAtLeast(3f)
                          paint.color = fgColor
                          rect.set(cx - r * 0.52f, cy - r * 0.52f, cx + r * 0.52f, cy + r * 0.52f)
                          canvas.drawRoundRect(rect, 8f, 8f, paint)
                          for (off in listOf(-0.28f, 0.28f)) {
                              canvas.drawLine(cx + off * r, cy - r * 0.82f, cx + off * r, cy - r * 0.52f, paint)
                              canvas.drawLine(cx + off * r, cy + r * 0.52f, cx + off * r, cy + r * 0.82f, paint)
                              canvas.drawLine(cx - r * 0.82f, cy + off * r, cx - r * 0.52f, cy + off * r, paint)
                              canvas.drawLine(cx + r * 0.52f, cy + off * r, cx + r * 0.82f, cy + off * r, paint)
                          }
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          rect.set(cx - r * 0.24f, cy - r * 0.24f, cx + r * 0.24f, cy + r * 0.24f)
                          canvas.drawRoundRect(rect, 4f, 4f, paint)
                      }
                      "EPG_GRID" -> {
                          // Календарь / Сетка телегида
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.15f).coerceAtLeast(3f)
                          paint.color = fgColor
                          rect.set(cx - r * 0.72f, cy - r * 0.62f, cx + r * 0.72f, cy + r * 0.68f)
                          canvas.drawRoundRect(rect, 10f, 10f, paint)
                          canvas.drawLine(cx - r * 0.72f, cy - r * 0.18f, cx + r * 0.72f, cy - r * 0.18f, paint)
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          canvas.drawCircle(cx - r * 0.32f, cy + r * 0.18f, r * 0.13f, paint)
                          canvas.drawCircle(cx, cy + r * 0.18f, r * 0.13f, paint)
                          canvas.drawCircle(cx + r * 0.32f, cy + r * 0.18f, r * 0.13f, paint)
                      }
                      "TOP_CHANNELS" -> {
                          // Настоящая Корона для ТОП каналов (вместо круга!)
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          path.reset()
                          path.moveTo(cx - r * 0.66f, cy + r * 0.48f)
                          path.lineTo(cx - r * 0.74f, cy - r * 0.36f)
                          path.lineTo(cx - r * 0.26f, cy + r * 0.06f)
                          path.lineTo(cx, cy - r * 0.56f)
                          path.lineTo(cx + r * 0.26f, cy + r * 0.06f)
                          path.lineTo(cx + r * 0.74f, cy - r * 0.36f)
                          path.lineTo(cx + r * 0.66f, cy + r * 0.48f)
                          path.close()
                          canvas.drawPath(path, paint)
                          paint.color = fgColor
                          canvas.drawCircle(cx, cy - r * 0.62f, r * 0.11f, paint)
                      }
                      "FAVORITES" -> {
                          // Настоящая 5-конечная Звезда для Избранного (вместо круга!)
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          path.reset()
                          for (i in 0 until 10) {
                              val a = Math.toRadians(-90.0 + i * 36.0)
                              val rad = if (i % 2 == 0) r * 0.78f else r * 0.34f
                              val sx = cx + (rad * cos(a)).toFloat()
                              val sy = cy + (rad * sin(a)).toFloat()
                              if (i == 0) path.moveTo(sx, sy) else path.lineTo(sx, sy)
                          }
                          path.close()
                          canvas.drawPath(path, paint)
                      }
                      "AUDIO" -> {
                          // Эквалайзер со слайдерами
                          val pos = listOf(-0.52f, 0f, 0.52f)
                          val hts = listOf(0.45f, 0.76f, 0.58f)
                          for (i in pos.indices) {
                              paint.color = if (i == 1) badgeColor else fgColor
                              rect.set(cx + pos[i] * r - 5.5f, cy - hts[i] * r, cx + pos[i] * r + 5.5f, cy + hts[i] * r)
                              canvas.drawRoundRect(rect, 5f, 5f, paint)
                          }
                      }
                      "CONTROL_MODE" -> {
                          // Пульт ТВ с крестовиной D-Pad (вместо трех точек!)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.16f).coerceAtLeast(3.2f)
                          paint.color = fgColor
                          rect.set(cx - r * 0.48f, cy - r * 0.80f, cx + r * 0.48f, cy + r * 0.80f)
                          canvas.drawRoundRect(rect, 14f, 14f, paint)
                          canvas.drawCircle(cx, cy - r * 0.22f, r * 0.24f, paint)
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          canvas.drawCircle(cx, cy - r * 0.22f, r * 0.10f, paint)
                          canvas.drawCircle(cx - r * 0.18f, cy + r * 0.38f, r * 0.09f, paint)
                          canvas.drawCircle(cx + r * 0.18f, cy + r * 0.38f, r * 0.09f, paint)
                      }
                      "SETTINGS_GEAR" -> {
                          paint.color = fgColor
                          for (deg in 0 until 360 step 45) {
                              val rad = Math.toRadians(deg.toDouble())
                              canvas.drawCircle(cx + (r * 0.70f * cos(rad)).toFloat(), cy + (r * 0.70f * sin(rad)).toFloat(), r * 0.18f, paint)
                          }
                          canvas.drawCircle(cx, cy, r * 0.64f, paint)
                          paint.color = mainColor
                          canvas.drawCircle(cx, cy, r * 0.28f, paint)
                      }
                      "SWAP_GROUPS" -> {
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.20f).coerceAtLeast(3.8f)
                          paint.color = fgColor
                          canvas.drawLine(cx - r * 0.60f, cy - r * 0.26f, cx + r * 0.60f, cy - r * 0.26f, paint)
                          canvas.drawLine(cx + r * 0.24f, cy - r * 0.54f, cx + r * 0.60f, cy - r * 0.26f, paint)
                          paint.color = badgeColor
                          canvas.drawLine(cx - r * 0.60f, cy + r * 0.26f, cx + r * 0.60f, cy + r * 0.26f, paint)
                          canvas.drawLine(cx - r * 0.24f, cy + r * 0.54f, cx - r * 0.60f, cy + r * 0.26f, paint)
                      }
                      else -> {
                          // Иконка "Экран, Ambilight, AFR и Лаборатория" — Экран ТВ с полумесяцем и искрой (вместо трех точек!)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = (r * 0.16f).coerceAtLeast(3.2f)
                          paint.color = fgColor
                          rect.set(cx - r * 0.76f, cy - r * 0.56f, cx + r * 0.76f, cy + r * 0.42f)
                          canvas.drawRoundRect(rect, 10f, 10f, paint)
                          canvas.drawLine(cx - r * 0.36f, cy + r * 0.68f, cx + r * 0.36f, cy + r * 0.68f, paint)
                          canvas.drawLine(cx, cy + r * 0.42f, cx, cy + r * 0.68f, paint)
                          paint.style = Paint.Style.FILL; paint.color = badgeColor
                          canvas.drawCircle(cx, cy - r * 0.08f, r * 0.24f, paint)
                      }
                  }
              }
          }
          ''')

