name: Build TiViLook APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tivilook-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ensure gradle.properties has AndroidX enabled
        run: |
          cat << 'PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          PROPS

      - name: Step 3.5 - Generate Clean Kotlin Modules & RecyclerView v2.6
        run: |
          python3 - << 'PYEOF'
          import os, re, glob

          with open("app/build.gradle", "r") as f:
              g = f.read()

          g = re.sub(r"targetSdk\s+\d+", "targetSdk 33", g)
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "100"))
          new_ver_code = 17000 + run_num
          g = re.sub(r"versionCode\s+\d+", f"versionCode {new_ver_code}", g)
          g = re.sub(r'versionName\s+"[^"]+"', f'versionName "2.6.{run_num}"', g)

          signing_block = '''
              signingConfigs {
                  debug {
                      storeFile file("permanent_key.jks")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  debug {
                      debuggable false
                      jniDebuggable false
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                      signingConfig signingConfigs.debug
                  }
              }
          '''
          if "permanent_key.jks" not in g:
              g = g.replace("defaultConfig {", signing_block + "\n    defaultConfig {")

          if "media3-datasource" not in g:
              g = g.replace(
                  'implementation "androidx.media3:media3-exoplayer:1.2.1"',
                  'implementation "androidx.media3:media3-common:1.2.1"\n    implementation "androidx.media3:media3-datasource:1.2.1"\n    implementation "androidx.media3:media3-extractor:1.2.1"\n    implementation "androidx.media3:media3-exoplayer:1.2.1"'
              )
          if "recyclerview" not in g:
              g = g.replace(
                  'implementation "androidx.appcompat:appcompat:1.6.1"',
                  'implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "androidx.recyclerview:recyclerview:1.3.2"'
              )
          with open("app/build.gradle", "w") as f:
              f.write(g)

          for old_ic in glob.glob("app/src/main/res/mipmap*/*ic_launcher*") + glob.glob("app/src/main/res/drawable*/*ic_launcher*"):
              try: os.remove(old_ic)
              except Exception: pass

          large_eye_icon = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#D83A18" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#EA7317" android:pathData="M0,12 C35,8 75,0 108,0 L108,108 L0,108 Z"/>
              <path android:fillColor="#F4B926" android:pathData="M0,34 C40,22 78,12 108,6 L108,108 L0,108 Z"/>
              <path android:fillColor="#48A14D" android:pathData="M0,66 C38,48 76,34 108,22 L108,108 L0,108 Z"/>
              <path android:fillColor="#1692A8" android:pathData="M0,88 C42,72 78,56 108,42 L108,108 L0,108 Z"/>
              <path android:fillColor="#284596" android:pathData="M18,108 C54,88 84,74 108,62 L108,108 Z"/>
              <path android:fillColor="#7C1D7A" android:pathData="M48,108 C72,94 92,84 108,78 L108,108 Z"/>
              <group android:pivotX="54" android:pivotY="56" android:scaleX="1.24" android:scaleY="1.28">
                  <path android:fillColor="#19130E" android:pathData="M7,56 C24,22 84,22 101,56 C84,86 24,86 7,56 Z"/>
                  <path android:fillColor="#19130E" android:pathData="M54,28 L61,16 L66,29 L76,19 L76,34 L88,27 L84,41 L95,37 L90,49 Z"/>
                  <path android:fillColor="#EFE5CF" android:pathData="M12,56 C28,29 80,29 96,56 C80,80 28,80 12,56 Z"/>
                  <path android:fillColor="#12181B" android:pathData="M54,31 A25,25 0 1,0 54,81 A25,25 0 1,0 54,31 Z"/>
                  <path android:fillColor="#00838F" android:pathData="M54,33 A23,23 0 1,0 54,79 A23,23 0 1,0 54,33 Z"/>
                  <path android:fillColor="#558B2F" android:pathData="M54,56 L34,44 A23,23 0 0,0 54,79 Z"/>
                  <path android:fillColor="#F9A825" android:pathData="M54,56 L54,79 A23,23 0 0,0 74,68 Z"/>
                  <path android:fillColor="#C62828" android:pathData="M54,56 L74,68 A23,23 0 0,0 74,44 Z"/>
                  <path android:fillColor="#283593" android:pathData="M54,56 L54,33 A23,23 0 0,0 34,44 Z"/>
                  <path android:fillColor="#070505" android:pathData="M54,43 A13,13 0 1,0 54,69 A13,13 0 1,0 54,43 Z"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M61,46 A3.8,3.8 0 1,0 61,53.6 A3.8,3.8 0 1,0 61,46 Z"/>
              </group>
          </vector>'''

          wide_tv_banner = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#D83A18" android:pathData="M0,0h320v180h-320z"/>
              <path android:fillColor="#EA7317" android:pathData="M0,25 L320,0 L320,180 L0,180 Z"/>
              <path android:fillColor="#F4B926" android:pathData="M0,60 L320,18 L320,180 L0,180 Z"/>
              <path android:fillColor="#48A14D" android:pathData="M0,105 L320,52 L320,180 L0,180 Z"/>
              <path android:fillColor="#1692A8" android:pathData="M0,145 L320,88 L320,180 L0,180 Z"/>
              <path android:fillColor="#284596" android:pathData="M0,172 L320,122 L320,180 L0,180 Z"/>
              <path android:fillColor="#7C1D7A" android:pathData="M90,180 L320,148 L320,180 Z"/>
              <path android:fillColor="#19130E" android:pathData="M34,92 C88,18 232,18 286,92 C232,162 88,162 34,92 Z"/>
              <path android:fillColor="#19130E" android:pathData="M160,36 L182,10 L194,40 L220,16 L220,50 L250,34 L238,66 L266,58 L250,84 Z"/>
              <path android:fillColor="#EFE5CF" android:pathData="M48,92 C98,34 222,34 272,92 C222,148 98,148 48,92 Z"/>
              <path android:fillColor="#12181B" android:pathData="M160,38 A54,54 0 1,0 160,146 A54,54 0 1,0 160,38 Z"/>
              <path android:fillColor="#0097A7" android:pathData="M160,42 A50,50 0 1,0 160,142 A50,50 0 1,0 160,42 Z"/>
              <path android:fillColor="#689F38" android:pathData="M160,92 L116,66 A50,50 0 0,0 160,142 Z"/>
              <path android:fillColor="#FBC02D" android:pathData="M160,92 L160,142 A50,50 0 0,0 204,117 Z"/>
              <path android:fillColor="#D32F2F" android:pathData="M160,92 L204,117 A50,50 0 0,0 204,66 Z"/>
              <path android:fillColor="#303F9F" android:pathData="M160,92 L160,42 A50,50 0 0,0 116,66 Z"/>
              <path android:fillColor="#070505" android:pathData="M160,64 A28,28 0 1,0 160,120 A28,28 0 1,0 160,64 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M174,72 A7.5,7.5 0 1,0 174,87 A7.5,7.5 0 1,0 174,72 Z"/>
          </vector>'''

          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          with open("app/src/main/res/drawable/ic_launcher_fg.xml", "w") as f: f.write(large_eye_icon)
          with open("app/src/main/res/drawable/ic_launcher.xml", "w") as f: f.write(large_eye_icon)
          with open("app/src/main/res/drawable/ic_banner.xml", "w") as f: f.write(wide_tv_banner)

          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_fg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>'''
          with open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w") as f: f.write(adaptive_xml)
          with open("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", "w") as f: f.write(adaptive_xml)

          os.makedirs("app/src/main/res/layout", exist_ok=True)
          with open("app/src/main/res/layout/player_surface_view.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <androidx.media3.ui.PlayerView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              app:use_controller="false"
              app:surface_type="surface_view" />
          ''')
          with open("app/src/main/res/layout/player_texture_view.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <androidx.media3.ui.PlayerView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              app:use_controller="false"
              app:surface_type="texture_view" />
          ''')

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:banner="@drawable/ic_banner"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="TiViLook"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>''')

          # МОДУЛЬ 1: CustomViews.kt
          with open("app/src/main/java/com/example/miboxiptv/CustomViews.kt", "w") as f:
              f.write(r'''package com.example.miboxiptv

          import android.content.Context
          import android.graphics.*
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.TextUtils
          import android.text.style.ReplacementSpan
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.TextView
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          data class Channel(val name: String, val url: String, val category: String, val tvgId: String)
          data class PlaylistEntry(val title: String, val source: String, val isLocal: Boolean)
          data class EpgProgram(val title: String, val desc: String, val startMs: Long, val stopMs: Long)

          data class AppThemeStyle(
              val id: Int, val name: String,
              val panelBgColor: Int, val cardBgColor: Int, val accentColor: Int, val strokeColor: Int,
              val textPrimaryColor: Int, val textOnAccent: Int, val cornerRadiusDp: Float,
              val normalFont: Typeface, val boldFont: Typeface,
              val isCarouselMenu: Boolean = false
          )

          class GraphicOrbSpan(private val orbType: Int) : ReplacementSpan() {
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun getSize(paint: Paint, text: CharSequence?, start: Int, end: Int, fm: Paint.FontMetricsInt?): Int = 34

              override fun draw(canvas: Canvas, text: CharSequence?, start: Int, end: Int, x: Float, top: Int, y: Int, bottom: Int, textPaint: Paint) {
                  val cy = (top + bottom) / 2f; val cx = x + 15f; val r = 10.5f
                  val mainColor = when (orbType) {
                      1 -> Color.parseColor("#00E676")
                      2 -> Color.parseColor("#FF5252")
                      else -> Color.parseColor("#FFD740")
                  }
                  paint.style = Paint.Style.FILL
                  paint.color = Color.argb(65, Color.red(mainColor), Color.green(mainColor), Color.blue(mainColor))
                  canvas.drawCircle(cx, cy, r * 1.32f, paint)
                  paint.color = mainColor; canvas.drawCircle(cx, cy, r, paint)
                  paint.color = Color.argb(130, 255, 255, 255)
                  canvas.drawCircle(cx - r * 0.3f, cy - r * 0.3f, r * 0.32f, paint)

                  paint.style = Paint.Style.STROKE; paint.strokeWidth = 2.4f; paint.strokeCap = Paint.Cap.ROUND
                  paint.color = Color.parseColor("#101418")
                  if (orbType == 1) {
                      canvas.drawLine(cx - 4.2f, cy + 0.5f, cx - 1.0f, cy + 3.8f, paint)
                      canvas.drawLine(cx - 1.0f, cy + 3.8f, cx + 4.8f, cy - 3.5f, paint)
                  } else if (orbType == 2) {
                      canvas.drawLine(cx - 3.6f, cy - 3.6f, cx + 3.6f, cy + 3.6f, paint)
                      canvas.drawLine(cx + 3.6f, cy - 3.6f, cx - 3.6f, cy + 3.6f, paint)
                  }
              }
          }

          fun colorizeStatusText(raw: String): CharSequence {
              if (!raw.contains("[")) return raw
              val ss = SpannableString(raw)
              var i = 0
              while (i <= raw.length - 3) {
                  when {
                      raw.startsWith("[+]", i) -> { ss.setSpan(GraphicOrbSpan(1), i, i + 3, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE); i += 3 }
                      raw.startsWith("[-]", i) -> { ss.setSpan(GraphicOrbSpan(2), i, i + 3, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE); i += 3 }
                      raw.startsWith("[?]", i) -> { ss.setSpan(GraphicOrbSpan(3), i, i + 3, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE); i += 3 }
                      else -> i++
                  }
              }
              return ss
          }

          class RedPowerIconButton(context: Context, onClickAction: () -> Unit) : View(context) {
              private var isBtnFocused = false
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val arcRect = RectF()

              init {
                  isFocusable = true; isFocusableInTouchMode = false; isClickable = true
                  setOnFocusChangeListener { v, hasFocus ->
                      isBtnFocused = hasFocus
                      v.animate().scaleX(if (hasFocus) 1.15f else 1.0f).scaleY(if (hasFocus) 1.15f else 1.0f).setDuration(140L).start()
                      invalidate()
                  }
                  setOnClickListener { onClickAction() }
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f; val cy = height / 2f; val r = min(cx, cy) - 4f
                  paint.style = Paint.Style.FILL
                  paint.color = if (isBtnFocused) Color.parseColor("#FF1744") else Color.parseColor("#C62828")
                  canvas.drawCircle(cx, cy, r, paint)

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = if (isBtnFocused) 3.5f else 1.8f
                  paint.color = if (isBtnFocused) Color.WHITE else Color.parseColor("#FF8A80")
                  canvas.drawCircle(cx, cy, r, paint)

                  val ir = r * 0.48f
                  paint.strokeWidth = 3.5f; paint.strokeCap = Paint.Cap.ROUND; paint.color = Color.WHITE
                  arcRect.set(cx - ir, cy - ir + 1.5f, cx + ir, cy + ir + 1.5f)
                  canvas.drawArc(arcRect, -55f, 290f, false, paint)
                  canvas.drawLine(cx, cy - ir - 2.5f, cx, cy - 1f, paint)
              }
          }

          class LiveEqualizerView(context: Context) : View(context) {
              var barColor: Int = Color.parseColor("#00E676")
                  set(value) { field = value; invalidate() }
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val rect = RectF()
              private val phases = floatArrayOf(0.0f, 1.3f, 2.7f, 4.1f)

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (visibility != VISIBLE) return
                  val w = width.toFloat(); val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  val t = System.currentTimeMillis() / 130.0
                  val barW = ((w - 10.5f) / 4f).coerceAtLeast(3f)
                  paint.color = barColor
                  for (i in 0 until 4) {
                      val wave = (sin(t + phases[i]).toFloat() + 1f) / 2f
                      val barH = (h * (0.22f + 0.75f * wave)).coerceIn(4f, h)
                      val left = i * (barW + 3.5f)
                      rect.set(left, h - barH, left + barW, h)
                      canvas.drawRoundRect(rect, 3f, 3f, paint)
                  }
                  postInvalidateDelayed(85L)
              }
          }

          class MarqueeRowTextView(context: Context) : TextView(context) {
              var forceMarqueeActive: Boolean = false
                  set(value) {
                      if (field == value) return
                      field = value; isSelected = value
                      if (value) {
                          ellipsize = TextUtils.TruncateAt.MARQUEE; marqueeRepeatLimit = -1
                          setSingleLine(true); setHorizontallyScrolling(true)
                      } else {
                          ellipsize = TextUtils.TruncateAt.END; setSingleLine(true)
                      }
                  }
              override fun isFocused(): Boolean = forceMarqueeActive || super.isFocused()
          }

          class ChannelRowView(context: Context) : FrameLayout(context) {
              val badgeView = TextView(context).apply {
                  gravity = Gravity.CENTER; setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                  setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                  layoutParams = LayoutParams(42, 42, Gravity.START or Gravity.CENTER_VERTICAL).apply { leftMargin = 14 }
              }
              val titleView = MarqueeRowTextView(context).apply {
                  layoutParams = LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT, Gravity.CENTER_VERTICAL).apply {
                      leftMargin = 68; rightMargin = 54
                  }
              }
              val eqView = LiveEqualizerView(context).apply {
                  visibility = View.GONE
                  layoutParams = LayoutParams(34, 24, Gravity.END or Gravity.CENTER_VERTICAL).apply { rightMargin = 14 }
              }
              init {
                  setPadding(4, 11, 4, 11)
                  addView(badgeView); addView(titleView); addView(eqView)
              }
          }

          class RealisticEyeSplashView(context: Context) : View(context) {
              var eyeOpenFraction: Float = 0.02f
                  set(value) { field = value.coerceIn(0.02f, 1.0f); invalidate() }
              var lookOffsetX: Float = 0f
                  set(value) { field = value.coerceIn(-1f, 1f); invalidate() }
              var pupilScale: Float = 1f
                  set(value) { field = value.coerceIn(0.75f, 1.25f); invalidate() }
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val wavePath = Path(); private val outerEyePath = Path(); private val innerEyePath = Path()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat(); val h = height.toFloat()
                  val cx = w / 2f; val cy = h / 2f
                  canvas.drawColor(Color.parseColor("#D83A18"))
                  val waveStripes = listOf(
                      Triple(0.14f, -0.05f, "#EA7317"), Triple(0.34f, 0.08f, "#F4B926"),
                      Triple(0.62f, 0.24f, "#48A14D"), Triple(0.84f, 0.44f, "#1692A8"),
                      Triple(1.04f, 0.64f, "#284596"), Triple(1.22f, 0.80f, "#7C1D7A")
                  )
                  paint.style = Paint.Style.FILL
                  for ((lY, rY, hex) in waveStripes) {
                      wavePath.reset(); wavePath.moveTo(0f, h * lY)
                      wavePath.cubicTo(w * 0.35f, h * (lY - 0.12f), w * 0.68f, h * (rY + 0.08f), w, h * rY)
                      wavePath.lineTo(w, h); wavePath.lineTo(0f, h); wavePath.close()
                      paint.color = Color.parseColor(hex); canvas.drawPath(wavePath, paint)
                  }
                  val unit = min(w, h); val rx = unit * 0.36f; val maxRy = unit * 0.21f; val ry = maxRy * eyeOpenFraction
                  outerEyePath.reset(); outerEyePath.moveTo(cx - rx * 1.06f, cy)
                  outerEyePath.cubicTo(cx - rx * 0.55f, cy - ry * 1.82f, cx + rx * 0.55f, cy - ry * 1.82f, cx + rx * 1.06f, cy)
                  outerEyePath.cubicTo(cx + rx * 0.55f, cy + ry * 1.82f, cx - rx * 0.55f, cy + ry * 1.82f, cx - rx * 1.06f, cy)
                  outerEyePath.close(); paint.color = Color.parseColor("#19130E"); canvas.drawPath(outerEyePath, paint)

                  innerEyePath.reset(); innerEyePath.moveTo(cx - rx * 0.92f, cy)
                  innerEyePath.cubicTo(cx - rx * 0.48f, cy - ry * 1.54f, cx + rx * 0.48f, cy - ry * 1.54f, cx + rx * 0.92f, cy)
                  innerEyePath.cubicTo(cx + rx * 0.48f, cy + ry * 1.54f, cx - rx * 0.48f, cy + ry * 1.54f, cx - rx * 0.92f, cy)
                  innerEyePath.close()
                  canvas.save(); canvas.clipPath(innerEyePath)
                  paint.color = Color.parseColor("#EFE5CF"); canvas.drawPath(innerEyePath, paint)
                  val eyeCenterX = cx + lookOffsetX * (rx * 0.18f); val irisRadius = maxRy * 0.96f
                  val irisColors = intArrayOf(Color.RED, Color.YELLOW, Color.GREEN, Color.CYAN, Color.BLUE, Color.MAGENTA, Color.RED)
                  paint.shader = SweepGradient(eyeCenterX, cy, irisColors, null)
                  canvas.drawCircle(eyeCenterX, cy, irisRadius, paint); paint.shader = null
                  val pupilR = irisRadius * 0.50f * pupilScale
                  paint.color = Color.BLACK; canvas.drawCircle(eyeCenterX, cy, pupilR, paint)
                  paint.color = Color.WHITE; canvas.drawCircle(eyeCenterX + pupilR * 0.5f, cy - pupilR * 0.4f, pupilR * 0.25f, paint)
                  canvas.restore()
              }
          }

          class ThemedTileView(
              context: Context, private val iconType: String,
              private val baseColorHex: String, private val accentColorHex: String
          ) : View(context) {
              var isTileFocused: Boolean = false
                  set(value) { field = value; invalidate() }
              var themeStyleId: Int = 0
                  set(value) { field = value; invalidate() }

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val path = Path()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat(); val h = height.toFloat()
                  val minDim = min(w, h)
                  val pad = if (isTileFocused) minDim * 0.04f else minDim * 0.08f

                  val mainColor = when (themeStyleId) {
                      0 -> Color.parseColor(if (isTileFocused) "#1E3A8A" else "#2B2D30")
                      1 -> Color.parseColor("#100D22")
                      2 -> Color.parseColor("#050505")
                      3 -> Color.parseColor("#242933")
                      4 -> Color.parseColor("#2D1A12")
                      5 -> Color.parseColor(if (isTileFocused) "#3F3F46" else "#18181B")
                      6 -> Color.parseColor(if (isTileFocused) "#DBEAFE" else "#F1F5F9")
                      7 -> Color.parseColor("#1E052E")
                      8 -> Color.parseColor("#021202")
                      9 -> Color.parseColor("#1A1308")
                      else -> Color.parseColor(baseColorHex)
                  }
                  val badgeColor = when (themeStyleId) {
                      0 -> Color.parseColor("#A8C7FA")
                      1 -> Color.parseColor("#00E5FF")
                      2 -> Color.parseColor("#00E676")
                      3 -> Color.parseColor("#88C0D0")
                      4 -> Color.parseColor("#FFB300")
                      5 -> Color.parseColor("#E4E4E7")
                      6 -> Color.parseColor("#2563EB")
                      7 -> Color.parseColor("#FF2A85")
                      8 -> Color.parseColor("#00FF66")
                      9 -> Color.parseColor("#FFD700")
                      else -> Color.parseColor(accentColorHex)
                  }

                  val cx = w / 2f; val cy = h / 2f
                  val r = (minDim - pad * 2) * 0.34f
                  val corner = when (themeStyleId) {
                      0 -> minDim * 0.34f
                      2, 5 -> minDim * 0.12f
                      8 -> 4f
                      else -> minDim * 0.22f
                  }

                  paint.style = Paint.Style.FILL; paint.color = mainColor
                  rect.set(pad, pad, w - pad, h - pad)
                  canvas.drawRoundRect(rect, corner, corner, paint)

                  paint.style = Paint.Style.STROKE
                  when (themeStyleId) {
                      1 -> {
                          paint.strokeWidth = 1.6f; paint.color = Color.parseColor("#4400E5FF")
                          canvas.drawLine(pad + 8f, pad + 18f, pad + 26f, pad + 18f, paint)
                          canvas.drawCircle(pad + 28f, pad + 18f, 3f, paint)
                          canvas.drawLine(w - pad - 8f, h - pad - 18f, w - pad - 26f, h - pad - 18f, paint)
                      }
                      3 -> {
                          paint.strokeWidth = 1.5f; paint.color = Color.parseColor("#4488C0D0")
                          canvas.drawLine(cx - r * 0.9f, pad + 10f, cx + r * 0.9f, pad + 10f, paint)
                      }
                      4 -> {
                          paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#28FF6F00")
                          rect.set(pad + 4f, cy + r * 0.45f, w - pad - 4f, cy + r * 0.75f)
                          canvas.drawRoundRect(rect, 4f, 4f, paint)
                      }
                      7 -> {
                          paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#38FF2A85")
                          canvas.drawCircle(cx, cy - r * 0.2f, r * 0.75f, paint)
                          paint.style = Paint.Style.STROKE; paint.strokeWidth = 1.4f; paint.color = Color.parseColor("#6600F0FF")
                          canvas.drawLine(pad + 6f, cy + r * 0.55f, w - pad - 6f, cy + r * 0.55f, paint)
                          canvas.drawLine(pad + 12f, cy + r * 0.82f, w - pad - 12f, cy + r * 0.82f, paint)
                      }
                      8 -> {
                          paint.strokeWidth = 2.2f; paint.color = Color.parseColor("#6600FF66")
                          val bOff = pad + 10f
                          canvas.drawLine(bOff, bOff, bOff + 14f, bOff, paint); canvas.drawLine(bOff, bOff, bOff, bOff + 14f, paint)
                          canvas.drawLine(w - bOff, h - bOff, w - bOff - 14f, h - bOff, paint); canvas.drawLine(w - bOff, h - bOff, w - bOff, h - bOff - 14f, paint)
                      }
                      9 -> {
                          paint.strokeWidth = 1.8f; paint.color = Color.parseColor("#77FFD700")
                          path.reset()
                          path.moveTo(cx, pad + 8f); path.lineTo(w - pad - 8f, cy); path.lineTo(cx, h - pad - 8f); path.lineTo(pad + 8f, cy); path.close()
                          canvas.drawPath(path, paint)
                      }
                  }

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = if (isTileFocused) 4.5f else 2f
                  paint.color = if (isTileFocused) (if (themeStyleId == 6) Color.parseColor("#1D4ED8") else Color.WHITE) else badgeColor
                  rect.set(pad, pad, w - pad, h - pad)
