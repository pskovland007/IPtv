              // Пункт 3: При таймауте окно анализатора плавно улетает вверх в компактную строку
              private val autoHideMenuRunnable = Runnable {
                  if (menuHistory.isNotEmpty()) {
                      val currentMenu = menuHistory.last()
                      if (currentMenu == "ANALYZER" && isAnalyzerRunning) {
                          collapseAnalyzerToTopBar()
                      } else if (currentMenu != "TOKEN" && currentMenu != "EPG" && currentMenu != "ADD_URL" && currentMenu != "MANUAL_PATH") {
                          closeAllMenus()
                      }
                  }
              }

              private fun collapseAnalyzerToTopBar() {
                  subModalOverlay.animate()
                      .translationY(-480f)
                      .scaleX(0.35f)
                      .scaleY(0.25f)
                      .alpha(0f)
                      .setDuration(420L)
                      .withEndAction {
                          subModalOverlay.translationY = 0f
                          subModalOverlay.scaleX = 1f
                          subModalOverlay.scaleY = 1f
                          subModalOverlay.alpha = 1f
                          closeAllMenus()
                          analyzerStatusBanner.visibility = View.VISIBLE
                          analyzerStatusBanner.scaleX = 0.7f
                          analyzerStatusBanner.scaleY = 0.7f
                          analyzerStatusBanner.animate().scaleX(1f).scaleY(1f).setDuration(250L).start()
                      }
                      .start()
              }

              private fun resetMenuInactivityTimer() {
                  uiHandler.removeCallbacks(autoHideMenuRunnable)
                  if (menuHistory.isNotEmpty()) {
                      uiHandler.postDelayed(autoHideMenuRunnable, 6800L)
                  }
              }

              private fun makeGlassBg(alphaHex: String = "D8", radius: Float = 22f, strokeColor: String = "#4000E5FF"): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#" + alphaHex + "0B0914"))
                      cornerRadius = radius
                      setStroke(2, Color.parseColor(strokeColor))
                  }
              }

              private fun makeModernButton(label: String, isIconOnly: Boolean = false, onClick: () -> Unit): TextView {
                  val normalBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#2A2640"))
                      cornerRadius = if (isIconOnly) 24f else 14f
                      setStroke(1, Color.parseColor("#5500E5FF"))
                  }
                  val focusBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#00E5FF"))
                      cornerRadius = if (isIconOnly) 24f else 14f
                      setStroke(2, Color.WHITE)
                  }
                  return TextView(this).apply {
                      text = label
                      gravity = Gravity.CENTER
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, if (isIconOnly) 18f else 15f)
                      typeface = condensedBoldFont
                      setTextColor(Color.WHITE)
                      background = normalBg
                      isFocusable = true
                      isFocusableInTouchMode = false
                      if (isIconOnly) {
                          setPadding(16, 10, 16, 10)
                          minWidth = 48
                          minHeight = 48
                      } else {
                          setPadding(24, 12, 24, 12)
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(8, 4, 8, 4)
                      }
                      setOnFocusChangeListener { _, hasFocus ->
                          background = if (hasFocus) focusBg else normalBg
                          setTextColor(if (hasFocus) Color.parseColor("#0B0914") else Color.WHITE)
                          if (hasFocus) resetMenuInactivityTimer()
                      }
                      setOnClickListener {
                          resetMenuInactivityTimer()
                          onClick()
                      }
                  }
              }

