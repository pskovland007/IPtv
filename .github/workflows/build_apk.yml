name: Build TiViLook APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tivilook-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Bump Version Number
        run: |
          python3 -c '
          import os, re
          with open("app/build.gradle", "r") as f: g = f.read()
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "130"))
          g = re.sub(r"versionCode\s+\d+", f"versionCode {17200 + run_num}", g)
          g = re.sub(r"versionName\s+\"[^\"]+\"", f"versionName \"2.7.{run_num}\"", g)
          with open("app/build.gradle", "w") as f: f.write(g)
          '

      - name: Lock Permanent Signing Keystore in Cache
        uses: actions/cache@v4
        with:
          path: app/permanent_key.jks
          key: mibox-iptv-immutable-signing-jks-v1

      - name: Compile TiViLook APK
        run: |
          mkdir -p ~/.android
          if [ ! -f app/permanent_key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/permanent_key.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp app/permanent_key.jks ~/.android/debug.keystore || true
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TiViLook-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiViLook-APK
          path: TiViLook-latest.apk

      - name: Publish APK to GitHub Releases for Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.${{ github.run_number }}
          name: TiViLook v2.7.${{ github.run_number }}
          files: TiViLook-latest.apk
