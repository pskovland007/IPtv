              private fun openFullScreenChannelEpg() {
                  val ch = currentChannel
                  val progs = getChannelEpgList(ch)
                  val dateFmt = SimpleDateFormat("dd.MM HH:mm", Locale.getDefault())
                  val now = System.currentTimeMillis()
                  val t = currentTheme()

                  fullEpgTitle.text = "${t.iconEpg} Программа передач: " + (ch?.name ?: "Канал не выбран")
                  val items = mutableListOf<String>()
                  var activeIndex = 0

                  if (progs.isEmpty()) {
                      val status = if (epgLoadedCount > 0) {
                          "Для канала «${ch?.name ?: ""}» расписание передач в текущей базе XMLTV отсутствует."
                      } else {
                          "База телепрограммы ещё загружается из сети... Попробуйте через несколько секунд."
                      }
                      items.add("ℹ  $status")
                  } else {
                      progs.forEachIndexed { idx, p ->
                          val isNow = now in p.startMs..p.stopMs
                          if (isNow) activeIndex = idx
                          val prefix = when {
                              isNow -> "▶ СЕЙЧАС   "
                              p.stopMs < now -> "✓ Прошло   "
                              else -> "🕒 Далее     "
                          }
                          val timeRange = dateFmt.format(Date(p.startMs)) + " — " + dateFmt.format(Date(p.stopMs))
                          val descPart = if (p.desc.isNotEmpty()) "\n      " + p.desc.take(140) else ""
                          items.add("$prefix$timeRange   •   ${p.title}$descPart")
                      }
                  }

                  fullEpgListView.adapter = createCompactAdapter(items, 15.5f)
                  fullEpgOverlay.visibility = View.VISIBLE
                  fullEpgListView.requestFocus()
                  if (activeIndex > 0 && activeIndex < items.size) {
                      fullEpgListView.setSelection(activeIndex)
                  }
                  fullEpgListView.setOnItemSelectedListener(object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          resetMenuInactivityTimer()
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  })
              }

