              private val starPath = Path()
              private val lashPath = Path()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f
                  val cy = height / 2f
                  val rx = width * 0.40f
                  val maxRy = height * 0.28f
                  val ry = maxRy * eyeOpenFraction

                  // Мягкое психоделическое свечение вокруг глаза
                  val bgColors = intArrayOf(
                      Color.parseColor("#66FF6F00"),
                      Color.parseColor("#4400E676"),
                      Color.parseColor("#00000000")
