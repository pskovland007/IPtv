              // Пункт 10: Живая анимация глаза (проявление -> открытие -> взгляд влево/вправо -> живое моргание -> эфир)
              private fun playSplashEyeAnimation() {
                  val startMs = System.currentTimeMillis()
                  val totalDuration = 3200L

                  val animRunnable = object : Runnable {
                      override fun run() {
                          val elapsed = System.currentTimeMillis() - startMs
                          if (elapsed <= 800L) {
                              // Плавное проявление
                              val p = (elapsed / 800f).coerceIn(0f, 1f)
                              splashEyeView.alpha = p
                              splashEyeView.eyeOpenFraction = 0.05f + 0.15f * p
                              uiHandler.postDelayed(this, 16L)
                          } else if (elapsed <= 1700L) {
                              // Плавное открытие века
                              splashEyeView.alpha = 1f
                              val p = ((elapsed - 800L) / 900f).coerceIn(0f, 1f)
                              val eased = 1f - (1f - p) * (1f - p)
                              splashEyeView.eyeOpenFraction = 0.20f + 0.80f * eased
                              splashEyeView.pupilScale = 1.15f - 0.15f * eased
                              uiHandler.postDelayed(this, 16L)
                          } else if (elapsed <= 2700L) {
                              // Живое движение взгляда (чуть влево -> чуть вправо -> центр)
                              val p = ((elapsed - 1700L) / 1000f).coerceIn(0f, 1f)
                              splashEyeView.lookOffsetX = (Math.sin(p * Math.PI * 2.0) * 0.45).toFloat()
                              splashEyeView.eyeOpenFraction = 1.0f
                              uiHandler.postDelayed(this, 16L)
                          } else if (elapsed <= totalDuration) {
                              // Быстрое живое моргание перед стартом
                              val p = ((elapsed - 2700L) / 500f).coerceIn(0f, 1f)
                              splashEyeView.lookOffsetX = 0f
                              val blink = abs(p - 0.4f) / 0.6f
                              splashEyeView.eyeOpenFraction = (0.12f + 0.88f * blink).coerceIn(0.12f, 1f)
                              uiHandler.postDelayed(this, 16L)
                          } else {
                              splashOverlay.animate()
                                  .alpha(0f)
                                  .setDuration(550L)
                                  .setInterpolator(DecelerateInterpolator())
                                  .withEndAction {
                                      splashOverlay.visibility = View.GONE
                                      if (controlMode == 0) {
                                          showFirstRunControlPicker(forceShow = true)
                                      }
                                  }
                                  .start()
                          }
                      }
                  }
                  uiHandler.post(animRunnable)
              }

