              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp app/permanent_key.jks ~/.android/debug.keystore || true
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TiViLook-v1.9.${GITHUB_RUN_NUMBER}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TiViLook-v1.9.${{ github.run_number }}
          path: TiViLook-v1.9.${{ github.run_number }}.apk
