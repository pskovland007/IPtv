                  canvas.drawCircle(cx, cy, rx * 1.35f, paint)
                  paint.shader = null

                  // Внешний тёмный контур века
                  eyePath.reset()
                  eyePath.moveTo(cx - rx * 1.08f, cy)
                  eyePath.quadTo(cx, cy - ry * 1.95f, cx + rx * 1.08f, cy)
                  eyePath.quadTo(cx, cy + ry * 1.95f, cx - rx * 1.08f, cy)
                  eyePath.close()
                  paint.style = Paint.Style.FILL
                  paint.color = Color.parseColor("#1A110B")
                  canvas.drawPath(eyePath, paint)

                  // Стилизованные крупные ресницы справа сверху (как на пластинке Мелодия)
                  if (eyeOpenFraction > 0.15f) {
                      lashPath.reset()
                      val topY = cy - ry * 0.9f
                      lashPath.moveTo(cx + rx * 0.05f, topY)
                      lashPath.lineTo(cx + rx * 0.25f, topY - ry * 0.95f)
                      lashPath.lineTo(cx + rx * 0.35f, topY + ry * 0.05f)
                      lashPath.lineTo(cx + rx * 0.62f, topY - ry * 0.75f)
                      lashPath.lineTo(cx + rx * 0.64f, topY + ry * 0.25f)
                      lashPath.lineTo(cx + rx * 0.94f, topY - ry * 0.35f)
                      lashPath.lineTo(cx + rx * 0.82f, topY + ry * 0.55f)
                      lashPath.lineTo(cx + rx * 1.12f, topY + ry * 0.35f)
                      lashPath.lineTo(cx + rx * 0.92f, cy)
                      lashPath.close()
                      canvas.drawPath(lashPath, paint)
                  }

                  // Внутренний разрез глаза (кремовый белок)
                  innerEyePath.reset()
                  innerEyePath.moveTo(cx - rx, cy)
                  innerEyePath.quadTo(cx, cy - ry * 1.65f, cx + rx, cy)
                  innerEyePath.quadTo(cx, cy + ry * 1.65f, cx - rx, cy)
                  innerEyePath.close()

                  canvas.save()
                  canvas.clipPath(innerEyePath)

                  paint.color = Color.parseColor("#F5EFE0")
                  canvas.drawPath(innerEyePath, paint)

                  // Радужная психоделическая оболочка (Iris)
                  val irisRadius = maxRy * 0.92f
                  val sweepColors = intArrayOf(
                      Color.parseColor("#E53935"),
                      Color.parseColor("#FB8C00"),
                      Color.parseColor("#FDD835"),
                      Color.parseColor("#43A047"),
                      Color.parseColor("#00ACC1"),
                      Color.parseColor("#3949AB"),
                      Color.parseColor("#8E24AA"),
                      Color.parseColor("#E53935")
                  )
                  paint.shader = SweepGradient(cx, cy, sweepColors, null)
                  canvas.drawCircle(cx, cy, irisRadius, paint)
                  paint.shader = null

                  // Чёрный зрачок
                  val pupilRadius = irisRadius * 0.62f
                  paint.color = Color.parseColor("#0B0706")
                  canvas.drawCircle(cx, cy, pupilRadius, paint)

                  // Пятиконечная красная звезда внутри зрачка
                  starPath.reset()
                  val outerR = pupilRadius * 0.92f
                  val innerR = outerR * 0.40f
                  for (i in 0 until 10) {
                      val angleDeg = -90.0 + i * 36.0
                      val rad = Math.toRadians(angleDeg)
                      val r = if (i % 2 == 0) outerR else innerR
                      val sx = cx + (r * Math.cos(rad)).toFloat()
                      val sy = cy + (r * Math.sin(rad)).toFloat()
                      if (i == 0) starPath.moveTo(sx, sy) else starPath.lineTo(sx, sy)
                  }
                  starPath.close()
                  paint.color = Color.parseColor("#A31515")
                  canvas.drawPath(starPath, paint)

                  // Белые блики на зрачке
                  paint.color = Color.parseColor("#F5F0E6")
                  canvas.drawCircle(cx + pupilRadius * 0.42f, cy - pupilRadius * 0.28f, pupilRadius * 0.14f, paint)
                  canvas.drawCircle(cx + pupilRadius * 0.62f, cy - pupilRadius * 0.12f, pupilRadius * 0.08f, paint)
                  canvas.drawCircle(cx - pupilRadius * 0.48f, cy + pupilRadius * 0.42f, pupilRadius * 0.11f, paint)

                  canvas.restore()
              }
