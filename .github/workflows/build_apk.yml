name: Build MiBox IPTV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Step 1 - Generate Gradle and Resources
        run: |
          python3 - << 'PYEOF'
          import os, subprocess

          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "4"))
          ver_code = 200 + run_num
          ver_name = f"0.4.{run_num}"

          os.makedirs("app/src/main/java/com/example/miboxiptv", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)

          with open("settings.gradle", "w") as f:
              f.write('''pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MiBoxIPTV"
          include ":app"
          ''')

          with open("build.gradle", "w") as f:
              f.write('''plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          ''')

          with open("gradle.properties", "w") as f:
              f.write("android.useAndroidX=true\n")

          with open("app/build.gradle", "w") as f:
              f.write(f'''plugins {{
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }}
          android {{
              namespace "com.example.miboxiptv"
              compileSdk 34
              defaultConfig {{
                  applicationId "com.example.miboxiptv"
                  minSdk 23
                  targetSdk 34
                  versionCode {ver_code}
                  versionName "{ver_name}"
              }}
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
              kotlinOptions {{ jvmTarget = "17" }}
          }}
                    dependencies {{
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.media3:media3-common:1.2.1"
              implementation "androidx.media3:media3-datasource:1.2.1"
              implementation "androidx.media3:media3-exoplayer:1.2.1"
              implementation "androidx.media3:media3-exoplayer-hls:1.2.1"
              implementation "androidx.media3:media3-ui:1.2.1"
          }}
          ''')

          with open("app/src/main/res/drawable/ic_launcher.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#141026" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00E5FF" android:pathData="M18,26h72c3.3,0 6,2.7 6,6v42c0,3.3 -2.7,6 -6,6H18c-3.3,0 -6,-2.7 -6,-6V32c0,-3.3 2.7,-6 6,-6z"/>
              <path android:fillColor="#1E1836" android:pathData="M22,30h64v38H22z"/>
              <path android:fillColor="#FF2A85" android:pathData="M45,39l22,10l-22,10z"/>
              <path android:fillColor="#00E5FF" android:pathData="M36,84h36v4H36z"/>
          </vector>''')

          with open("app/src/main/res/drawable/ic_banner.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#141026" android:pathData="M0,0h320v180h-320z"/>
              <path android:fillColor="#1F193D" android:pathData="M0,130h320v50h-320z"/>
              <path android:fillColor="#00E5FF" android:pathData="M96,32h128c5.5,0 10,4.5 10,10v76c0,5.5 -4.5,10 -10,10H96c-5.5,0 -10,-4.5 -10,-10V42c0,-5.5 4.5,-10 10,-10z"/>
              <path android:fillColor="#141026" android:pathData="M102,38h116v68H102z"/>
              <path android:fillColor="#FF2A85" android:pathData="M146,54l36,18l-36,18z"/>
              <path android:fillColor="#00E5FF" android:pathData="M126,136h68v6H126z"/>
          </vector>''')

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:banner="@drawable/ic_banner"
                  android:icon="@drawable/ic_launcher"
                  android:label="MiBox IPTV"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>''')
          PYEOF

