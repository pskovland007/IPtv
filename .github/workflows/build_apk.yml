                          val url = urlInput.text.toString().trim()
                          if (url.isNotEmpty()) {
                              playlists.add(PlaylistEntry(title, url, false))
                              activePlaylistIndex = playlists.size - 1
                              saveState()
                              loadActivePlaylist()
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun showLocalFileOptions() {
                  val options = arrayOf(
                      "Выбрать из папки Download / внутренней памяти",
                      "Открыть системный файловый менеджер Android",
                      "Ввести путь к файлу вручную (/sdcard/...)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Добавление файла .m3u / .m3u8")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> scanLocalM3uFiles()
                              1 -> {
                                  try {
                                      val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                          type = "*/*"
                                          addCategory(Intent.CATEGORY_OPENABLE)
                                      }
                                      startActivityForResult(Intent.createChooser(intent, "Выберите .m3u / .m3u8"), FILE_PICK_CODE)
                                  } catch (e: Exception) {
                                      scanLocalM3uFiles()
                                  }
                              }
                              2 -> showManualFilePathDialog()
                          }
                      }
                      .show()
              }

              private fun scanLocalM3uFiles() {
                  val foundFiles = mutableListOf<File>()
                  val roots = listOf(
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                      Environment.getExternalStorageDirectory(),
                      File("/storage")
                  )
                  for (r in roots) {
                      try {
                          r.walkTopDown().maxDepth(3).forEach { file ->
                              if (file.isFile && (file.name.endsWith(".m3u", true) || file.name.endsWith(".m3u8", true))) {
                                  if (!foundFiles.any { it.absolutePath == file.absolutePath }) {
                                      foundFiles.add(file)
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }

                  if (foundFiles.isEmpty()) {
                      Toast.makeText(this, "Файлы .m3u/.m3u8 в памяти не найдены", Toast.LENGTH_LONG).show()
                      showManualFilePathDialog()
                      return
                  }

                  val names = foundFiles.map { it.name + " (" + it.parent + ")" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Найденные файлы .m3u / .m3u8")
                      .setItems(names) { _, idx ->
                          val file = foundFiles[idx]
                          playlists.add(PlaylistEntry(file.name, file.absolutePath, true))
                          activePlaylistIndex = playlists.size - 1
                          saveState()
                          loadActivePlaylist()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun showManualFilePathDialog() {
                  val input = EditText(this).apply {
                      setText("/sdcard/Download/playlist.m3u8")
                      setSingleLine()
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Путь к локальному файлу .m3u8")
                      .setView(input)
                      .setPositiveButton("Добавить") { _, _ ->
                          val path = input.text.toString().trim()
                          if (path.isNotEmpty()) {
                              val name = path.substringAfterLast("/")
                              playlists.add(PlaylistEntry(name, path, true))
                              activePlaylistIndex = playlists.size - 1
                              saveState()
                              loadActivePlaylist()
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == FILE_PICK_CODE && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      val name = uri.lastPathSegment?.substringAfterLast("/") ?: "Локальный .m3u8"
                      playlists.add(PlaylistEntry(name, uri.toString(), true))
                      activePlaylistIndex = playlists.size - 1
                      saveState()
                      loadActivePlaylist()
                  }
              }

              private fun showBufferDialog() {
                  val levels = arrayOf(
                      "Маленький (3–8 сек) — быстрое переключение",
                      "Средний (12–28 сек) — оптимально для 1080p",
                      "Большой (28–60 сек) — максимальная стабильность"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Буфер подкачки видео")
                      .setSingleChoiceItems(levels, bufferLevel) { dialog, which ->
                          bufferLevel = which
                          saveState()
                          updateTopLabel()
                          initPlayer()
                          Toast.makeText(this, "Буфер изменён: " + bufferName(), Toast.LENGTH_SHORT).show()
                          dialog.dismiss()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun saveState() {
                  val prefs = getSharedPreferences("iptv_v4_prefs", Context.MODE_PRIVATE)
                  val arr = JSONArray()
                  for (p in playlists) {
                      val obj = JSONObject()
                      obj.put("title", p.title)
                      obj.put("source", p.source)
                      obj.put("isLocal", p.isLocal)
                      arr.put(obj)
                  }
                  prefs.edit()
                      .putString("playlists_json", arr.toString())
                      .putInt("active_playlist", activePlaylistIndex)
                      .putInt("buffer_level", bufferLevel)
                      .putInt("decoder_mode", decoderMode)
                      .putString("vip_token", vipToken)
                      .putString("epg_url", epgUrl)
                      .putStringSet("favorites", favoriteUrls.toSet())
                      .apply()
              }

              private fun loadSavedState() {
                  val prefs = getSharedPreferences("iptv_v4_prefs", Context.MODE_PRIVATE)
                  bufferLevel = prefs.getInt("buffer_level", 1)
                  decoderMode = prefs.getInt("decoder_mode", 1)
                  activePlaylistIndex = prefs.getInt("active_playlist", 0)
                  vipToken = prefs.getString("vip_token", BuiltinCatalog.defaultToken) ?: BuiltinCatalog.defaultToken
                  epgUrl = prefs.getString("epg_url", epgUrl) ?: epgUrl
                  val favs = prefs.getStringSet("favorites", emptySet()) ?: emptySet()
                  favoriteUrls.clear()
                  favoriteUrls.addAll(favs)

                  playlists.clear()
                  val jsonStr = prefs.getString("playlists_json", null)
                  if (!jsonStr.isNullOrEmpty()) {
                      try {
                          val arr = JSONArray(jsonStr)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              playlists.add(
                                  PlaylistEntry(
                                      o.getString("title"),
                                      o.getString("source"),
                                      o.getBoolean("isLocal")
                                  )
                              )
                          }
                      } catch (_: Exception) {}
                  }
                  ensureDefaultPlaylists()
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (sidePanel.visibility == View.GONE) {
                      when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_LEFT -> {
                              showSidePanel()
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_RIGHT -> {
                              toggleInfoPanel()
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_DOWN -> {
                              showSettingsMenu()
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                              showCenterActionMenu()
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_UP -> {
                              if (displayedChannels.isNotEmpty()) {
                                  val idx = displayedChannels.indexOfFirst { it.url == currentChannel?.url }
                                  val next = (idx + 1) % displayedChannels.size
                                  playChannelObj(displayedChannels[next])
                              }
                              return true
                          }
                          KeyEvent.KEYCODE_BACK -> {
                              if (infoPanel.visibility == View.VISIBLE) {
                                  infoPanel.visibility = View.GONE
                                  return true
                              }
                          }
                      }
                  } else {
                      if (keyCode == KeyEvent.KEYCODE_BACK) {
                          hideSidePanel()
                          return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  uiHandler.removeCallbacksAndMessages(null)
                  player?.release()
              }
          }
          ''')
