              private fun openAnalyzerModal() {
                  val total = allChannels.size
                  val alive = synchronized(channelHealthMap) { channelHealthMap.values.count { it } }
                  val dead = synchronized(channelHealthMap) { channelHealthMap.values.count { !it } }

                  subModalTitle.text = "📡 Тест каналов (Всего: $total  •  🟢 Рабочих: $alive  •  🔴 Нерабочих: $dead)"
                  subModalInputContainer.visibility = View.GONE
                  subModalList.visibility = View.VISIBLE
                  subModalTopButtons.visibility = View.VISIBLE
                  subModalTopButtons.removeAllViews()

                  val startStopBtn = makeModernButton(if (isAnalyzerRunning) "⏹ Стоп" else "▶ Запустить тест") {
                      if (isAnalyzerRunning) {
                          isAnalyzerRunning = false
                          analyzerStatusBanner.visibility = View.GONE
                          openAnalyzerModal()
                      } else {
                          startBackgroundChannelAnalyzer()
                          openAnalyzerModal()
                      }
                  }
                  subModalTopButtons.addView(startStopBtn)

                  if (isAnalyzerRunning) {
                      subModalTopButtons.addView(makeModernButton("⬆ Свернуть вверх") {
                          collapseAnalyzerToTopBar()
                      })
                  }

                  if (dead > 0) {
                      subModalTopButtons.addView(makeModernButton("🚫 Отключить нерабочие ($dead)") {
                          synchronized(channelHealthMap) {
                              for ((u, ok) in channelHealthMap) {
                                  if (!ok) disabledUrls.add(u)
                              }
                          }
                          saveState()
                          updateCategoriesList()
                          selectCategory(currentCategoryIndex)
                          Toast.makeText(this, "Отключено нерабочих каналов: $dead", Toast.LENGTH_SHORT).show()
                          openAnalyzerModal()
                      })
                  }

                  val labels = allChannels.map { ch ->
                      val status = synchronized(channelHealthMap) {
                          when (channelHealthMap[ch.url]) {
                              true -> "🟢 Работает"
                              false -> "🔴 Не отвечает"
                              null -> "⏳ Ожидание"
                          }
                      }
                      val enabled = !disabledUrls.contains(ch.url) && !disabledCategories.contains(ch.category)
                      val box = if (enabled) "☑" else "☐"
                      "$box  $status  —  ${ch.name} [${ch.category}]"
                  }.toMutableList()

                  val firstPos = subModalList.firstVisiblePosition
                  subModalList.adapter = createCompactAdapter(labels, 14f)
                  subModalList.setSelection(firstPos)
                  subModalList.setOnItemClickListener { _, _, idx, _ ->
                      resetMenuInactivityTimer()
                      val ch = allChannels[idx]
                      if (disabledUrls.contains(ch.url)) {
                          disabledUrls.remove(ch.url)
                      } else {
                          disabledUrls.add(ch.url)
                      }
                      saveState()
                      updateCategoriesList()
                      selectCategory(currentCategoryIndex)
                      openAnalyzerModal()
                  }
                  subModalOverlay.visibility = View.VISIBLE
                  subModalList.requestFocus()
              }

              private fun startBackgroundChannelAnalyzer() {
                  if (isAnalyzerRunning || allChannels.isEmpty()) return
                  isAnalyzerRunning = true
                  synchronized(channelHealthMap) { channelHealthMap.clear() }
                  val snapshot = allChannels.toList()
                  val total = snapshot.size
                  val counter = AtomicInteger(0)

                  analyzerStatusBanner.text = "📡 Тест каналов: 0 / $total"
                  analyzerStatusBanner.visibility = View.VISIBLE

                  thread {
                      val pool = Executors.newFixedThreadPool(8)
                      for (ch in snapshot) {
                          pool.submit {
                              if (!isAnalyzerRunning) return@submit
                              val ok = checkStreamAlive(ch.url)
                              synchronized(channelHealthMap) {
                                  channelHealthMap[ch.url] = ok
                              }
                              val done = counter.incrementAndGet()
                              if (done % 4 == 0 || done == total) {
                                  runOnUiThread {
                                      val aliveCount = synchronized(channelHealthMap) { channelHealthMap.values.count { it } }
                                      val deadCount = synchronized(channelHealthMap) { channelHealthMap.values.count { !it } }
                                      if (isAnalyzerRunning) {
                                          analyzerStatusBanner.text = "📡 Тест каналов: $done / $total   •   🟢 $aliveCount   🔴 $deadCount"
                                          if (menuHistory.lastOrNull() == "ANALYZER") {
                                              openAnalyzerModal()
                                          }
                                      }
                                      if (done == total) {
                                          isAnalyzerRunning = false
                                          analyzerStatusBanner.text = "✅ Тест завершён: 🟢 $aliveCount рабочих  |  🔴 $deadCount нерабочих"
                                          uiHandler.postDelayed({ analyzerStatusBanner.visibility = View.GONE }, 4000L)
                                          // Пункт 3: По завершении теста автоматически разворачиваем окно с результатами!
                                          navigateToMenu("ANALYZER")
                                          subModalOverlay.translationY = -360f
                                          subModalOverlay.scaleX = 0.6f
                                          subModalOverlay.scaleY = 0.6f
                                          subModalOverlay.animate()
                                              .translationY(0f)
                                              .scaleX(1f)
                                              .scaleY(1f)
                                              .setDuration(400L)
                                              .setInterpolator(DecelerateInterpolator())
                                              .start()
                                      }
                                  }
                              }
                          }
                      }
                      pool.shutdown()
                  }
              }

              private fun checkStreamAlive(urlStr: String): Boolean {
                  return try {
                      val conn = URL(urlStr).openConnection() as HttpURLConnection
                      conn.setRequestProperty("User-Agent", "VLC/3.0.20 LibVLC/3.0.20")
                      conn.instanceFollowRedirects = true
                      conn.connectTimeout = 4000
                      conn.readTimeout = 4000
                      val code = conn.responseCode
                      val head = if (code in 200..299) {
                          conn.inputStream.bufferedReader().readLine() ?: ""
                      } else ""
                      conn.disconnect()
                      code in 200..299 && head.isNotEmpty()
                  } catch (_: Exception) {
                      false
                  }
              }

