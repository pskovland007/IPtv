              // Пункт 5: Бережный фоновый анализ (всего 3 потока с низким приоритетом и паузой 60 мс, чтобы приложение вообще не тупило!)
              // Автоматическое сворачивание окна через 4.5 секунды после запуска + автовозврат оживших каналов!
              private fun startBackgroundChannelAnalyzer(rawTargetChannels: List<Channel>) {
                  // Исключённые пользователем каналы (manualDisabledUrls) НЕ проверяются!
                  val targetChannels = rawTargetChannels.filter { !manualDisabledUrls.contains(it.url) }
                  if (isAnalyzerRunning || targetChannels.isEmpty()) return
                  isAnalyzerRunning = true
                  targetChannels.forEach { channelHealthMap.remove(it.url) }
                  val snapshot = targetChannels.toList()
                  val total = snapshot.size
                  val counter = AtomicInteger(0)
                  val autoRestoredCounter = AtomicInteger(0)

                  analyzerStatusBanner.text = "${currentTheme().iconAnalyzer} Тест: 0 / $total"
                  analyzerStatusBanner.visibility = View.VISIBLE

                  // Запускаем таймер автосворачивания окна анализатора через 4.5 секунды
                  resetMenuInactivityTimer()

                  thread(priority = Thread.MIN_PRIORITY) {
                      val pool = Executors.newFixedThreadPool(3)
                      var lastUiUpdateMs = 0L

                      for (ch in snapshot) {
                          pool.submit {
                              if (!isAnalyzerRunning) return@submit
                              try { Thread.sleep(60) } catch (_: Exception) {}
                              val ok = checkStreamAliveWithHardTimeout(ch.url)
                              channelHealthMap[ch.url] = ok

                              // Если канал ранее был автоматически скрыт как нерабочий, но теперь заработал — автоматически возвращаем его в список!
                              if (ok && autoDisabledUrls.remove(ch.url)) {
                                  autoRestoredCounter.incrementAndGet()
                              }

                              val done = counter.incrementAndGet()
                              val now = System.currentTimeMillis()
                              if (now - lastUiUpdateMs >= 1200L || done >= total) {
                                  lastUiUpdateMs = now
                                  runOnUiThread {
                                      val aliveCount = snapshot.count { channelHealthMap[it.url] == true }
                                      val deadCount = snapshot.count { channelHealthMap[it.url] == false }
                                      if (isAnalyzerRunning && done < total) {
                                          analyzerStatusBanner.text = "${currentTheme().iconAnalyzer} Тест: $done / $total   •   🟢 $aliveCount   🔴 $deadCount"
                                          val curMenu = menuHistory.lastOrNull()
                                          if (curMenu == "ANALYZER_GROUP_VIEW") {
                                              openAnalyzerGroupChannelsModal(selectedAnalyzerCategory, firstOpen = false)
                                          } else if (curMenu == "ANALYZER_GROUPS") {
                                              openAnalyzerGroupsModal(firstOpen = false)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      pool.shutdown()
                      try {
                          pool.awaitTermination(20, TimeUnit.MINUTES)
                      } catch (_: Exception) {}
                      pool.shutdownNow()

                      if (isAnalyzerRunning) {
                          isAnalyzerRunning = false
                          runOnUiThread {
                              val aliveCount = snapshot.count { channelHealthMap[it.url] == true }
                              val deadCount = snapshot.count { channelHealthMap[it.url] == false }
                              val restored = autoRestoredCounter.get()
                              if (restored > 0) {
                                  saveState()
                                  updateCategoriesList()
                                  selectCategory(currentCategoryIndex)
                              }
                              val restoredNote = if (restored > 0) "  |  ♻ Восстановлено: $restored" else ""
                              analyzerStatusBanner.text = "✅ Тест завершён: 🟢 $aliveCount  |  🔴 $deadCount$restoredNote"
                              uiHandler.postDelayed({ analyzerStatusBanner.visibility = View.GONE }, 5500L)
                              if (menuHistory.lastOrNull() == "ANALYZER_GROUP_VIEW") {
                                  openAnalyzerGroupChannelsModal(selectedAnalyzerCategory, firstOpen = true)
                              } else {
                                  navigateToMenu("ANALYZER_GROUP_VIEW")
                              }
                          }
                      }
                  }
              }

              private fun checkStreamAliveWithHardTimeout(urlStr: String): Boolean {
                  var conn: HttpURLConnection? = null
                  return try {
                      conn = URL(urlStr).openConnection() as HttpURLConnection
                      conn.setRequestProperty("User-Agent", russianSmartTvAgents[userAgentIndex % russianSmartTvAgents.size])
                      conn.setRequestProperty("Accept", "*/*")
                      conn.instanceFollowRedirects = true
                      conn.connectTimeout = 2800
                      conn.readTimeout = 2800

                      val targetConn = conn
                      val killer = Thread {
                          try {
                              Thread.sleep(3100)
                              targetConn.disconnect()
                          } catch (_: Exception) {}
                      }
                      killer.isDaemon = true
                      killer.start()

                      val code = conn.responseCode
                      val buf = ByteArray(48)
                      val readBytes = if (code in 200..299) {
                          conn.inputStream.read(buf)
                      } else -1
                      conn.disconnect()
                      killer.interrupt()
                      code in 200..299 && readBytes > 0
                  } catch (_: Exception) {
                      try { conn?.disconnect() } catch (_: Exception) {}
                      false
                  }
              }

