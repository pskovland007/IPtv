              // Анимация проявления и плавного раскрытия глаза при старте (Пункт 4)
              private fun playSplashEyeAnimation() {
                  val startMs = System.currentTimeMillis()
                  val fadeDuration = 1200L
                  val openDuration = 1800L
                  val totalDuration = fadeDuration + openDuration

                  val animRunnable = object : Runnable {
                      override fun run() {
                          val elapsed = System.currentTimeMillis() - startMs
                          if (elapsed <= fadeDuration) {
                              // Фаза 1: медленное проявление из темноты с полуприкрытым веком
                              val p = (elapsed.toFloat() / fadeDuration).coerceIn(0f, 1f)
                              splashEyeView.alpha = p
                              splashEyeView.eyeOpenFraction = 0.05f + 0.12f * p
                              uiHandler.postDelayed(this, 16L)
                          } else if (elapsed <= totalDuration) {
                              // Фаза 2: плавное раскрытие века глаза до полного размера
                              splashEyeView.alpha = 1f
                              val p = ((elapsed - fadeDuration).toFloat() / openDuration).coerceIn(0f, 1f)
                              val eased = 1f - (1f - p) * (1f - p)
                              splashEyeView.eyeOpenFraction = 0.17f + 0.83f * eased
                              uiHandler.postDelayed(this, 16L)
                          } else {
                              // Фаза 3: мягкое растворение заставки и переход к телеканалу
                              splashOverlay.animate()
                                  .alpha(0f)
                                  .setDuration(650L)
                                  .setInterpolator(DecelerateInterpolator())
                                  .withEndAction { splashOverlay.visibility = View.GONE }
                                  .start()
                          }
                      }
                  }
                  uiHandler.post(animRunnable)
              }

              private fun requestStoragePermissionsIfNeeded() {
