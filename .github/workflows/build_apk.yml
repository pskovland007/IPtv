              // Пункт 1: Мягкий мониторинг состояния без ложных срабатываний на 10-й секунде
              private fun startClockAndWatchdogUpdater() {
                  val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
                  val ticker = object : Runnable {
                      override fun run() {
                          clockTextView.text = timeFmt.format(Date())
                          updateSignalIndicator()

                          val p = player
                          if (p != null && currentChannel != null) {
                              if (p.playbackState == Player.STATE_BUFFERING) {
                                  bufferingStuckSeconds += 2
                                  if (bufferingStuckSeconds >= 18) {
                                      bufferingStuckSeconds = 0
                                      reconnectCurrentStream()
                                  }
                              } else {
                                  bufferingStuckSeconds = 0
                              }
                          }

                          if (infoPanel.visibility == View.VISIBLE) updateStreamInfoText()
                          if (centerOsdPanel.visibility == View.VISIBLE) updateCenterOsdContent()
                          uiHandler.postDelayed(this, 2000)
                      }
                  }
                  uiHandler.post(ticker)
              }

              private fun reconnectCurrentStream() {
                  val ch = currentChannel ?: return
                  val p = player ?: return
                  p.setMediaItem(createLiveMediaItem(ch.url))
                  p.prepare()
                  p.play()
              }

              // Пункт 1: Убрано принудительное изменение скорости (0.98..1.02), вызывавшее рывок на 10-й секунде
              private fun createLiveMediaItem(url: String): MediaItem {
                  return MediaItem.Builder()
                      .setUri(url)
                      .setLiveConfiguration(
                          MediaItem.LiveConfiguration.Builder()
                              .setTargetOffsetMs(10000)
                              .setMinOffsetMs(5000)
                              .setMaxOffsetMs(35000)
                              .setMinPlaybackSpeed(1.0f)
                              .setMaxPlaybackSpeed(1.0f)
                              .build()
                      )
                      .build()
              }

              private fun updateSignalIndicator() {
                  val p = player
                  val state = p?.playbackState ?: Player.STATE_IDLE
                  val bufSec = ((p?.totalBufferedDuration ?: 0L) / 1000L).toInt()

                  val (activeBars, activeColor) = when {
                      state == Player.STATE_IDLE -> Pair(1, Color.parseColor("#FF5252"))
                      state == Player.STATE_BUFFERING -> Pair(2, Color.parseColor("#FFD740"))
                      state == Player.STATE_READY && bufSec >= 5 -> Pair(4, Color.parseColor("#00E676"))
                      state == Player.STATE_READY && bufSec >= 2 -> Pair(3, Color.parseColor("#69F0AE"))
                      state == Player.STATE_READY -> Pair(2, Color.parseColor("#FFD740"))
                      else -> Pair(1, Color.parseColor("#FF5252"))
                  }

                  val inactiveColor = Color.parseColor("#35FFFFFF")
                  for (i in signalBars.indices) {
                      val bg = signalBars[i].background as? GradientDrawable ?: GradientDrawable()
                      bg.cornerRadius = 3f
                      bg.setColor(if (i < activeBars) activeColor else inactiveColor)
                      signalBars[i].background = bg
                  }
              }

              // Пункт 1: Добавлен 4-й уровень буфера "Экстремальный" (до 120 сек / 64 МБ) + устойчивость к сбоям сегментов
              private fun initPlayer() {
                  val currentUrl = currentChannel?.url
                  player?.release()

                  val (minBuf, maxBuf, startBuf, rebuf) = when (bufferLevel) {
                      0 -> listOf(12000, 30000, 1200, 2500)
                      1 -> listOf(25000, 55000, 1500, 3000)
                      2 -> listOf(45000, 90000, 1800, 3500)
                      else -> listOf(65000, 130000, 2200, 4500) // 3 = Экстремальный буфер
                  }

                  val targetBytes = if (bufferLevel >= 3) 64 * 1024 * 1024 else 42 * 1024 * 1024

                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(minBuf, maxBuf, startBuf, rebuf)
                      .setTargetBufferBytes(targetBytes)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .setBackBuffer(15000, true)
                      .build()

                  val extensionMode = when (decoderMode) {
                      0 -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_OFF
                      2 -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER
                      else -> DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON
                  }

                  val renderersFactory = DefaultRenderersFactory(this)
                      .setExtensionRendererMode(extensionMode)
                      .setEnableDecoderFallback(true)

                  val httpDataSourceFactory = DefaultHttpDataSource.Factory()
                      .setUserAgent("VLC/3.0.20 LibVLC/3.0.20")
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(25000)
                      .setDefaultRequestProperties(mapOf("Connection" to "keep-alive"))

                  val errorPolicy = DefaultLoadErrorHandlingPolicy(6)

                  val mediaSourceFactory = DefaultMediaSourceFactory(this)
                      .setDataSourceFactory(httpDataSourceFactory)
                      .setLoadErrorHandlingPolicy(errorPolicy)

                  val audioAttrs = AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                      .build()

                  val newPlayer = ExoPlayer.Builder(this, renderersFactory)
                      .setMediaSourceFactory(mediaSourceFactory)
                      .setLoadControl(loadControl)
                      .setAudioAttributes(audioAttrs, true)
                      .build()

                  newPlayer.trackSelectionParameters = newPlayer.trackSelectionParameters
                      .buildUpon()
                      .setMaxVideoSize(1920, 1080)
                      .setPreferredAudioLanguages("ru", "rus", "en", "eng", "und")
                      .build()

                  newPlayer.videoScalingMode = C.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING
                  playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL

                  newPlayer.addListener(object : Player.Listener {
                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_ENDED) {
                              reconnectCurrentStream()
                          }
                      }
                      override fun onPlayerError(error: PlaybackException) {
                          uiHandler.postDelayed({ reconnectCurrentStream() }, 1200)
                      }
                  })

                  playerView.player = newPlayer
                  player = newPlayer

                  if (currentUrl != null) {
                      newPlayer.setMediaItem(createLiveMediaItem(currentUrl))
                      newPlayer.prepare()
                      newPlayer.play()
                  }
              }

              // Пункт 6: Фоновая предбуферизация соседних каналов (сверху и снизу от текущего в списке)
              private fun preloadNeighboringChannels(activeChannel: Channel) {
                  if (displayedChannels.size < 2) return
                  val idx = displayedChannels.indexOfFirst { it.url == activeChannel.url }
                  if (idx == -1) return

                  val prevIdx = if (idx <= 0) displayedChannels.size - 1 else idx - 1
                  val nextIdx = if (idx + 1 >= displayedChannels.size) 0 else idx + 1

                  val neighbors = listOf(displayedChannels[prevIdx], displayedChannels[nextIdx])
                  synchronized(preloadedLock) {
                      preloadedNeighbors.clear()
                  }

                  for (neighbor in neighbors) {
                      preloaderExecutor.submit {
                          try {
                              val m3u8Url = neighbor.url
                              val conn = URL(m3u8Url).openConnection() as HttpURLConnection
                              conn.setRequestProperty("User-Agent", "VLC/3.0.20 LibVLC/3.0.20")
                              conn.setRequestProperty("Connection", "keep-alive")
                              conn.instanceFollowRedirects = true
                              conn.connectTimeout = 4000
                              conn.readTimeout = 4000

                              if (conn.responseCode in 200..299) {
                                  val finalBaseUrl = conn.url.toString().substringBeforeLast("/") + "/"
                                  val lines = conn.inputStream.bufferedReader().readLines()
                                  conn.disconnect()

                                  // Находим вложенный плейлист или первый видеосегмент (.ts / .m4s) и прогреваем соединение
                                  val firstRef = lines.map { it.trim() }
                                      .firstOrNull { it.isNotEmpty() && !it.startsWith("#") }

                                  if (firstRef != null) {
                                      val targetUrl = if (firstRef.startsWith("http")) firstRef else (finalBaseUrl + firstRef)
                                      val segConn = URL(targetUrl).openConnection() as HttpURLConnection
                                      segConn.setRequestProperty("User-Agent", "VLC/3.0.20 LibVLC/3.0.20")
                                      segConn.setRequestProperty("Connection", "keep-alive")
                                      segConn.connectTimeout = 4000
                                      segConn.readTimeout = 4000
                                      val buf = ByteArray(64 * 1024)
                                      segConn.inputStream.read(buf)
                                      segConn.disconnect()
                                  }

                                  synchronized(preloadedLock) {
                                      preloadedNeighbors.add(neighbor.url)
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun normalizeName(raw: String): String {
                  val clean = raw.lowercase()
                      .replace("1080p", "")
                      .replace("720p", "")
                      .replace("fhd", "")
                      .replace("uhd", "")
                      .replace("4k", "")
                      .replace("hd", "")
                      .replace("50", "")
                      .replace("orig", "")
                  val sb = StringBuilder()
                  var inBrackets = false
                  for (c in clean) {
                      if (c == '(' || c == '[') inBrackets = true
                      else if (c == ')' || c == ']') inBrackets = false
                      else if (!inBrackets && (c in 'a'..'z' || c in 'а'..'я' || c in '0'..'9')) {
                          sb.append(c)
                      }
                  }
                  return sb.toString()
              }

              private fun getChannelEpgList(ch: Channel?): List<EpgProgram> {
                  if (ch == null) return emptyList()
                  if (ch.tvgId.isNotEmpty()) {
                      val byId = epgById[ch.tvgId]
                      if (!byId.isNullOrEmpty()) return byId
                  }
                  val norm = normalizeName(ch.name)
                  if (norm.isNotEmpty()) {
                      val exact = epgByName[norm]
                      if (!exact.isNullOrEmpty()) return exact
                      for ((k, v) in epgByName) {
                          if (k.length >= 4 && (norm.startsWith(k) || k.startsWith(norm))) {
                              return v
                          }
                      }
                  }
                  return emptyList()
              }

              private fun getCurrentAndNextEpg(ch: Channel?): Pair<EpgProgram?, EpgProgram?> {
                  val list = getChannelEpgList(ch)
                  if (list.isEmpty()) return Pair(null, null)
                  val now = System.currentTimeMillis()
                  val idx = list.indexOfFirst { now in it.startMs..it.stopMs }
                  if (idx == -1) return Pair(null, null)
                  val curr = list[idx]
                  val next = if (idx + 1 < list.size) list[idx + 1] else null
                  return Pair(curr, next)
              }

              private fun loadEpgInBackground() {
                  thread {
                      val candidates = (listOf(epgUrl) + epgUrls).distinct()
                      for (candidateUrl in candidates) {
                          try {
                              val conn = URL(candidateUrl).openConnection() as HttpURLConnection
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                              conn.connectTimeout = 15000
                              conn.readTimeout = 25000
                              val rawStream: InputStream = conn.inputStream
                              val stream: InputStream = if (candidateUrl.endsWith(".gz", true)) {
                                  GZIPInputStream(rawStream)
                              } else {
                                  rawStream
                              }

                              val factory = XmlPullParserFactory.newInstance()
                              val parser = factory.newPullParser()
                              parser.setInput(stream, "UTF-8")

                              val now = System.currentTimeMillis()
                              val minTime = now - 3 * 3600_000L
                              val maxTime = now + 12 * 3600_000L

                              val tempById = HashMap<String, MutableList<EpgProgram>>()
                              val tempIdToNames = HashMap<String, MutableList<String>>()

                              var eventType = parser.eventType
                              var currentChanId = ""
                              var progChanId = ""
                              var progStart = 0L
                              var progStop = 0L
                              var progTitle = ""
                              var progDesc = ""
                              var currentTag = ""
                              var count = 0

                              while (eventType != XmlPullParser.END_DOCUMENT) {
                                  when (eventType) {
                                      XmlPullParser.START_TAG -> {
                                          currentTag = parser.name ?: ""
                                          if (currentTag == "channel") {
                                              currentChanId = parser.getAttributeValue(null, "id") ?: ""
                                          } else if (currentTag == "programme") {
                                              progChanId = parser.getAttributeValue(null, "channel") ?: ""
                                              progStart = parseXmltvDate(parser.getAttributeValue(null, "start") ?: "")
                                              progStop = parseXmltvDate(parser.getAttributeValue(null, "stop") ?: "")
                                              progTitle = ""
                                              progDesc = ""
                                          }
                                      }
                                      XmlPullParser.TEXT -> {
                                          val txt = parser.text ?: ""
                                          if (txt.isNotBlank()) {
                                              if (currentTag == "display-name" && currentChanId.isNotEmpty()) {
                                                  val list = tempIdToNames.getOrPut(currentChanId) { mutableListOf() }
                                                  list.add(normalizeName(txt))
                                              } else if (currentTag == "title" && progStop >= minTime && progStart <= maxTime) {
                                                  progTitle += txt
                                              } else if (currentTag == "desc" && progStop >= minTime && progStart <= maxTime) {
                                                  progDesc += txt
                                              }
                                          }
                                      }
                                      XmlPullParser.END_TAG -> {
                                          val endName = parser.name ?: ""
                                          if (endName == "channel") {
                                              currentChanId = ""
                                          } else if (endName == "programme") {
                                              if (progChanId.isNotEmpty() && progTitle.isNotEmpty() && progStop >= minTime && progStart <= maxTime) {
                                                  val list = tempById.getOrPut(progChanId) { mutableListOf() }
                                                  list.add(EpgProgram(progTitle.trim(), progDesc.trim(), progStart, progStop))
                                                  count++
                                              }
                                              progChanId = ""
                                          }
                                          currentTag = ""
                                      }
                                  }
                                  eventType = parser.next()
                              }

                              if (count > 0) {
                                  val tempByName = HashMap<String, MutableList<EpgProgram>>()
                                  for ((id, progs) in tempById) {
                                      progs.sortBy { it.startMs }
                                      val names = tempIdToNames[id] ?: continue
                                      for (n in names) {
                                          if (n.isNotEmpty()) {
                                              tempByName[n] = progs
                                          }
                                      }
                                  }

                                  runOnUiThread {
                                      epgById.clear()
                                      epgById.putAll(tempById)
                                      epgByName.clear()
                                      epgByName.putAll(tempByName)
                                      epgLoadedCount = count
                                      refreshChannelAdapter()
                                  }
                                  break
                              }
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun parseXmltvDate(raw: String): Long {
                  if (raw.length < 14) return 0L
                  return try {
                      val clean = raw.trim()
                      val sdf = if (clean.length >= 19 && (clean.contains("+") || clean.contains("-"))) {
                          SimpleDateFormat("yyyyMMddHHmmss Z", Locale.US)
                      } else {
                          SimpleDateFormat("yyyyMMddHHmmss", Locale.US).apply {
                              timeZone = TimeZone.getTimeZone("GMT+3")
                          }
                      }
                      sdf.parse(clean)?.time ?: 0L
                  } catch (_: Exception) {
                      0L
                  }
              }

              private fun updateCenterOsdContent() {
                  val ch = currentChannel ?: return
                  val isFav = favoriteUrls.contains(ch.url)
                  btnOsdFav.text = if (isFav) "★ В Избранном" else "☆ В Избранное"
                  osdChannelTitle.text = (if (isFav) "★ " else "") + ch.name + "  •  " + ch.category

                  val (curr, next) = getCurrentAndNextEpg(ch)
                  val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
                  val now = System.currentTimeMillis()

                  if (curr != null) {
                      val totalMin = ((curr.stopMs - curr.startMs) / 60000L).coerceAtLeast(1L)
                      val passedMin = ((now - curr.startMs) / 60000L).coerceIn(0L, totalMin)
                      val leftMin = (totalMin - passedMin).coerceAtLeast(0L)
                      val pct = ((now - curr.startMs) * 100L / (curr.stopMs - curr.startMs).coerceAtLeast(1L)).toInt().coerceIn(0, 100)

                      osdEpgCurrentTitle.text = "🎬 " + curr.title
                      osdEpgTimeLabel.text = timeFmt.format(Date(curr.startMs)) + " — " + timeFmt.format(Date(curr.stopMs)) +
                          "   •   Прошло " + passedMin + " мин  (осталось " + leftMin + " мин)"
                      osdEpgProgress.progress = pct

                      val nextLine = if (next != null) {
                          "⏭ Далее в " + timeFmt.format(Date(next.startMs)) + ": " + next.title
                      } else ""
                      val descLine = if (curr.desc.isNotEmpty()) "\n" + curr.desc.take(160) else ""
                      osdEpgNextAndDesc.text = (nextLine + descLine).trim()
                  } else {
                      osdEpgCurrentTitle.text = "🎬 " + (if (epgLoadedCount > 0) "Передача не указана" else "Обновление телепрограммы...")
                      osdEpgTimeLabel.text = "Прямой эфир"
                      osdEpgProgress.progress = 100
                      osdEpgNextAndDesc.text = ""
                  }
              }

              private fun updateStreamInfoText() {
                  val p = player ?: return
                  val ch = currentChannel
                  val vFormat = p.videoFormat
                  val aFormat = p.audioFormat

                  val width = vFormat?.width ?: p.videoSize.width
                  val height = vFormat?.height ?: p.videoSize.height
                  val fps = if (vFormat != null && vFormat.frameRate > 0) String.format(Locale.US, "%.0f fps", vFormat.frameRate) else ""
                  val vCodec = vFormat?.sampleMimeType?.substringAfter("/")?.uppercase() ?: "Анализ..."

                  val vBitrate = if (vFormat != null && vFormat.bitrate > 0) {
                      String.format(Locale.US, "%.2f Мбит/с", vFormat.bitrate / 1_000_000f)
                  } else {
                      "Адаптивный HLS"
                  }

                  val aCodec = aFormat?.sampleMimeType?.substringAfter("/")?.uppercase() ?: "Авто"
                  val aChannels = if (aFormat != null && aFormat.channelCount > 0) aFormat.channelCount.toString() + " кан." else ""
                  val aSampleRate = if (aFormat != null && aFormat.sampleRate > 0) aFormat.sampleRate.toString() + " Гц" else ""
                  val bufSec = p.totalBufferedDuration / 1000L
                  val preloadedCount = synchronized(preloadedLock) { preloadedNeighbors.size }

                  val (epg, _) = getCurrentAndNextEpg(ch)
                  val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
                  val epgLine = if (epg != null) {
                      val range = timeFmt.format(Date(epg.startMs)) + "–" + timeFmt.format(Date(epg.stopMs))
                      "🎬 В эфире (" + range + "):\n" + epg.title
                  } else {
                      "🎬 Программа передач: " + (if (epgLoadedCount > 0) "Активна" else "Обновляется...")
                  }

                  infoTextView.text = "Канал: " + (ch?.name ?: "-") + "\n" +
                      "Группа: " + (ch?.category ?: "-") + "\n\n" +
                      "Разрешение: " + width + "x" + height + " " + fps + " (" + vCodec + ")\n" +
                      "Поток: " + vBitrate + "  •  Буфер: " + bufSec + " сек\n" +
                      "Предзагрузка соседних: " + preloadedCount + " из 2 готовы ⚡\n" +
                      "Звук: " + aCodec + " " + aChannels + " " + aSampleRate + "\n\n" +
                      epgLine
