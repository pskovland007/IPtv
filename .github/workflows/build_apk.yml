              private fun buildLanguageTag(ch: Channel): String {
                  val lower = (ch.name + " " + ch.url).lowercase()
                  val hasCyrillic = ch.name.any { it in 'а'..'я' || it in 'А'..'Я' || it == 'ё' || it == 'Ё' }
                  val isCisStream = lower.contains(".ru") || lower.contains(".kz") || lower.contains(".by")
                  val isBilingual = lower.contains("setanta") || lower.contains("discovery") || lower.contains("nat geo") || lower.contains("viasat") || lower.contains("tv 1000") || lower.contains("eurosport")
                  return when { isBilingual -> "(RU/EN)"; hasCyrillic || isCisStream -> "(RU)"; else -> "(EN)" }
              }

              private fun mapToTenCategories(rawGroup: String, name: String): String {
                  val text = (rawGroup + " " + name).lowercase()
                  return when {
                      text.contains("2k") || text.contains("qhd") || text.contains("quadhd") || text.contains("1440p") || text.contains("2160p") || text.contains("uhd") || text.contains("4k") -> "2K"
                      text.contains("взросл") || text.contains("18+") || text.contains("adult") || text.contains("xxx") -> "Прочее"
                      text.contains("спорт") || text.contains("футбол") || text.contains("матч") || text.contains("сетанта") || text.contains("setanta") || text.contains("sport") || text.contains("khl") || text.contains("кхл") || text.contains("ufc") || text.contains("бокс") -> "Спорт"
                      text.contains("кино") || text.contains("фильм") || text.contains("сериал") || text.contains("movie") || text.contains("cinema") || text.contains("film") || text.contains("tv1000") || text.contains("tv 1000") || text.contains("иллюзион") -> "Кино и сериалы"
                      text.contains("детск") || text.contains("мульт") || text.contains("kids") || text.contains("карусель") || text.contains("nickelodeon") || text.contains("cartoon") -> "Детские"
                      text.contains("наук") || text.contains("док") || text.contains("познав") || text.contains("science") || text.contains("discovery") || text.contains("nat geo") || text.contains("animal") || text.contains("планет") || text.contains("viasat") -> "Познавательные"
                      text.contains("муз") || text.contains("music") || text.contains("mtv") || text.contains("bridge") || text.contains("stingray") -> "Музыка"
                      text.contains("новост") || text.contains("общ") || text.contains("news") || text.contains("россия") || text.contains("первый") || text.contains("нтв") || text.contains("рбк") -> "Новости и общие"
                      text.contains("развлеч") || text.contains("шоу") || text.contains("тнт") || text.contains("стс") || text.contains("пятница") -> "Развлечения"
                      else -> "Прочее"
                  }
              }

              private fun parseM3uLinesDeduplicated(lines: List<String>, filterQuality: Boolean): List<Channel> {
                  val byNormName = LinkedHashMap<String, Channel>()
                  var currentRawName = "Канал"; var currentGroup = ""; var currentTvgId = ""
                  val quote = 34.toChar().toString()
                  for (line in lines) {
                      val trimmed = line.trim()
                      if (trimmed.startsWith("#EXTINF:")) {
                          currentRawName = trimmed.substringAfterLast(",").trim()
                          currentGroup = if (trimmed.contains("group-title=$quote")) trimmed.substringAfter("group-title=$quote").substringBefore(quote) else ""
                          currentTvgId = if (trimmed.contains("tvg-id=$quote")) trimmed.substringAfter("tvg-id=$quote").substringBefore(quote) else ""
                      } else if (trimmed.startsWith("#EXTGRP:")) {
                          currentGroup = trimmed.substringAfter("#EXTGRP:").trim()
                      } else if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                          val cat = customCategoryMap[trimmed] ?: mapToTenCategories(currentGroup, currentRawName)
                          val cleanTitle = cleanChannelDisplayName(currentRawName)
                          val ch = Channel(cleanTitle, trimmed, cat, currentTvgId)
                          val key = normalizeName(cleanTitle).ifEmpty { trimmed }
                          val existing = byNormName[key]
                          if (existing == null || currentRawName.contains("50fps", true) || currentRawName.contains("1080", true)) {
                              byNormName[key] = ch
                          }
                      }
                  }
                  return byNormName.values.toList()
              }

              private fun ensureDefaultPlaylists() {
                  playlists.removeAll { it.source == "BUILTIN_VIP_PROVIDER" }
                  if (playlists.isEmpty()) playlists.add(PlaylistEntry("Основной (RU + Футбол 50fps + 2K)", "BUILTIN_OPEN_RU", false))
                  if (activePlaylistIndex !in playlists.indices) activePlaylistIndex = 0
              }

              private fun isChannelActive(ch: Channel): Boolean {
                  return !manualDisabledUrls.contains(ch.url) && !autoDisabledUrls.contains(ch.url) && !disabledCategories.contains(effectiveCategory(ch))
              }

              private fun loadActivePlaylist(autoPlayLast: Boolean) {
                  ensureDefaultPlaylists()
                  val entry = playlists[activePlaylistIndex]
                  thread {
                      try {
                          val finalChannels: List<Channel> = when {
                              entry.source == "BUILTIN_OPEN_RU" -> {
                                  val result = mutableListOf<Channel>()
                                  val existingKeys = HashSet<String>()
                                  for (extra in BuiltinCatalog.extraOpenStreams) {
                                      val cleanTitle = cleanChannelDisplayName(extra.name)
                                      if (existingKeys.add(normalizeName(cleanTitle) + "_" + extra.category)) {
                                          result.add(Channel(cleanTitle, extra.url, customCategoryMap[extra.url] ?: extra.category, extra.tvgId))
                                      }
                                  }
                                  val combinedLines = mutableListOf<String>()
                                  for (srcUrl in openRusSources) {
                                      try { combinedLines.addAll(openStreamWithRussiaBypass(srcUrl, 6000).bufferedReader().readLines()) } catch (_: Exception) {}
                                  }
                                  for (ch in parseM3uLinesDeduplicated(combinedLines, true)) {
                                      if (existingKeys.add(normalizeName(ch.name) + "_" + ch.category)) result.add(ch)
                                  }
                                  result
                              }
                              entry.isLocal -> parseM3uLinesDeduplicated(File(entry.source).readLines(), false)
                              else -> parseM3uLinesDeduplicated(openStreamWithRussiaBypass(entry.source, 10000).bufferedReader().readLines(), false)
                          }
                          runOnUiThread {
                              allChannels.clear(); allChannels.addAll(finalChannels); updateCategoriesList()
                              val currentList = allChannels.filter { isChannelActive(it) }
                              if (currentList.isNotEmpty()) {
                                  val targetCh = (if (autoPlayLast && lastSavedChannelUrl.isNotEmpty()) currentList.firstOrNull { it.url == lastSavedChannelUrl } else null) ?: currentList[0]
                                  selectCategory(categories.indexOf(effectiveCategory(targetCh)).takeIf { it >= 2 } ?: 1)
                                  openChannelsDirectlyWithCurrentFocus = true
                                  playChannelObj(targetCh)
                              } else selectCategory(1)
                          }
                      } catch (_: Exception) {
                          runOnUiThread {
                              if (allChannels.isEmpty()) {
                                  allChannels.addAll(BuiltinCatalog.extraOpenStreams); updateCategoriesList(); selectCategory(1)
                                  displayedChannels.firstOrNull()?.let { playChannelObj(it) }
                              }
                          }
                      }
                  }
              }

              private fun updateCategoriesList() {
                  val activeAll = allChannels.filter { isChannelActive(it) }
                  categoryAdapter.clear()
                  categoryAdapter.addAll(categories.map { cat ->
                      val count = when (cat) {
                          "★ Избранное" -> activeAll.count { favoriteUrls.contains(it.url) }
                          "Все каналы" -> activeAll.size
                          else -> activeAll.count { effectiveCategory(it) == cat }
                      }
                      "$cat ($count)"
                  })
                  categoryAdapter.notifyDataSetChanged()
              }

              private fun selectCategory(index: Int) {
                  if (index !in categories.indices) return
                  currentCategoryIndex = index; focusedCategoryPos = index
                  categoryListView.setItemChecked(index, true)
                  val catName = categories[index]
                  val activeAll = allChannels.filter { isChannelActive(it) }
                  val rawFiltered = when (catName) {
                      "★ Избранное" -> activeAll.filter { favoriteUrls.contains(it.url) }
                      "Все каналы" -> activeAll
                      else -> activeAll.filter { effectiveCategory(it) == catName }
                  }
                  val alphaComparator = Comparator<Channel> { a, b -> ruCollator.compare(a.name, b.name) }
                  displayedChannels.clear()
                  displayedChannels.addAll(rawFiltered.filter { topUrls.contains(it.url) }.sortedWith(alphaComparator))
                  displayedChannels.addAll(rawFiltered.filter { !topUrls.contains(it.url) }.sortedWith(alphaComparator))
                  focusedChannelPos = 0
                  refreshChannelAdapter()
              }

              private fun refreshChannelAdapter() {
                  val snapshot = displayedChannels.toList()
                  channelAdapter.clear()
                  channelAdapter.addAll(snapshot.mapIndexed { i, ch ->
                      val topBadge = if (topUrls.contains(ch.url)) "▲ " else ""
                      val starBadge = if (favoriteUrls.contains(ch.url)) "★ " else ""
                      "${i + 1}. $topBadge$starBadge${ch.name} ${buildLanguageTag(ch)}"
                  })
                  channelAdapter.notifyDataSetChanged()
              }

