              private fun setPlayerMiniPreviewMode(mini: Boolean) {
                  val dm = resources.displayMetrics
                  if (mini) {
                      val pipW = (dm.widthPixels * 0.42f).toInt().coerceAtLeast(460)
                      val pipH = (pipW * 9f / 16f).toInt()
                      playerContainerFrame.layoutParams = FrameLayout.LayoutParams(pipW, pipH, Gravity.TOP or Gravity.END).apply {
                          setMargins(0, 62, 24, 0)
                      }
                      playerContainerFrame.setPadding(4, 4, 4, 4)
                      playerContainerFrame.background = GradientDrawable().apply {
                          setColor(Color.BLACK)
                          cornerRadius = 18f
                          setStroke(2, ambilightColor(140))
                      }
                      playerContainerFrame.requestLayout()
                  } else {
                      playerContainerFrame.layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          Gravity.CENTER
                      )
                      playerContainerFrame.setPadding(0, 0, 0, 0)
                      playerContainerFrame.background = null
                      playerContainerFrame.requestLayout()
                  }
              }

              // Пункт 6: 4 режима Ambilight (0=Выкл, 1=По группам, 2=Плавный спектр, 3=Захват кадра с TextureView) с мягкой, приглушенной яркостью!
              private fun sampleVideoFrameColorIfPossible() {
                  if (ambilightMode != 3) return
                  try {
                      val tv = playerView.videoSurfaceView as? TextureView ?: return
                      val bmp = tv.getBitmap(16, 16) ?: return
                      var rSum = 0; var gSum = 0; var bSum = 0; var count = 0
                      for (x in 2..13 step 3) {
                          for (y in 2..13 step 3) {
                              val px = bmp.getPixel(x, y)
                              rSum += Color.red(px); gSum += Color.green(px); bSum += Color.blue(px)
                              count++
                          }
                      }
                      bmp.recycle()
                      if (count > 0) {
                          capturedFrameColor = Color.rgb((rSum / count).coerceAtLeast(35), (gSum / count).coerceAtLeast(35), (bSum / count).coerceAtLeast(35))
                      }
                  } catch (_: Exception) {}
              }

              private fun ambilightColor(maxAlpha: Int): Int {
                  if (ambilightMode == 0) {
                      val st = currentTheme().strokeColor
                      return Color.argb((maxAlpha * 0.45f).toInt().coerceIn(20, 90), Color.red(st), Color.green(st), Color.blue(st))
                  }
                  val baseColor = when (ambilightMode) {
                      1 -> { // Свой цвет у разных групп
                          val cat = currentChannel?.let { effectiveCategory(it) } ?: ""
                          when (cat) {
                              "Спорт" -> Color.rgb(0, 200, 110)
                              "Кино и сериалы" -> Color.rgb(40, 160, 230)
                              "Музыка" -> Color.rgb(210, 60, 140)
                              "2K" -> Color.rgb(220, 165, 20)
                              "Детские" -> Color.rgb(230, 120, 40)
                              else -> currentTheme().accentColor
                          }
                      }
                      2 -> { // Плавный спектр (непрерывное перетекание по кругу оттенков)
                          Color.HSVToColor(floatArrayOf(ambilightHue, 0.72f, 0.90f))
                      }
                      else -> capturedFrameColor // Захват кадра
                  }
                  // Мягкая приглушенная яркость (не выше 32% непрозрачности на внешнем ореоле)
                  return Color.argb(maxAlpha.coerceIn(18, 125), Color.red(baseColor), Color.green(baseColor), Color.blue(baseColor))
              }

