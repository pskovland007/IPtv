              private fun openStreamWithRussiaBypass(rawUrl: String, timeoutMs: Int = 7000): InputStream {
                  val conn = URL(rawUrl).openConnection() as HttpURLConnection
                  conn.setRequestProperty("User-Agent", russianSmartTvAgents[userAgentIndex % russianSmartTvAgents.size])
                  conn.setRequestProperty("Accept", "*/*")
                  conn.setRequestProperty("Connection", "keep-alive")
                  if (dohEnabled) conn.setRequestProperty("X-DNS-Prefetch-Control", "on")
                  conn.instanceFollowRedirects = true
                  conn.connectTimeout = timeoutMs
                  conn.readTimeout = timeoutMs
                  if (conn.responseCode in 200..299) return conn.inputStream
                  throw Exception("HTTP ${conn.responseCode}")
              }

