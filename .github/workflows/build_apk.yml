              private fun showFirstRunControlPicker(forceShow: Boolean = false) {
                  if (controlMode == 0 || forceShow) {
                      closeAllMenus()
                      buildFirstRunControlPickerView()
                      firstRunModeOverlay.visibility = View.VISIBLE
                      val card = firstRunModeOverlay.getChildAt(0) as? LinearLayout
                      val row = card?.getChildAt(2) as? LinearLayout
                      row?.getChildAt(if (controlMode == 1) 0 else 1)?.requestFocus()
                  }
              }

              // Пункт 5: Зональные касания на экране (Слева -> Каналы, Справа -> О потоке, Центр -> OSD меню)
              private fun initTouchGestureDetector() {
                  gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true

                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (firstRunModeOverlay.visibility == View.VISIBLE) return true
                          enableTrueFullScreenImmersion()

                          if (menuHistory.isNotEmpty()) {
                              closeAllMenus()
                              return true
                          }

                          val screenW = playerView.width.takeIf { it > 0 } ?: resources.displayMetrics.widthPixels
                          val tapX = e.x

                          when {
                              tapX < screenW * 0.30f -> {
                                  // Касание в левой части экрана -> появляется меню с каналами
                                  navigateToMenu("SIDE")
                              }
                              tapX > screenW * 0.70f -> {
                                  // Касание в правой части экрана -> появляется окно информации о потоке
                                  navigateToMenu("INFO")
                              }
                              else -> {
                                  // Касание по центру -> меню передачи и таймлайн
                                  navigateToMenu("OSD")
                              }
                          }
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (firstRunModeOverlay.visibility == View.VISIBLE) return true
                          navigateToMenu("SETTINGS")
                          return true
                      }

                      override fun onFling(e1: MotionEvent?, e2: MotionEvent, velocityX: Float, velocityY: Float): Boolean {
                          if (e1 == null || firstRunModeOverlay.visibility == View.VISIBLE) return false
                          val dx = e2.x - e1.x
                          val dy = e2.y - e1.y
                          val minSwipe = 85f

                          if (abs(dx) > abs(dy) && abs(dx) > minSwipe) {
                              if (dx > 0) {
                                  navigateToMenu("SIDE")
                              } else {
                                  if (menuHistory.lastOrNull() == "SIDE") {
                                      closeAllMenus()
                                  } else {
                                      navigateToMenu("INFO")
                                  }
                              }
                              return true
                          } else if (abs(dy) > abs(dx) && abs(dy) > minSwipe) {
                              if (menuHistory.isEmpty() || menuHistory.lastOrNull() == "OSD" || menuHistory.lastOrNull() == "INFO") {
                                  if (dy < 0) {
                                      switchChannelByOffset(+1)
                                  } else {
                                      switchChannelByOffset(-1)
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })
              }

