          old_view_start = code.find("class EarthEyeView(")
          old_view_end = code.find("@OptIn(UnstableApi::class)")

          retro_splash_view_code = r'''class EarthEyeView(context: Context) : View(context) {
              var eyeOpenFraction: Float = 0.02f
                  set(value) {
                      field = value.coerceIn(0.02f, 1.0f)
                      invalidate()
                  }

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val wavePath = Path()
              private val outerEyePath = Path()
              private val lashPath = Path()
              private val innerEyePath = Path()
              private val continentPath1 = Path()
              private val continentPath2 = Path()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val cx = w / 2f
                  val cy = h / 2f

                  // 1. Оригинальный полноэкранный фон пластинки "Советская психоделика" (диагональные ретро-волны)
                  canvas.drawColor(Color.parseColor("#D83A18"))

                  val waveStripes = listOf(
                      Triple(0.14f, -0.05f, "#EA7317"),
                      Triple(0.34f, 0.08f, "#F4B926"),
                      Triple(0.62f, 0.24f, "#48A14D"),
                      Triple(0.84f, 0.44f, "#1692A8"),
                      Triple(1.04f, 0.64f, "#284596"),
                      Triple(1.22f, 0.80f, "#7C1D7A")
                  )
                  paint.style = Paint.Style.FILL
                  for ((leftYRatio, rightYRatio, hex) in waveStripes) {
                      wavePath.reset()
                      wavePath.moveTo(0f, h * leftYRatio)
                      wavePath.cubicTo(
                          w * 0.35f, h * (leftYRatio - 0.12f),
                          w * 0.68f, h * (rightYRatio + 0.08f),
                          w, h * rightYRatio
                      )
                      wavePath.lineTo(w, h)
                      wavePath.lineTo(0f, h)
                      wavePath.close()
                      paint.color = Color.parseColor(hex)
                      canvas.drawPath(wavePath, paint)
                  }

                  val rx = w * 0.33f
                  val maxRy = h * 0.24f
                  val ry = maxRy * eyeOpenFraction

                  // 2. Верхняя линия складки века (как на оригинальной иллюстрации)
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 8f
                  paint.strokeCap = Paint.Cap.ROUND
                  paint.color = Color.parseColor("#19130E")
                  outerEyePath.reset()
                  outerEyePath.moveTo(cx - rx * 0.92f, cy - ry * 0.35f)
                  outerEyePath.quadTo(cx - rx * 0.25f, cy - ry * 1.95f, cx + rx * 0.15f, cy - ry * 1.42f)
                  canvas.drawPath(outerEyePath, paint)

                  // 3. Чёрно-угольный контур глаза
                  paint.style = Paint.Style.FILL
                  paint.color = Color.parseColor("#19130E")
                  outerEyePath.reset()
                  outerEyePath.moveTo(cx - rx * 1.08f, cy)
                  outerEyePath.quadTo(cx, cy - ry * 1.92f, cx + rx * 1.08f, cy)
                  outerEyePath.quadTo(cx, cy + ry * 1.92f, cx - rx * 1.08f, cy)
                  outerEyePath.close()
                  canvas.drawPath(outerEyePath, paint)

                  // 4. Фигурные густые ресницы справа сверху (точь-в-точь как на обложке)
                  if (eyeOpenFraction > 0.12f) {
                      lashPath.reset()
                      val topBaseY = cy - ry * 0.88f
                      lashPath.moveTo(cx + rx * 0.02f, topBaseY)
                      lashPath.lineTo(cx + rx * 0.18f, topBaseY - ry * 0.85f)
                      lashPath.lineTo(cx + rx * 0.28f, topBaseY + ry * 0.05f)
                      lashPath.lineTo(cx + rx * 0.50f, topBaseY - ry * 0.68f)
                      lashPath.lineTo(cx + rx * 0.52f, topBaseY + ry * 0.22f)
                      lashPath.lineTo(cx + rx * 0.78f, topBaseY - ry * 0.42f)
                      lashPath.lineTo(cx + rx * 0.72f, topBaseY + ry * 0.48f)
                      lashPath.lineTo(cx + rx * 0.98f, topBaseY + ry * 0.18f)
                      lashPath.lineTo(cx + rx * 0.86f, topBaseY + ry * 0.72f)
                      lashPath.lineTo(cx + rx * 1.10f, topBaseY + ry * 0.65f)
                      lashPath.lineTo(cx + rx * 0.96f, cy)
                      lashPath.close()
                      canvas.drawPath(lashPath, paint)
                  }

                  // 5. Внутренний разрез глаза (винтажный кремовый белок с мягкими тенями в уголках)
                  innerEyePath.reset()
                  innerEyePath.moveTo(cx - rx, cy)
                  innerEyePath.quadTo(cx, cy - ry * 1.66f, cx + rx, cy)
                  innerEyePath.quadTo(cx, cy + ry * 1.66f, cx - rx, cy)
                  innerEyePath.close()

                  canvas.save()
                  canvas.clipPath(innerEyePath)

                  paint.color = Color.parseColor("#EFE5CF")
                  canvas.drawPath(innerEyePath, paint)

                  // 6. Радужная психоделическая оболочка (Iris)
                  val irisRadius = maxRy * 0.95f
                  val irisColors = intArrayOf(
                      Color.parseColor("#D32F2F"),
                      Color.parseColor("#F57C00"),
                      Color.parseColor("#FBC02D"),
                      Color.parseColor("#43A047"),
                      Color.parseColor("#0097A7"),
                      Color.parseColor("#303F9F"),
                      Color.parseColor("#C2185B"),
                      Color.parseColor("#D32F2F")
                  )
                  paint.shader = SweepGradient(cx, cy, irisColors, null)
                  canvas.drawCircle(cx, cy, irisRadius, paint)
                  paint.shader = null

                  // 7. Зрачок — стилизованная планета Земля в ретро-палитре обложки
                  val pupilR = irisRadius * 0.64f
                  paint.color = Color.parseColor("#16100C")
                  canvas.drawCircle(cx, cy, pupilR * 1.06f, paint)

                  val oceanColors = intArrayOf(
                      Color.parseColor("#188FA7"),
                      Color.parseColor("#0D5C75"),
                      Color.parseColor("#102B3F")
                  )
                  paint.shader = RadialGradient(
                      cx - pupilR * 0.2f,
                      cy - pupilR * 0.2f,
                      pupilR * 1.25f,
                      oceanColors,
                      floatArrayOf(0f, 0.65f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawCircle(cx, cy, pupilR, paint)
                  paint.shader = null

                  // Стилизованные ретро-материки (оливково-зелёный и тёплая охра)
                  paint.color = Color.parseColor("#558B2F")
                  continentPath1.reset()
                  continentPath1.moveTo(cx - pupilR * 0.68f, cy - pupilR * 0.50f)
                  continentPath1.quadTo(cx - pupilR * 0.18f, cy - pupilR * 0.62f, cx - pupilR * 0.14f, cy - pupilR * 0.16f)
                  continentPath1.quadTo(cx - pupilR * 0.08f, cy + pupilR * 0.28f, cx - pupilR * 0.42f, cy + pupilR * 0.74f)
                  continentPath1.quadTo(cx - pupilR * 0.78f, cy + pupilR * 0.22f, cx - pupilR * 0.68f, cy - pupilR * 0.50f)
                  continentPath1.close()
                  canvas.drawPath(continentPath1, paint)

                  paint.color = Color.parseColor("#689F38")
                  continentPath2.reset()
                  continentPath2.moveTo(cx + pupilR * 0.08f, cy - pupilR * 0.66f)
                  continentPath2.quadTo(cx + pupilR * 0.76f, cy - pupilR * 0.46f, cx + pupilR * 0.70f, cy + pupilR * 0.08f)
                  continentPath2.quadTo(cx + pupilR * 0.56f, cy + pupilR * 0.66f, cx + pupilR * 0.12f, cy + pupilR * 0.76f)
                  continentPath2.quadTo(cx + pupilR * 0.02f, cy + pupilR * 0.18f, cx + pupilR * 0.16f, cy - pupilR * 0.12f)
                  continentPath2.quadTo(cx - pupilR * 0.04f, cy - pupilR * 0.38f, cx + pupilR * 0.08f, cy - pupilR * 0.66f)
                  continentPath2.close()
                  canvas.drawPath(continentPath2, paint)

                  // Винтажные параллели/меридианы
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 2f
                  paint.color = Color.parseColor("#35EFE5CF")
                  canvas.drawCircle(cx, cy, pupilR * 0.68f, paint)
                  canvas.drawLine(cx - pupilR, cy, cx + pupilR, cy, paint)

                  // Оригинальные кремовые блики зрачка с иллюстрации
                  paint.style = Paint.Style.FILL
                  paint.color = Color.parseColor("#F5ECD7")
                  canvas.drawCircle(cx + pupilR * 0.40f, cy - pupilR * 0.30f, pupilR * 0.14f, paint)
                  canvas.drawCircle(cx + pupilR * 0.62f, cy - pupilR * 0.12f, pupilR * 0.08f, paint)
                  canvas.drawCircle(cx - pupilR * 0.46f, cy + pupilR * 0.42f, pupilR * 0.11f, paint)

                  canvas.restore()
              }
          }

          '''

          if old_view_start != -1 and old_view_end != -1:
              code = code[:old_view_start] + retro_splash_view_code + code[old_view_end:]

          # Растягиваем splashEyeView на весь экран, чтобы винтажные волны обложки занимали весь экран при запуске
          code = code.replace(
              "FrameLayout.LayoutParams(580, 380, Gravity.CENTER)",
              "FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT, Gravity.CENTER)"
          )

          with open("app/src/main/java/com/example/miboxiptv/MainActivity.kt", "w") as f:
              f.write(code)
          PYEOF

      # Восстанавливаем ИЛИ сохраняем один и тот же ~/.android/debug.keystore ДО запуска Gradle!
      - name: Restore or Lock Permanent Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mibox-iptv-permanent-keystore-lock-v1

      - name: Step 4 - Compile and Sign APK with Fixed Keystore
        run: |
          # Если кэш пуст (первый запуск v1.0), копируем наш детерминированный ключ в ~/.android/debug.keystore,
          # чтобы все последующие сборки 100% брали один и тот же байтовый сертификат
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -importkeystore \
              -srckeystore app/permanent.p12 -srcstoretype PKCS12 -srcstorepass mibox123 -srcalias miboxkey \
              -destkeystore ~/.android/debug.keystore -deststoretype JKS -deststorepass android -destkeypass android -destalias androiddebugkey \
              -noprompt || true
          fi
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk MiBox-IPTV-v1.0.${GITHUB_RUN_NUMBER}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiBox-IPTV-v1.0.${{ github.run_number }}
          path: MiBox-IPTV-v1.0.${{ github.run_number }}.apk
