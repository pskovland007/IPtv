              // Пункт 3: Проверка, является ли канал русскоязычным (кириллица или известные бренды кино в РФ/СНГ)
              private fun isRussianLanguageChannel(name: String, extInf: String): Boolean {
                  for (c in name) {
                      if (c in 'а'..'я' || c in 'А'..'Я' || c == 'ё' || c == 'Ё') return true
                  }
                  val lower = (name + " " + extInf).lowercase()
                  val ruBrands = listOf(
                      "(ru)", "[ru]", "rus", "viju", "amedia", "tv1000", "tv 1000", "bcu",
                      "cineman", "vip ", "kino", "film", "premier", "start", "okko", "kion"
                  )
                  return ruBrands.any { lower.contains(it) }
              }

              private fun mapToTenCategories(rawGroup: String, name: String): String {
                  val text = (rawGroup + " " + name).lowercase()
                  return when {
                      text.contains("2k") || text.contains("qhd") || text.contains("quadhd") || text.contains("1440p") || text.contains("uhd") || text.contains("4k") -> "2K"
                      text.contains("взросл") || text.contains("18+") || text.contains("adult") || text.contains("xxx") || text.contains("erot") -> "Прочее"
                      text.contains("кино") || text.contains("фильм") || text.contains("сериал") || text.contains("movie") || text.contains("cinema") || text.contains("film") || text.contains("bcu") || text.contains("cineman") || text.contains("viju") || text.contains("amedia") || text.contains("tv1000") || text.contains("tv 1000") || text.contains("иллюзион") -> "Кино и сериалы"
                      text.contains("спорт") || text.contains("футбол") || text.contains("матч") || text.contains("sport") || text.contains("khl") || text.contains("ufc") || text.contains("mma") || text.contains("бокс") || text.contains("fight") || text.contains("racing") -> "Спорт"
                      text.contains("детск") || text.contains("мульт") || text.contains("kids") || text.contains("ani") || text.contains("карусель") || text.contains("disney") || text.contains("nickelodeon") -> "Детские"
                      text.contains("наук") || text.contains("док") || text.contains("познав") || text.contains("science") || text.contains("doc") || text.contains("history") || text.contains("discovery") || text.contains("nat geo") || text.contains("animal") || text.contains("планет") || text.contains("охот") -> "Познавательные"
                      text.contains("муз") || text.contains("music") || text.contains("hit") || text.contains("rock") || text.contains("pop") || text.contains("шансон") || text.contains("mtv") || text.contains("bridge") || text.contains("mezzo") || text.contains("vevo") || text.contains("stingray") -> "Музыка"
                      text.contains("новост") || text.contains("общ") || text.contains("инфо") || text.contains("news") || text.contains("general") || text.contains("россия") || text.contains("первый") || text.contains("нтв") || text.contains("рбк") || text.contains("псков") -> "Новости и общие"
                      text.contains("развлеч") || text.contains("юмор") || text.contains("шоу") || text.contains("entertain") || text.contains("comedy") || text.contains("тнт") || text.contains("стс") || text.contains("пятница") -> "Развлечения"
                      else -> "Прочее"
                  }
              }

              private fun is1080or720Channel(extInfLine: String, name: String): Boolean {
                  val lower = (extInfLine + " " + name).lowercase()
                  val lowRes = listOf("576p", "540p", "480p", "360p", "240p", "(sd)")
                  for (tag in lowRes) {
                      if (lower.contains(tag)) return false
                  }
                  return true
              }

              private fun parseM3uLinesDeduplicated(lines: List<String>, filterQuality: Boolean): List<Channel> {
                  val byNormName = LinkedHashMap<String, Channel>()
                  var currentName = "Канал"
                  var currentExtInf = ""
                  var currentGroup = ""
                  var currentTvgId = ""
                  val quote = 34.toChar().toString()

                  for (line in lines) {
                      val trimmed = line.trim()
                      if (trimmed.startsWith("#EXTINF:")) {
                          currentExtInf = trimmed
                          currentName = trimmed.substringAfterLast(",").trim()
                          val groupPrefix = "group-title=" + quote
                          currentGroup = if (trimmed.contains(groupPrefix)) {
                              trimmed.substringAfter(groupPrefix).substringBefore(quote)
                          } else ""
                          val idPrefix = "tvg-id=" + quote
                          currentTvgId = if (trimmed.contains(idPrefix)) {
                              trimmed.substringAfter(idPrefix).substringBefore(quote)
                          } else ""
                      } else if (trimmed.startsWith("#EXTGRP:")) {
                          currentGroup = trimmed.substringAfter("#EXTGRP:").trim()
                      } else if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                          if (!filterQuality || is1080or720Channel(currentExtInf, currentName)) {
                              val cat = mapToTenCategories(currentGroup, currentName)
                              // Пункт 3: В категорию "Кино и сериалы" (и "Развлечения"/"Детские") при сборке основного плейлиста пускаем только русскоязычные каналы!
                              if (filterQuality && (cat == "Кино и сериалы" || cat == "Развлечения" || cat == "Детские" || cat == "Новости и общие") && !isRussianLanguageChannel(currentName, currentExtInf)) {
                                  continue
                              }
                              val ch = Channel(currentName, trimmed, cat, currentTvgId)
                              val key = normalizeName(currentName).ifEmpty { trimmed }
                              val existing = byNormName[key]
                              if (existing == null) {
                                  byNormName[key] = ch
                              } else {
                                  val newIsHigh = currentName.contains("2K", true) || currentName.contains("1080", true) || currentName.contains("FHD", true)
                                  val oldIsHigh = existing.name.contains("2K", true) || existing.name.contains("1080", true) || existing.name.contains("FHD", true)
                                  if (newIsHigh && !oldIsHigh) {
                                      byNormName[key] = ch
                                  }
                              }
                          }
                      }
                  }
                  return byNormName.values.toList()
              }

              private fun ensureDefaultPlaylists() {
                  playlists.removeAll { it.source == "BUILTIN_VIP_PROVIDER" }
                  if (playlists.isEmpty()) {
                      playlists.add(PlaylistEntry("Основной (RU Кино + 2K + Спорт/Музыка)", "BUILTIN_OPEN_RU", false))
                  } else if (playlists.none { it.source == "BUILTIN_OPEN_RU" }) {
                      playlists.add(0, PlaylistEntry("Основной (RU Кино + 2K + Спорт/Музыка)", "BUILTIN_OPEN_RU", false))
                  }
                  if (activePlaylistIndex !in playlists.indices) {
                      activePlaylistIndex = 0
                  }
              }

              private fun isChannelActive(ch: Channel): Boolean {
                  return !disabledUrls.contains(ch.url) && !disabledCategories.contains(ch.category)
              }

              private fun loadActivePlaylist(autoPlayLast: Boolean) {
                  ensureDefaultPlaylists()
                  val entry = playlists[activePlaylistIndex]

                  thread {
                      try {
                          val finalChannels: List<Channel> = when {
                              entry.source == "BUILTIN_OPEN_RU" -> {
                                  val combinedLines = mutableListOf<String>()
                                  // Сначала добавляем встроенные русскоязычные киноканалы и 2K, чтобы они всегда были в приоритете
                                  val result = mutableListOf<Channel>()
                                  val existingKeys = HashSet<String>()
                                  for (extra in BuiltinCatalog.extraOpenStreams) {
                                      if (extra.category == "Кино и сериалы" && !isRussianLanguageChannel(extra.name, "")) continue
                                      if (existingKeys.add(normalizeName(extra.name))) {
                                          result.add(extra)
                                      }
                                  }

                                  for (srcUrl in openRusSources) {
                                      try {
                                          val stream = openStreamWithRussiaBypass(srcUrl, 6000)
                                          combinedLines.addAll(stream.bufferedReader().readLines())
                                      } catch (_: Exception) {}
                                  }
                                  val parsed = parseM3uLinesDeduplicated(combinedLines, true)
                                  for (ch in parsed) {
                                      if (existingKeys.add(normalizeName(ch.name))) {
                                          result.add(ch)
                                      }
                                  }
                                  result
                              }
                              entry.isLocal -> {
                                  val lines = File(entry.source).readLines()
                                  parseM3uLinesDeduplicated(lines, false)
                              }
                              else -> {
                                  val stream = openStreamWithRussiaBypass(entry.source, 10000)
                                  val lines = stream.bufferedReader().readLines()
                                  parseM3uLinesDeduplicated(lines, false)
                              }
                          }

                          runOnUiThread {
                              allChannels.clear()
                              allChannels.addAll(finalChannels)
                              updateCategoriesList()

                              val currentList = allChannels.filter { isChannelActive(it) }
                              if (currentList.isNotEmpty()) {
                                  val resumeCh = if (autoPlayLast && lastSavedChannelUrl.isNotEmpty()) {
                                      currentList.firstOrNull { it.url == lastSavedChannelUrl }
                                  } else null
                                  val targetCh = resumeCh ?: currentList[0]
                                  val catIdx = categories.indexOf(targetCh.category).takeIf { it >= 2 } ?: 1
                                  selectCategory(catIdx)
                                  openChannelsDirectlyWithCurrentFocus = true
                                  playChannelObj(targetCh)
                              } else {
                                  selectCategory(1)
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              if (allChannels.isEmpty()) {
                                  allChannels.addAll(BuiltinCatalog.extraOpenStreams)
                                  updateCategoriesList()
                                  selectCategory(1)
                                  val currentList = displayedChannels.toList()
                                  if (currentList.isNotEmpty()) playChannelObj(currentList[0])
                              }
                          }
                      }
                  }
              }

              private fun updateCategoriesList() {
                  val activeAll = allChannels.filter { isChannelActive(it) }
                  val counts = categories.map { cat ->
                      val count = when (cat) {
                          "★ Избранное" -> activeAll.count { favoriteUrls.contains(it.url) }
                          "Все каналы" -> activeAll.size
                          else -> activeAll.count { it.category == cat }
                      }
                      "$cat ($count)"
                  }
                  categoryAdapter.clear()
                  categoryAdapter.addAll(counts)
                  categoryAdapter.notifyDataSetChanged()
              }

              private fun selectCategory(index: Int) {
                  if (index !in categories.indices) return
                  currentCategoryIndex = index
                  categoryListView.setItemChecked(index, true)
                  val catName = categories[index]
                  val activeAll = allChannels.filter { isChannelActive(it) }

                  val rawFiltered = when (catName) {
                      "★ Избранное" -> activeAll.filter { favoriteUrls.contains(it.url) }
                      "Все каналы" -> activeAll
                      else -> activeAll.filter { it.category == catName }
                  }

                  val topPart = rawFiltered.filter { topUrls.contains(it.url) }
                  val normalPart = rawFiltered.filter { !topUrls.contains(it.url) }

                  displayedChannels.clear()
                  displayedChannels.addAll(topPart)
                  displayedChannels.addAll(normalPart)

                  refreshChannelAdapter()
              }

              private fun refreshChannelAdapter() {
                  val snapshot = displayedChannels.toList()
                  val t = currentTheme()
                  val formatted = snapshot.mapIndexed { i, ch ->
                      val topBadge = if (topUrls.contains(ch.url)) "${t.iconTop} " else ""
                      val starBadge = if (favoriteUrls.contains(ch.url)) "${t.iconFav} " else ""
                      val (epg, _) = getCurrentAndNextEpg(ch)
                      val epgSuffix = if (epg != null) " • " + epg.title else ""
                      (i + 1).toString() + ". " + topBadge + starBadge + ch.name + epgSuffix
                  }
                  channelAdapter.clear()
                  channelAdapter.addAll(formatted)
                  channelAdapter.notifyDataSetChanged()
              }

              private fun toggleTopChannel(ch: Channel) {
                  if (topUrls.contains(ch.url)) {
                      topUrls.remove(ch.url)
                      Toast.makeText(this, "Убрано из ТОПа: ${ch.name}", Toast.LENGTH_SHORT).show()
                  } else {
                      topUrls.add(ch.url)
                      Toast.makeText(this, "${currentTheme().iconTop} Закреплено в ТОПе группы: ${ch.name}", Toast.LENGTH_SHORT).show()
                  }
                  saveState()
                  selectCategory(currentCategoryIndex)
              }

              private fun toggleFavorite(ch: Channel) {
                  if (favoriteUrls.contains(ch.url)) {
                      favoriteUrls.remove(ch.url)
                  } else {
                      favoriteUrls.add(ch.url)
                  }
                  saveState()
                  updateCategoriesList()
                  selectCategory(currentCategoryIndex)
              }

              private fun playChannelObj(channel: Channel) {
                  currentChannel = channel
                  lastSavedChannelUrl = channel.url
                  bufferingStuckSeconds = 0
                  saveState()

                  try {
                      player?.setMediaItem(createLiveMediaItem(channel.url))
                      player?.prepare()
                      player?.play()
                  } catch (_: Exception) {}

                  val t = currentTheme()
                  val topBadge = if (topUrls.contains(channel.url)) "${t.iconTop} " else ""
                  val star = if (favoriteUrls.contains(channel.url)) "${t.iconFav} " else ""
                  val (epg, _) = getCurrentAndNextEpg(channel)
                  val epgLine = if (epg != null) "\n🎬 " + epg.title else ""
                  showBanner(topBadge + star + channel.name + "  •  " + channel.category + epgLine)
                  updateSignalIndicator()

                  if (centerOsdPanel.visibility == View.VISIBLE) updateCenterOsdContent()
                  if (infoPanel.visibility == View.VISIBLE) updateStreamInfoText()
                  if (fullEpgOverlay.visibility == View.VISIBLE) openFullScreenChannelEpg()

                  uiHandler.removeCallbacks(preloadNeighborsRunnable)
                  uiHandler.postDelayed(preloadNeighborsRunnable, 1200L)
              }

              private val preloadNeighborsRunnable = Runnable {
                  currentChannel?.let { preloadNeighboringChannels(it) }
              }

              private fun showBanner(text: String) {
                  currentChannelBanner.text = text
                  currentChannelBanner.visibility = View.VISIBLE
                  currentChannelBanner.removeCallbacks(hideBannerRunnable)
                  currentChannelBanner.postDelayed(hideBannerRunnable, 4000)
              }

              private val hideBannerRunnable = Runnable {
                  currentChannelBanner.visibility = View.GONE
              }

              private fun saveState() {
                  val prefs = getSharedPreferences("iptv_v4_prefs", Context.MODE_PRIVATE)
                  val arr = JSONArray()
                  for (p in playlists) {
                      if (p.source == "BUILTIN_VIP_PROVIDER") continue
                      val obj = JSONObject()
                      obj.put("title", p.title)
                      obj.put("source", p.source)
                      obj.put("isLocal", p.isLocal)
                      arr.put(obj)
                  }
                  prefs.edit()
                      .putString("playlists_json", arr.toString())
                      .putInt("active_playlist", activePlaylistIndex)
                      .putInt("buffer_level", bufferLevel)
                      .putInt("decoder_mode", decoderMode)
                      .putInt("theme_index", themeIndex)
                      .putInt("control_mode_v13", controlMode)
                      .putBoolean("anti_block_ru", antiBlockEnabled)
                      .putInt("ua_index", userAgentIndex)
                      .putString("epg_url", epgUrl)
                      .putString("last_channel_url", lastSavedChannelUrl)
                      .putStringSet("favorites", favoriteUrls.toSet())
                      .putStringSet("top_urls", topUrls.toSet())
                      .putStringSet("disabled_urls", disabledUrls.toSet())
                      .putStringSet("disabled_cats", disabledCategories.toSet())
                      .apply()
              }

              private fun loadSavedState() {
                  val prefs = getSharedPreferences("iptv_v4_prefs", Context.MODE_PRIVATE)
                  bufferLevel = prefs.getInt("buffer_level", 2)
                  decoderMode = prefs.getInt("decoder_mode", 1)
                  themeIndex = prefs.getInt("theme_index", 0)
                  controlMode = prefs.getInt("control_mode_v13", 0)
                  antiBlockEnabled = prefs.getBoolean("anti_block_ru", true)
                  userAgentIndex = prefs.getInt("ua_index", 0)
                  activePlaylistIndex = prefs.getInt("active_playlist", 0)
                  epgUrl = prefs.getString("epg_url", epgUrl) ?: epgUrl
                  lastSavedChannelUrl = prefs.getString("last_channel_url", "") ?: ""

                  favoriteUrls.clear()
                  favoriteUrls.addAll(prefs.getStringSet("favorites", emptySet()) ?: emptySet())
                  topUrls.clear()
                  topUrls.addAll(prefs.getStringSet("top_urls", emptySet()) ?: emptySet())
                  disabledUrls.clear()
                  disabledUrls.addAll(prefs.getStringSet("disabled_urls", emptySet()) ?: emptySet())
                  disabledCategories.clear()
                  disabledCategories.addAll(prefs.getStringSet("disabled_cats", emptySet()) ?: emptySet())

                  playlists.clear()
                  val jsonStr = prefs.getString("playlists_json", null)
                  if (!jsonStr.isNullOrEmpty()) {
                      try {
                          val arr = JSONArray(jsonStr)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              val src = o.getString("source")
                              if (src != "BUILTIN_VIP_PROVIDER") {
                                  playlists.add(
                                      PlaylistEntry(
                                          o.getString("title"),
                                          src,
                                          o.getBoolean("isLocal")
                                      )
                                  )
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  ensureDefaultPlaylists()
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN && menuHistory.isNotEmpty()) {
                      resetMenuInactivityTimer()
                  }
                  return super.dispatchKeyEvent(event)
              }

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (ev.action == MotionEvent.ACTION_DOWN && menuHistory.isNotEmpty()) {
                      resetMenuInactivityTimer()
                  }
                  return super.dispatchTouchEvent(ev)
              }

              private fun switchChannelByOffset(offset: Int) {
                  val list = displayedChannels.toList()
                  if (list.isEmpty()) return
                  val idx = list.indexOfFirst { it.url == currentChannel?.url }
                  val targetIdx = if (offset > 0) {
                      if (idx < 0 || idx + 1 >= list.size) 0 else idx + 1
                  } else {
                      if (idx <= 0) list.size - 1 else idx - 1
                  }
                  playChannelObj(list[targetIdx])
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (navigateBackInMenu()) {
                          return true
                      }
                      val now = System.currentTimeMillis()
                      if (now - lastBackPressTime < 2200L) {
                          finish()
                      } else {
                          lastBackPressTime = now
                          Toast.makeText(this, "Нажмите «Назад» ещё раз для выхода", Toast.LENGTH_SHORT).show()
                      }
                      return true
                  }

                  if (firstRunModeOverlay.visibility == View.VISIBLE) {
                      return super.onKeyDown(keyCode, event)
                  }

                  if (keyCode == KeyEvent.KEYCODE_CHANNEL_UP || keyCode == KeyEvent.KEYCODE_PAGE_UP) {
                      switchChannelByOffset(+1)
                      return true
                  }
                  if (keyCode == KeyEvent.KEYCODE_CHANNEL_DOWN || keyCode == KeyEvent.KEYCODE_PAGE_DOWN) {
                      switchChannelByOffset(-1)
                      return true
                  }

                  val activeMenu = menuHistory.lastOrNull()

                  if (activeMenu == null || activeMenu == "INFO" || activeMenu == "OSD") {
                      if (keyCode == KeyEvent.KEYCODE_DPAD_UP) {
                          switchChannelByOffset(+1)
                          return true
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN) {
                          switchChannelByOffset(-1)
                          return true
                      }
                  }

                  if (activeMenu != null && activeMenu != "INFO") {
                      return super.onKeyDown(keyCode, event)
                  }

                  when (keyCode) {
                      KeyEvent.KEYCODE_DPAD_LEFT -> {
                          navigateToMenu("SIDE")
                          return true
                      }
                      KeyEvent.KEYCODE_DPAD_RIGHT -> {
                          if (activeMenu == "INFO") {
                              navigateBackInMenu()
                          } else {
                              navigateToMenu("INFO")
                          }
                          return true
                      }
                      KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                          navigateToMenu("OSD")
                          return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onResume() {
                  super.onResume()
                  enableTrueFullScreenImmersion()
                  val p = player
                  if (p == null) {
                      initPlayer()
                  }
                  if (allChannels.isEmpty()) {
                      loadActivePlaylist(autoPlayLast = true)
                  } else {
                      val list = displayedChannels.toList()
                      val ch = currentChannel ?: list.firstOrNull { it.url == lastSavedChannelUrl } ?: list.firstOrNull()
                      if (ch != null && (player?.playbackState == Player.STATE_IDLE || player?.isPlaying == false)) {
                          playChannelObj(ch)
                      }
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isAnalyzerRunning = false
                  preloaderExecutor.shutdownNow()
                  uiHandler.removeCallbacksAndMessages(null)
                  try { player?.release() } catch (_: Exception) {}
              }
          }
          ''')
          PYEOF

      - name: Lock Permanent Signing Keystore in Cache
        uses: actions/cache@v4
        with:
          path: app/permanent_key.jks
          key: mibox-iptv-immutable-signing-jks-v1

      - name: Step 4 - Ensure Keystore Exists and Compile APK
        run: |
          if [ ! -f app/permanent_key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/permanent_key.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp app/permanent_key.jks ~/.android/debug.keystore || true
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk MiBox-IPTV-v1.4.${GITHUB_RUN_NUMBER}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiBox-IPTV-v1.4.${{ github.run_number }}
          path: MiBox-IPTV-v1.4.${{ github.run_number }}.apk
