name: Build MiBox IPTV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Create Project and Build APK
        run: |
          python3 - << 'PYEOF'
          import os

          os.makedirs("app/src/main/java/com/example/miboxiptv", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)

          with open("settings.gradle", "w") as f:
              f.write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiBoxIPTV"
          include ":app"
          ''')

          with open("build.gradle", "w") as f:
              f.write('''plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          ''')

          with open("gradle.properties", "w") as f:
              f.write("android.useAndroidX=true\n")

          with open("app/build.gradle", "w") as f:
              f.write('''plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.example.miboxiptv"
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.miboxiptv"
                  minSdk 23
                  targetSdk 34
                  versionCode 3
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.media3:media3-exoplayer:1.2.1"
              implementation "androidx.media3:media3-exoplayer-hls:1.2.1"
              implementation "androidx.media3:media3-ui:1.2.1"
          }
          ''')

          with open("app/src/main/res/drawable/ic_launcher.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#141026" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00E5FF" android:pathData="M18,26h72c3.3,0 6,2.7 6,6v42c0,3.3 -2.7,6 -6,6H18c-3.3,0 -6,-2.7 -6,-6V32c0,-3.3 2.7,-6 6,-6z"/>
              <path android:fillColor="#1E1836" android:pathData="M22,30h64v38H22z"/>
              <path android:fillColor="#FF2A85" android:pathData="M45,39l22,10l-22,10z"/>
              <path android:fillColor="#00E5FF" android:pathData="M36,84h36v4H36z"/>
          </vector>
          ''')

          with open("app/src/main/res/drawable/ic_banner.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:fillColor="#141026" android:pathData="M0,0h320v180h-320z"/>
              <path android:fillColor="#1F193D" android:pathData="M0,130h320v50h-320z"/>
              <path android:fillColor="#00E5FF" android:pathData="M96,32h128c5.5,0 10,4.5 10,10v76c0,5.5 -4.5,10 -10,10H96c-5.5,0 -10,-4.5 -10,-10V42c0,-5.5 4.5,-10 10,-10z"/>
              <path android:fillColor="#141026" android:pathData="M102,38h116v68H102z"/>
              <path android:fillColor="#FF2A85" android:pathData="M146,54l36,18l-36,18z"/>
              <path android:fillColor="#00E5FF" android:pathData="M126,136h68v6H126z"/>
          </vector>
          ''')

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:banner="@drawable/ic_banner"
                  android:icon="@drawable/ic_launcher"
                  android:label="MiBox IPTV 1080p"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          with open("app/src/main/java/com/example/miboxiptv/MainActivity.kt", "w") as f:
              f.write('''package com.example.miboxiptv

          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          data class Channel(val name: String, val url: String, val category: String)
          data class PlaylistEntry(val title: String, val source: String, val isLocal: Boolean)

          class MainActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var categoryListView: ListView
              private lateinit var channelListView: ListView
              private lateinit var sidePanel: LinearLayout
              private lateinit var currentChannelBanner: TextView
              private lateinit var activePlaylistLabel: TextView

              private val allChannels = mutableListOf<Channel>()
              private val displayedChannels = mutableListOf<Channel>()
              private val favoriteUrls = mutableSetOf<String>()
              private val playlists = mutableListOf<PlaylistEntry>()

              private lateinit var categoryAdapter: ArrayAdapter<String>
              private lateinit var channelAdapter: ArrayAdapter<String>

              private var currentCategoryIndex = 1
              private var currentChannel: Channel? = null
              private var activePlaylistIndex = 0
              private var bufferLevel = 1

              private val categories = listOf(
                  "★ Избранное",
                  "Все 1080p",
                  "Кино и сериалы",
                  "Спорт",
                  "Детские",
                  "Познавательные",
                  "Музыка",
                  "Новости и общие",
                  "Развлечения",
                  "Прочее"
              )

              private val defaultRusUrl = "https://iptv-org.github.io/iptv/languages/rus.m3u"
              private val FILE_PICK_CODE = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  loadSavedState()

                  val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }

                  playerView = PlayerView(this).apply {
                      useController = false
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  }
                  root.addView(playerView)

                  sidePanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#D9101018"))
                      layoutParams = FrameLayout.LayoutParams(
                          1120,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          Gravity.START
                      )
                      setPadding(24, 24, 24, 24)
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 16)
                  }

                  val btnSettings = Button(this).apply {
                      text = "⚙ Настройки"
                      setOnClickListener { showSettingsMenu() }
                  }
                  topBar.addView(btnSettings)

                  val btnFavToggle = Button(this).apply {
                      text = "★ В избранное"
                      setOnClickListener { toggleCurrentSelectedFavorite() }
                  }
                  topBar.addView(btnFavToggle)

                  activePlaylistLabel = TextView(this).apply {
                      setTextColor(Color.parseColor("#00E5FF"))
                      textSize = 16f
                      setPadding(24, 0, 0, 0)
                  }
                  topBar.addView(activePlaylistLabel)
                  sidePanel.addView(topBar)

                  val columnsLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  categoryListView = ListView(this).apply {
                      choiceMode = ListView.CHOICE_MODE_SINGLE
                      setBackgroundColor(Color.parseColor("#22FFFFFF"))
                      layoutParams = LinearLayout.LayoutParams(
                          380,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      ).apply { setMargins(0, 0, 16, 0) }
                  }

                  channelListView = ListView(this).apply {
                      choiceMode = ListView.CHOICE_MODE_SINGLE
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  columnsLayout.addView(categoryListView)
                  columnsLayout.addView(channelListView)
                  sidePanel.addView(columnsLayout)
                  root.addView(sidePanel)

                  currentChannelBanner = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 20f
                      setBackgroundColor(Color.parseColor("#B3141026"))
                      setPadding(32, 16, 32, 16)
                      visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.END
                      ).apply { setMargins(0, 36, 36, 0) }
                  }
                  root.addView(currentChannelBanner)

                  setContentView(root)

                  initPlayer()

                  categoryAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_activated_1, mutableListOf())
                  categoryListView.adapter = categoryAdapter

                  channelAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, mutableListOf())
                  channelListView.adapter = channelAdapter

                  categoryListView.setOnItemClickListener { _, _, position, _ ->
                      selectCategory(position)
                      channelListView.requestFocus()
                  }

                  categoryListView.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          selectCategory(position)
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  channelListView.setOnItemClickListener { _, _, position, _ ->
                      if (position in displayedChannels.indices) {
                          playChannelObj(displayedChannels[position])
                          hideSidePanel()
                      }
                  }

                  channelListView.setOnItemLongClickListener { _, _, position, _ ->
                      if (position in displayedChannels.indices) {
                          toggleFavorite(displayedChannels[position])
                      }
                      true
                  }

                  loadActivePlaylist()
              }

              private fun initPlayer() {
                  val currentUrl = currentChannel?.url
                  player?.release()

                  val (minBuf, maxBuf, startBuf) = when (bufferLevel) {
                      0 -> Triple(2000, 6000, 1000)
                      2 -> Triple(30000, 60000, 4000)
                      else -> Triple(12000, 28000, 2000)
                  }

                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(minBuf, maxBuf, startBuf, startBuf)
                      .build()

                  val newPlayer = ExoPlayer.Builder(this)
                      .setLoadControl(loadControl)
                      .build()

                  newPlayer.trackSelectionParameters = newPlayer.trackSelectionParameters
                      .buildUpon()
                      .setMinVideoSize(1920, 1080)
                      .setMaxVideoSize(3840, 2160)
                      .build()

                  playerView.player = newPlayer
                  player = newPlayer

                  if (currentUrl != null) {
                      newPlayer.setMediaItem(MediaItem.fromUri(currentUrl))
                      newPlayer.prepare()
                      newPlayer.play()
                  }
              }

              private fun mapToTenCategories(rawGroup: String, name: String): String {
                  val text = (rawGroup + " " + name).lowercase()
                  return when {
                      text.contains("кино") || text.contains("фильм") || text.contains("сериал") || text.contains("movie") || text.contains("cinema") || text.contains("film") -> "Кино и сериалы"
                      text.contains("спорт") || text.contains("футбол") || text.contains("матч") || text.contains("sport") || text.contains("khl") || text.contains("ufc") -> "Спорт"
                      text.contains("детск") || text.contains("мульт") || text.contains("kids") || text.contains("ani") || text.contains("карусель") || text.contains("disney") -> "Детские"
                      text.contains("наук") || text.contains("док") || text.contains("познав") || text.contains("science") || text.contains("doc") || text.contains("history") || text.contains("discovery") || text.contains("nat geo") -> "Познавательные"
                      text.contains("муз") || text.contains("music") || text.contains("hit") || text.contains("rock") || text.contains("pop") || text.contains("шансон") -> "Музыка"
                      text.contains("новост") || text.contains("общ") || text.contains("инфо") || text.contains("news") || text.contains("general") || text.contains("россия") || text.contains("первый") -> "Новости и общие"
                      text.contains("развлеч") || text.contains("юмор") || text.contains("шоу") || text.contains("entertain") || text.contains("comedy") || text.contains("тнт") || text.contains("стс") || text.contains("пятница") -> "Развлечения"
                      else -> "Прочее"
                  }
              }

              private fun is1080pChannel(extInfLine: String, name: String): Boolean {
                  val lower = (extInfLine + " " + name).lowercase()
                  val lowRes = listOf("720p", "576p", "540p", "480p", "360p", "240p", "(sd)")
                  for (tag in lowRes) {
                      if (lower.contains(tag)) return false
                  }
                  return lower.contains("1080p") || lower.contains("1080") || lower.contains("fhd")
              }

              private fun loadActivePlaylist() {
                  if (playlists.isEmpty()) {
                      playlists.add(PlaylistEntry("Русские 1080p (Встроенный)", defaultRusUrl, false))
                  }
                  if (activePlaylistIndex !in playlists.indices) activePlaylistIndex = 0
                  val entry = playlists[activePlaylistIndex]
                  activePlaylistLabel.text = "Плейлист: " + entry.title + " | Буфер: " + bufferName()

                  Toast.makeText(this, "Загрузка: " + entry.title, Toast.LENGTH_SHORT).show()

                  thread {
                      try {
                          val lines: List<String> = if (entry.isLocal) {
                              if (entry.source.startsWith("content://")) {
                                  contentResolver.openInputStream(Uri.parse(entry.source))?.bufferedReader()?.readLines() ?: emptyList()
                              } else {
                                  File(entry.source).readLines()
                              }
                          } else {
                              val conn = URL(entry.source).openConnection() as HttpURLConnection
                              conn.connectTimeout = 10000
                              conn.readTimeout = 10000
                              conn.inputStream.bufferedReader().readLines()
                          }

                          val strict1080 = mutableListOf<Channel>()
                          val allFallback = mutableListOf<Channel>()
                          var currentName = "Канал"
                          var currentExtInf = ""
                          var currentGroup = ""
                          val quote = 34.toChar().toString()

                          for (line in lines) {
                              val trimmed = line.trim()
                              if (trimmed.startsWith("#EXTINF:")) {
                                  currentExtInf = trimmed
                                  currentName = trimmed.substringAfterLast(",").trim()
                                  val groupPrefix = "group-title=" + quote
                                  currentGroup = if (trimmed.contains(groupPrefix)) {
                                      trimmed.substringAfter(groupPrefix).substringBefore(quote)
                                  } else ""
                              } else if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                                  val cat = mapToTenCategories(currentGroup, currentName)
                                  val ch = Channel(currentName, trimmed, cat)
                                  allFallback.add(ch)
                                  if (is1080pChannel(currentExtInf, currentName)) {
                                      strict1080.add(ch)
                                  }
                              }
                          }

                          val finalChannels = if (strict1080.isNotEmpty()) strict1080 else allFallback

                          runOnUiThread {
                              allChannels.clear()
                              allChannels.addAll(finalChannels)
                              updateCategoriesList()
                              selectCategory(1)
                              if (displayedChannels.isNotEmpty()) {
                                  playChannelObj(displayedChannels[0])
                              } else {
                                  Toast.makeText(this, "Каналы не найдены", Toast.LENGTH_LONG).show()
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this, "Ошибка плейлиста: " + e.message, Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              private fun updateCategoriesList() {
                  val counts = categories.map { cat ->
                      val count = when (cat) {
                          "★ Избранное" -> allChannels.count { favoriteUrls.contains(it.url) }
                          "Все 1080p" -> allChannels.size
                          else -> allChannels.count { it.category == cat }
                      }
                      cat + " (" + count + ")"
                  }
                  categoryAdapter.clear()
                  categoryAdapter.addAll(counts)
                  categoryAdapter.notifyDataSetChanged()
              }

              private fun selectCategory(index: Int) {
                  if (index !in categories.indices) return
                  currentCategoryIndex = index
                  categoryListView.setItemChecked(index, true)
                  val catName = categories[index]

                  displayedChannels.clear()
                  when (catName) {
                      "★ Избранное" -> displayedChannels.addAll(allChannels.filter { favoriteUrls.contains(it.url) })
                      "Все 1080p" -> displayedChannels.addAll(allChannels)
                      else -> displayedChannels.addAll(allChannels.filter { it.category == catName })
                  }

                  refreshChannelAdapter()
              }

              private fun refreshChannelAdapter() {
                  channelAdapter.clear()
                  channelAdapter.addAll(displayedChannels.mapIndexed { i, ch ->
                      val star = if (favoriteUrls.contains(ch.url)) "★ " else ""
                      (i + 1).toString() + ". " + star + ch.name + " [" + ch.category + "]"
                  })
                  channelAdapter.notifyDataSetChanged()
              }

              private fun toggleCurrentSelectedFavorite() {
                  val pos = channelListView.selectedItemPosition
                  val target = if (pos in displayedChannels.indices) displayedChannels[pos] else currentChannel
                  if (target != null) {
                      toggleFavorite(target)
                  }
              }

              private fun toggleFavorite(ch: Channel) {
                  if (favoriteUrls.contains(ch.url)) {
                      favoriteUrls.remove(ch.url)
                      Toast.makeText(this, "Удалено из избранного: " + ch.name, Toast.LENGTH_SHORT).show()
                  } else {
                      favoriteUrls.add(ch.url)
                      Toast.makeText(this, "Добавлено в ★ Избранное: " + ch.name, Toast.LENGTH_SHORT).show()
                  }
                  saveState()
                  updateCategoriesList()
                  selectCategory(currentCategoryIndex)
              }

              private fun playChannelObj(channel: Channel) {
                  currentChannel = channel
                  player?.setMediaItem(MediaItem.fromUri(channel.url))
                  player?.prepare()
                  player?.play()
                  val star = if (favoriteUrls.contains(channel.url)) "★ " else ""
                  showBanner(star + channel.name + " (" + channel.category + ")")
              }

              private fun showBanner(text: String) {
                  currentChannelBanner.text = text
                  currentChannelBanner.visibility = View.VISIBLE
                  currentChannelBanner.removeCallbacks(hideBannerRunnable)
                  currentChannelBanner.postDelayed(hideBannerRunnable, 4000)
              }

              private val hideBannerRunnable = Runnable {
                  currentChannelBanner.visibility = View.GONE
              }

              private fun showSidePanel() {
                  sidePanel.visibility = View.VISIBLE
                  channelListView.requestFocus()
              }

              private fun hideSidePanel() {
                  sidePanel.visibility = View.GONE
              }

              private fun bufferName(): String {
                  return when (bufferLevel) {
                      0 -> "Маленький"
                      2 -> "Большой"
                      else -> "Средний"
                  }
              }

              private fun showSettingsMenu() {
                  val items = arrayOf(
                      "1. Плейлисты (переключение и добавление URL / .m3u8)",
                      "2. Буфер подкачки (текущий: " + bufferName() + ")"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("⚙ Настройки")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> showPlaylistsDialog()
                              1 -> showBufferDialog()
                          }
                      }
                      .setNegativeButton("Закрыть", null)
                      .show()
              }

              private fun showPlaylistsDialog() {
                  val listLabels = playlists.mapIndexed { idx, p ->
                      val mark = if (idx == activePlaylistIndex) "✔ " else "   "
                      val type = if (p.isLocal) "[Файл]" else "[URL]"
                      mark + p.title + " " + type
                  }.toMutableList()

                  listLabels.add("➕ Добавить плейлист по ссылке (URL)")
                  listLabels.add("📂 Добавить файл .m3u / .m3u8 из памяти / флешки")
                  if (playlists.size > 1) {
                      listLabels.add("🗑 Удалить текущий плейлист")
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Управление плейлистами")
                      .setItems(listLabels.toTypedArray()) { _, which ->
                          when {
                              which < playlists.size -> {
                                  activePlaylistIndex = which
                                  saveState()
                                  loadActivePlaylist()
                              }
                              which == playlists.size -> showAddUrlPlaylistDialog()
                              which == playlists.size + 1 -> showLocalFileOptions()
                              else -> {
                                  if (playlists.size > 1) {
                                      playlists.removeAt(activePlaylistIndex)
                                      activePlaylistIndex = 0
                                      saveState()
                                      loadActivePlaylist()
                                  }
                              }
                          }
                      }
                      .setNegativeButton("Назад", null)
                      .show()
              }

              private fun showAddUrlPlaylistDialog() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 16, 32, 16)
                  }
                  val nameInput = EditText(this).apply {
                      hint = "Название (например, Мой Плейлист)"
                      setSingleLine()
                  }
                  val urlInput = EditText(this).apply {
                      hint = "http://... (.m3u или .m3u8)"
                      setSingleLine()
                  }
                  layout.addView(nameInput)
                  layout.addView(urlInput)

                  AlertDialog.Builder(this)
                      .setTitle("Добавить плейлист по ссылке")
                      .setView(layout)
                      .setPositiveButton("Добавить") { _, _ ->
                          val title = nameInput.text.toString().trim().ifEmpty { "Плейлист " + (playlists.size + 1) }
                          val url = urlInput.text.toString().trim()
                          if (url.isNotEmpty()) {
                              playlists.add(PlaylistEntry(title, url, false))
                              activePlaylistIndex = playlists.size - 1
                              saveState()
                              loadActivePlaylist()
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun showLocalFileOptions() {
                  val options = arrayOf(
                      "Выбрать из папки Download / внутренней памяти",
                      "Открыть системный файловый менеджер Android",
                      "Ввести путь к файлу вручную (/sdcard/...)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Добавление файла .m3u / .m3u8")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> scanLocalM3uFiles()
                              1 -> {
                                  try {
                                      val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                          type = "*/*"
                                          addCategory(Intent.CATEGORY_OPENABLE)
                                      }
                                      startActivityForResult(Intent.createChooser(intent, "Выберите .m3u / .m3u8"), FILE_PICK_CODE)
                                  } catch (e: Exception) {
                                      Toast.makeText(this, "Файловый менеджер не найден, используйте поиск", Toast.LENGTH_LONG).show()
                                      scanLocalM3uFiles()
                                  }
                              }
                              2 -> showManualFilePathDialog()
                          }
                      }
                      .show()
              }

              private fun scanLocalM3uFiles() {
                  val foundFiles = mutableListOf<File>()
                  val roots = listOf(
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                      Environment.getExternalStorageDirectory(),
                      File("/storage")
                  )
                  for (r in roots) {
                      try {
                          r.walkTopDown().maxDepth(3).forEach { file ->
                              if (file.isFile && (file.name.endsWith(".m3u", true) || file.name.endsWith(".m3u8", true))) {
                                  if (!foundFiles.any { it.absolutePath == file.absolutePath }) {
                                      foundFiles.add(file)
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }

                  if (foundFiles.isEmpty()) {
                      Toast.makeText(this, "Файлы .m3u/.m3u8 в памяти не найдены", Toast.LENGTH_LONG).show()
                      showManualFilePathDialog()
                      return
                  }

                  val names = foundFiles.map { it.name + " (" + it.parent + ")" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Найденные файлы .m3u / .m3u8")
                      .setItems(names) { _, idx ->
                          val file = foundFiles[idx]
                          playlists.add(PlaylistEntry(file.name, file.absolutePath, true))
                          activePlaylistIndex = playlists.size - 1
                          saveState()
                          loadActivePlaylist()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun showManualFilePathDialog() {
                  val input = EditText(this).apply {
                      setText("/sdcard/Download/playlist.m3u8")
                      setSingleLine()
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Путь к локальному файлу .m3u8")
                      .setView(input)
                      .setPositiveButton("Добавить") { _, _ ->
                          val path = input.text.toString().trim()
                          if (path.isNotEmpty()) {
                              val name = path.substringAfterLast("/")
                              playlists.add(PlaylistEntry(name, path, true))
                              activePlaylistIndex = playlists.size - 1
                              saveState()
                              loadActivePlaylist()
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == FILE_PICK_CODE && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      val name = uri.lastPathSegment?.substringAfterLast("/") ?: "Локальный .m3u8"
                      playlists.add(PlaylistEntry(name, uri.toString(), true))
                      activePlaylistIndex = playlists.size - 1
                      saveState()
                      loadActivePlaylist()
                  }
              }

              private fun showBufferDialog() {
                  val levels = arrayOf(
                      "Маленький (2–6 сек) — быстрое переключение",
                      "Средний (12–28 сек) — оптимально для 1080p",
                      "Большой (30–60 сек) — защита от зависаний"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Буфер подкачки видео")
                      .setSingleChoiceItems(levels, bufferLevel) { dialog, which ->
                          bufferLevel = which
                          saveState()
                          activePlaylistLabel.text = "Плейлист: " + playlists[activePlaylistIndex].title + " | Буфер: " + bufferName()
                          initPlayer()
                          Toast.makeText(this, "Буфер изменён: " + bufferName(), Toast.LENGTH_SHORT).show()
                          dialog.dismiss()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun saveState() {
                  val prefs = getSharedPreferences("iptv_v2_prefs", Context.MODE_PRIVATE)
                  val arr = JSONArray()
                  for (p in playlists) {
                      val obj = JSONObject()
                      obj.put("title", p.title)
                      obj.put("source", p.source)
                      obj.put("isLocal", p.isLocal)
                      arr.put(obj)
                  }
                  prefs.edit()
                      .putString("playlists_json", arr.toString())
                      .putInt("active_playlist", activePlaylistIndex)
                      .putInt("buffer_level", bufferLevel)
                      .putStringSet("favorites", favoriteUrls.toSet())
                      .apply()
              }

              private fun loadSavedState() {
                  val prefs = getSharedPreferences("iptv_v2_prefs", Context.MODE_PRIVATE)
                  bufferLevel = prefs.getInt("buffer_level", 1)
                  activePlaylistIndex = prefs.getInt("active_playlist", 0)
                  val favs = prefs.getStringSet("favorites", emptySet()) ?: emptySet()
                  favoriteUrls.clear()
                  favoriteUrls.addAll(favs)

                  playlists.clear()
                  val jsonStr = prefs.getString("playlists_json", null)
                  if (!jsonStr.isNullOrEmpty()) {
                      try {
                          val arr = JSONArray(jsonStr)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              playlists.add(
                                  PlaylistEntry(
                                      o.getString("title"),
                                      o.getString("source"),
                                      o.getBoolean("isLocal")
                                  )
                              )
                          }
                      } catch (_: Exception) {}
                  }
                  if (playlists.isEmpty()) {
                      playlists.add(PlaylistEntry("Русские 1080p (Встроенный)", defaultRusUrl, false))
                  }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (sidePanel.visibility == View.GONE) {
                      when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_DPAD_LEFT -> {
                              showSidePanel()
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_UP -> {
                              if (displayedChannels.isNotEmpty()) {
                                  val idx = displayedChannels.indexOfFirst { it.url == currentChannel?.url }
                                  val next = if (idx <= 0) displayedChannels.size - 1 else idx - 1
                                  playChannelObj(displayedChannels[next])
                              }
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_DOWN -> {
                              if (displayedChannels.isNotEmpty()) {
                                  val idx = displayedChannels.indexOfFirst { it.url == currentChannel?.url }
                                  val next = (idx + 1) % displayedChannels.size
                                  playChannelObj(displayedChannels[next])
                              }
                              return true
                          }
                      }
                  } else {
                      if (keyCode == KeyEvent.KEYCODE_BACK) {
                          hideSidePanel()
                          return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
              }
          }
          ''')
