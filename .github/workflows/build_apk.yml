              private fun openFolderExplorerModal(dir: File) {
                  requestStoragePermissionsIfNeeded()
                  currentBrowseDir = dir
                  subModalTitle.text = "📂 Проводник: " + dir.absolutePath
                  subModalInputContainer.visibility = View.GONE
                  subModalList.visibility = View.VISIBLE
                  subModalTopButtons.visibility = View.VISIBLE
                  subModalTopButtons.removeAllViews()

                  subModalTopButtons.addView(makeModernButton("📥 Download") {
                      openFolderExplorerModal(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS))
                  })
                  subModalTopButtons.addView(makeModernButton("🏠 Память (/sdcard)") {
                      openFolderExplorerModal(Environment.getExternalStorageDirectory())
                  })
                  subModalTopButtons.addView(makeModernButton("🔌 USB (/storage)") {
                      openFolderExplorerModal(File("/storage"))
                  })
                  subModalTopButtons.addView(makeModernButton("⌨ Путь вручную") {
                      openInputSubModal("Путь к файлу .m3u / .m3u8", "/sdcard/Download/playlist.m3u8") { path ->
                          addLocalPlaylistFile(File(path))
                      }
                  })

                  val entries = mutableListOf<Pair<String, File?>>()
                  val parent = dir.parentFile
                  if (parent != null && parent.canRead()) {
                      entries.add(Pair("⬆  .. [На уровень вверх]", parent))
                  }

                  val rawChildren = try {
                      dir.listFiles()?.toList() ?: emptyList()
                  } catch (_: Exception) {
                      emptyList()
                  }

                  val dirs = rawChildren.filter { it.isDirectory && !it.name.startsWith(".") }.sortedBy { it.name.lowercase() }
                  val files = rawChildren.filter {
                      it.isFile && (it.name.endsWith(".m3u", true) || it.name.endsWith(".m3u8", true) || it.name.endsWith(".txt", true))
                  }.sortedBy { it.name.lowercase() }

                  for (d in dirs) {
                      entries.add(Pair("📁  " + d.name, d))
                  }
                  for (f in files) {
                      entries.add(Pair("📄  " + f.name + "  (" + (f.length() / 1024) + " КБ)", f))
                  }

                  if (entries.isEmpty()) {
                      entries.add(Pair("⚠ Папка пуста или нет доступа (нажмите 🏠 Память или ⌨ Путь вручную)", null))
                  }

                  val labels = entries.map { it.first }.toMutableList()
                  subModalList.adapter = createCompactAdapter(labels, 14f)
                  subModalList.setOnItemClickListener { _, _, idx, _ ->
                      resetMenuInactivityTimer()
                      val target = entries.getOrNull(idx)?.second ?: return@setOnItemClickListener
                      if (target.isDirectory) {
                          openFolderExplorerModal(target)
                      } else if (target.isFile) {
                          addLocalPlaylistFile(target)
                      }
                  }
                  subModalOverlay.visibility = View.VISIBLE
                  subModalList.requestFocus()
              }

              private fun addLocalPlaylistFile(file: File) {
                  if (!file.exists() || !file.canRead()) {
                      Toast.makeText(this, "Не удалось прочитать файл: ${file.absolutePath}", Toast.LENGTH_LONG).show()
                      return
                  }
                  playlists.add(PlaylistEntry(file.name, file.absolutePath, true))
                  activePlaylistIndex = playlists.size - 1
                  saveState()
                  closeAllMenus()
                  loadActivePlaylist(autoPlayLast = false)
                  Toast.makeText(this, "Добавлен плейлист: ${file.name}", Toast.LENGTH_SHORT).show()
              }

