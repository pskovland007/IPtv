              private fun enableTrueFullScreenImmersion() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          window.attributes = window.attributes.apply {
                              layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                          }
                      }
                      window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)

                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                      )

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          window.setDecorFitsSystemWindows(false)
                          window.insetsController?.let { controller ->
                              controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                              controller.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          }
                      }
                  } catch (_: Exception) {}
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      enableTrueFullScreenImmersion()
                  }
              }

              private fun applyScreenAspectMode() {
                  when (screenAspectMode) {
                      0 -> {
                          playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                          player?.videoScalingMode = C.VIDEO_SCALING_MODE_SCALE_TO_FIT
                      }
                      1 -> {
                          playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL
                          player?.videoScalingMode = C.VIDEO_SCALING_MODE_SCALE_TO_FIT
                      }
                      else -> {
                          playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                          player?.videoScalingMode = C.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING
                      }
                  }
              }

              private fun screenAspectModeName(): String = when (screenAspectMode) {
                  0 -> "По размеру экрана (без обрезки)"
                  1 -> "Растянуть на весь экран"
                  else -> "Кинозум (увеличение)"
              }

              private fun openStreamWithRussiaBypass(rawUrl: String, timeoutMs: Int = 7000): InputStream {
                  val conn = URL(rawUrl).openConnection() as HttpURLConnection
                  conn.setRequestProperty("User-Agent", russianSmartTvAgents[userAgentIndex % russianSmartTvAgents.size])
                  conn.setRequestProperty("Accept", "*/*")
                  conn.setRequestProperty("Connection", "keep-alive")
                  conn.instanceFollowRedirects = true
                  conn.connectTimeout = timeoutMs
                  conn.readTimeout = timeoutMs
                  if (conn.responseCode in 200..299) {
                      return conn.inputStream
                  }
                  throw Exception("HTTP ${conn.responseCode}")
              }

